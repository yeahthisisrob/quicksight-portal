  /api/jobs:
    get:
      operationId: getJobs
      summary: Recent jobs
      description: |
        Exports, activity refreshes, SMUS exports, bulk operations, CSV
        exports, deployments and planner calls, newest first. Anything that
        returned a `jobId` can be followed here.
      tags: [Jobs]
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/JobType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: limit
          in: query
          schema:
            type: integer
        - name: afterDate
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jobs/{jobId}:
    get:
      operationId: getJobsByJobId
      summary: One job's status and progress
      description: Poll this until `status` is `completed`, `failed` or `stopped`.
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteJobsByJobId
      summary: Delete a finished job's record
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jobs/{jobId}/logs:
    get:
      operationId: getJobsByJobIdLogs
      summary: A job's log lines
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobLog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jobs/{jobId}/result:
    get:
      operationId: getJobsByJobIdResult
      summary: What a job produced
      description: |
        The shape depends on the job: a `Proposal` for a planner asked about
        an asset, a `NewAssetPreview` for a planner asked to propose visuals,
        a download descriptor for a CSV export, a summary for a bulk
        operation. 404 until the job completes, or when it produced nothing.
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    anyOf:
                      - $ref: '#/components/schemas/AssistantChatResult'
                      - $ref: '#/components/schemas/Proposal'
                      - $ref: '#/components/schemas/NewAssetPreview'
                      - type: object
                        additionalProperties: true
                        description: Other jobs' results (a CSV download, a bulk summary).
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jobs/{jobId}/stop:
    post:
      operationId: postJobsByJobIdStop
      summary: Ask a running job to stop at its next checkpoint
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Authoring - a definition the caller built themselves
  # ---------------------------------------------------------------------------
  /api/authoring/definition/preview:
    post:
      operationId: postAuthoringDefinitionPreview
      summary: Check a definition you built, before writing it anywhere
      description: |
        For an agent that read a cached export, edited the JSON itself, and
        wants to publish: every dataset the definition declares is read,
        every referenced column resolved against it, and everything
        QuickSight would refuse is listed with a fix where one is clear
        (the same checks the Author page runs). Nothing is written.
      tags: [Authoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionRequest'
      responses:
        '200':
          description: What would stop a write, and the sheets as they would be
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/definition:
    post:
      operationId: postAuthoringDefinition
      summary: A new dashboard or analysis from a definition you built
      description: |
        The preview's checks, then the write through the same path as every
        other authoring call: the audience of `permissionsFrom` (without one
        only account admins see it), a dashboard's first version published,
        provenance recorded and tagged. Refused, with the issues, when the
        preview would show any.
      tags: [Authoring]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDefinitionRequest'
      responses:
        '200':
          description: The asset that was created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/definition/preview:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdDefinitionPreview
      summary: Check a definition you built for an existing asset
      description: Same as `/api/authoring/definition/preview`; the path names the asset it is for.
      tags: [Authoring]
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionRequest'
      responses:
        '200':
          description: What would stop a write, and the sheets as they would be
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/definition:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdDefinition
      summary: Write a definition you built onto an existing asset, in place or as a copy
      description: |
        `mode: update` rewrites the asset (name, theme and publish options
        kept unless given; a dashboard's new version is published). `mode:
        clone` creates a copy with the source's audience (or that of
        `permissionsFrom`), optionally in a folder. Refused, with the
        issues, when the preview would show any.
      tags: [Authoring]
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionApplyRequest'
      responses:
        '200':
          description: The asset that was written
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionApplyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Assets - permissions, archive, index, bulk delete
  # ---------------------------------------------------------------------------
  /api/assets/{assetType}/{assetId}/grant-permissions:
    post:
      operationId: postAssetsByAssetTypeByAssetIdGrantPermissions
      summary: Give principals actions on an asset (queues a job)
      description: |
        The mirror of revoke. Each grant is a QuickSight principal ARN (a
        user or a group) and the actions to grant; the portal's cache learns
        the new principals when the job completes.
      tags: [Assets]
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PrincipalActions'
      responses:
        '202':
          $ref: '#/components/responses/BulkJobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/archive/{assetType}/{assetId}/metadata:
    get:
      operationId: getAssetsArchiveByAssetTypeByAssetIdMetadata
      summary: An archived asset's export, for a restore preview
      tags: [Assets]
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder, user, group]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The archived export
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/rebuild-index:
    post:
      operationId: postAssetsRebuildIndex
      summary: Rebuild the portal's asset index from the exports (queues a job)
      tags: [Assets]
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/bulk-delete:
    post:
      operationId: postAssetsBulkDelete
      summary: Delete assets and archive their exports (queues a job)
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assets]
              properties:
                assets:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/AssetRef'
                reason:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/BulkJobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/bulk-delete/validate:
    post:
      operationId: postAssetsBulkDeleteValidate
      summary: What still depends on these assets, before deleting them
      tags: [Assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assets]
              properties:
                assets:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/AssetRef'
      responses:
        '200':
          description: Dependencies per asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Tags
  # ---------------------------------------------------------------------------
  /api/tags/{assetType}/{assetId}:
    get:
      operationId: getTagsByAssetTypeByAssetId
      summary: An asset's tags, live from QuickSight
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/TaggableAssetType'
        - $ref: '#/components/parameters/TaggedAssetId'
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putTagsByAssetTypeByAssetId
      summary: Replace an asset's tags
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/TaggableAssetType'
        - $ref: '#/components/parameters/TaggedAssetId'
      requestBody:
        $ref: '#/components/requestBodies/Tags'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postTagsByAssetTypeByAssetId
      summary: Add tags to an asset
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/TaggableAssetType'
        - $ref: '#/components/parameters/TaggedAssetId'
      requestBody:
        $ref: '#/components/requestBodies/Tags'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteTagsByAssetTypeByAssetId
      summary: Remove tags from an asset by key
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/TaggableAssetType'
        - $ref: '#/components/parameters/TaggedAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagKeys]
              properties:
                tagKeys:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tags/batch:
    post:
      operationId: postTagsBatch
      summary: Tags for many assets in one call
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assets]
              properties:
                assets:
                  type: array
                  items:
                    $ref: '#/components/schemas/AssetRef'
      responses:
        '200':
          description: Tags per asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tags/bulk:
    post:
      operationId: postTagsBulk
      summary: Add, replace or remove tags on many assets (queues a job)
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetType, assetIds, operation]
              properties:
                assetType:
                  type: string
                assetIds:
                  type: array
                  items:
                    type: string
                operation:
                  type: string
                  enum: [add, update, remove]
                tags:
                  type: array
                  description: For add and update.
                  items:
                    $ref: '#/components/schemas/Tag'
                tagKeys:
                  type: array
                  description: For remove.
                  items:
                    type: string
      responses:
        '202':
          $ref: '#/components/responses/BulkJobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tags/refresh:
    post:
      operationId: postTagsRefresh
      summary: Re-read tags from QuickSight into the cache
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetType, assetIds]
              properties:
                assetType:
                  type: string
                assetIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: How many assets' tags were re-read
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [successful, failed, total]
                    properties:
                      successful:
                        type: integer
                      failed:
                        type: integer
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Folders and groups
  # ---------------------------------------------------------------------------
  /api/folders/{folderId}/assets/bulk:
    post:
      operationId: postFoldersByFolderIdAssetsBulk
      summary: Add many assets to a folder (queues a job)
      tags: [Folders]
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/AssetRefs'
      responses:
        '202':
          $ref: '#/components/responses/BulkJobQueued'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteFoldersByFolderIdAssetsBulk
      summary: Remove many assets from a folder (queues a job)
      tags: [Folders]
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/AssetRefs'
      responses:
        '202':
          $ref: '#/components/responses/BulkJobQueued'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/groups:
    post:
      operationId: postGroups
      summary: Create a QuickSight group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupName]
              properties:
                groupName:
                  type: string
                description:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/groups/{groupName}:
    put:
      operationId: putGroupsByGroupName
      summary: Change a group's description
      tags: [Groups]
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteGroupsByGroupName
      summary: Delete a group
      tags: [Groups]
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Deployments - restore archived assets
  # ---------------------------------------------------------------------------
  /api/deployments:
    post:
      operationId: postDeployments
      summary: Deploy (restore) an asset from its archived export (queues a job)
      tags: [Deployments]
      requestBody:
        $ref: '#/components/requestBodies/Deployment'
      responses:
        '202':
          description: Queued; follow the job under /api/jobs/{jobId}
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/deployments/validate:
    post:
      operationId: postDeploymentsValidate
      summary: Check a deployment without running it
      tags: [Deployments]
      requestBody:
        $ref: '#/components/requestBodies/Deployment'
      responses:
        '200':
          description: Validation findings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [validationResults, canDeploy]
                    properties:
                      validationResults:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeploymentValidationResult'
                      canDeploy:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/deployments/history:
    get:
      operationId: getDeploymentsHistory
      summary: Past deployments
      tags: [Deployments]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: assetType
          in: query
          schema:
            type: string
        - name: assetId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deployments, newest first
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/deployments/templates:
    get:
      operationId: getDeploymentsTemplates
      summary: Manifest templates for common deployments
      tags: [Deployments]
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/deployments/jobs/{jobId}:
    get:
      operationId: getDeploymentsJobsByJobId
      summary: A deployment job's status (same record as /api/jobs/{jobId})
      tags: [Deployments]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/deployments/jobs/{jobId}/stop:
    post:
      operationId: postDeploymentsJobsByJobIdStop
      summary: Stop a deployment job
      tags: [Deployments]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Data catalog - the older field-level views and field tags
  # ---------------------------------------------------------------------------
  /api/data-catalog:
    get:
      operationId: getDataCatalog
      summary: The field catalog, paginated (the older view; prefer /api/data-catalog/full)
      tags: [Data Catalog]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: viewMode
          in: query
          schema:
            type: string
        - name: forceRebuild
          in: query
          schema:
            type: boolean
        - name: tagFilter
          in: query
          schema:
            type: string
        - name: includeTags
          in: query
          schema:
            type: string
        - name: excludeTags
          in: query
          schema:
            type: string
        - name: assetIds
          in: query
          schema:
            type: string
        - name: includeAnalyses
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: A page of fields
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/fields:
    get:
      operationId: getDataCatalogFields
      summary: Fields across datasets, analyses and dashboards, paginated
      tags: [Data Catalog]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: sourceType
          in: query
          schema:
            type: string
        - name: dataType
          in: query
          schema:
            type: string
        - name: isCalculated
          in: query
          schema:
            type: boolean
        - name: searchTerm
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of fields
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/visual-fields/rebuild:
    post:
      operationId: postDataCatalogVisualFieldsRebuild
      summary: Rebuild the cache behind the visual field catalog
      tags: [Data Catalog]
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/field/{sourceType}/{sourceId}/{fieldName}:
    get:
      operationId: getDataCatalogFieldBySourceTypeBySourceIdByFieldName
      summary: One field's portal metadata (tags, notes)
      tags: [Data Catalog]
      parameters:
        - $ref: '#/components/parameters/FieldSourceType'
        - $ref: '#/components/parameters/FieldSourceId'
        - $ref: '#/components/parameters/FieldName'
      responses:
        '200':
          description: The metadata; `data` is absent when nothing was recorded for the field.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FieldMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putDataCatalogFieldBySourceTypeBySourceIdByFieldName
      summary: Update a field's portal metadata
      description: The fields sent replace the stored ones; fields left out are kept.
      tags: [Data Catalog]
      parameters:
        - $ref: '#/components/parameters/FieldSourceType'
        - $ref: '#/components/parameters/FieldSourceId'
        - $ref: '#/components/parameters/FieldName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMetadataUpdate'
      responses:
        '200':
          description: The metadata as stored
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FieldMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postDataCatalogFieldBySourceTypeBySourceIdByFieldName
      summary: Add tags to a field
      tags: [Data Catalog]
      parameters:
        - $ref: '#/components/parameters/FieldSourceType'
        - $ref: '#/components/parameters/FieldSourceId'
        - $ref: '#/components/parameters/FieldName'
      requestBody:
        $ref: '#/components/requestBodies/FieldTags'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteDataCatalogFieldBySourceTypeBySourceIdByFieldName
      summary: Remove tags from a field
      tags: [Data Catalog]
      parameters:
        - $ref: '#/components/parameters/FieldSourceType'
        - $ref: '#/components/parameters/FieldSourceId'
        - $ref: '#/components/parameters/FieldName'
      requestBody:
        $ref: '#/components/requestBodies/FieldTags'
      responses:
        '200':
          $ref: '#/components/responses/Acknowledged'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/fields/search-by-tags:
    post:
      operationId: postDataCatalogFieldsSearchByTags
      summary: Fields carrying any of these tags
      tags: [Data Catalog]
      requestBody:
        $ref: '#/components/requestBodies/FieldTags'
      responses:
        '200':
          description: Matching fields
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
  
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    TaggableAssetType:
      name: assetType
      in: path
      required: true
      schema:
        type: string
        enum: [dashboard, analysis, dataset, datasource, folder, user, group]
    TaggedAssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    FieldSourceType:
      name: sourceType
      in: path
      required: true
      schema:
        type: string
        enum: [dataset, analysis, dashboard]
    FieldSourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    FieldName:
      name: fieldName
      in: path
      required: true
      schema:
        type: string
    AuthorableAssetType:
      name: assetType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthorableAssetType'
    AuthoringAssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string

  schemas:
    AiModelKey:
      type: string
      enum: [haiku-4-5, sonnet-4-6, sonnet-5, opus-5, openai]

    AiModel:
      type: object
      required: [key, label, provider, modelId, price, bestFor, thinks, available, typicalCost]
      properties:
        key:
          $ref: '#/components/schemas/AiModelKey'
        label:
          type: string
        provider:
          type: string
          enum: [bedrock, openai]
        modelId:
          type: string
        price:
          type: object
          description: List dollars per million tokens.
          required: [input, output]
          properties:
            input:
              type: number
            output:
              type: number
        bestFor:
          type: string
        thinks:
          type: boolean
        available:
          type: boolean
        unavailableReason:
          type: string
        typicalCost:
          type: object
          description: Rough dollars for one typical call of each kind.
          required: [authoring, chat]
          properties:
            authoring:
              type: number
            chat:
              type: number

    AiModelCatalog:
      type: object
      required: [models, defaults, note]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModel'
        defaults:
          type: object
          required: [authoring, chat]
          properties:
            authoring:
              $ref: '#/components/schemas/AiModelKey'
            chat:
              $ref: '#/components/schemas/AiModelKey'
        note:
          type: string

    AssistantChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [role, text]
            properties:
              role:
                type: string
                enum: [user, assistant]
              text:
                type: string
        model:
          $ref: '#/components/schemas/AiModelKey'
        authoringModel:
          $ref: '#/components/schemas/AiModelKey'
        threadId:
          type: string
          description: The conversation (AG-UI threadId).
        state:
          $ref: '#/components/schemas/AssistantWorkingState'
        resume:
          type: array
          maxItems: 20
          description: Answers to the interrupts the previous run ended with (AG-UI resume).
          items:
            $ref: '#/components/schemas/AgUiResumeEntry'

    AssistantWorkingState:
      type: object
      description: |
        What the page holds between answers (AG-UI state): plans drawn so
        far (so "go" acts on the plan drawn earlier), actions the assistant
        prepared that were not run (the working draft), and actions the
        person ran, with their results. Large bodies are clipped.
      properties:
        plans:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, title, build]
            properties:
              id:
                type: string
              title:
                type: string
              build:
                $ref: '#/components/schemas/AssistantPlanBuild'
        drafts:
          type: array
          maxItems: 20
          items:
            type: object
            required: [title, method, path]
            properties:
              title:
                type: string
              method:
                type: string
              path:
                type: string
              body: {}
        ran:
          type: array
          maxItems: 20
          items:
            type: object
            required: [title, method, path, status]
            properties:
              title:
                type: string
              method:
                type: string
              path:
                type: string
              status:
                type: string
                enum: [done, failed, running]
              result: {}
              error:
                type: string
              jobId:
                type: string

    AgUiInterrupt:
      type: object
      description: |
        Why a run paused (AG-UI 1.0 Interrupt). `input_required`: a question
        to the person; `metadata.options` are drawn as cards and the answer
        must match `responseSchema`.
      required: [id, reason]
      properties:
        id:
          type: string
        reason:
          type: string
        message:
          type: string
        toolCallId:
          type: string
        responseSchema:
          type: object
          additionalProperties: true
        metadata:
          type: object
          properties:
            options:
              type: array
              items:
                $ref: '#/components/schemas/AssistantQuestionOption'
            multi:
              type: boolean
            allowOther:
              type: boolean

    AssistantQuestionOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: The entity id when the option names one.
        label:
          type: string
        description:
          type: string
        entityId:
          type: string
        summary:
          type: string
        path:
          type: string

    AgUiResumeEntry:
      type: object
      description: An answer to an interrupt (AG-UI 1.0 ResumeEntry).
      required: [interruptId, status]
      properties:
        interruptId:
          type: string
        status:
          type: string
          enum: [resolved, cancelled]
        payload: {}

    AgUiRunOutcome:
      type: object
      description: How a run ended (AG-UI 1.0 RunFinished outcome).
      required: [type]
      properties:
        type:
          type: string
          enum: [success, interrupt]
        interrupts:
          type: array
          items:
            $ref: '#/components/schemas/AgUiInterrupt'

    SmusDataSourceChoice:
      type: object
      required: [dataSource, athena]
      properties:
        dataSource:
          type: object
          nullable: true
          required: [id, name, arn, usedBy, reason]
          properties:
            id:
              type: string
            name:
              type: string
            arn:
              type: string
            usedBy:
              type: integer
              description: SMUS-linked datasets that read through it.
            reason:
              type: string
        athena:
          type: array
          items:
            type: object
            required: [id, name, usedBy]
            properties:
              id:
                type: string
              name:
                type: string
              usedBy:
                type: integer

    PlanStatus:
      type: string
      enum: [existing, new, edited]

    FieldVerdict:
      type: object
      description: |
        A calculated field a change adds, placed by the organisation's
        field strategy (Settings, guidance.fieldStrategy): `use-column`
        (row-level and the dataset already has the column), `push-down`
        (row-level; the source should materialise it), `dataset` (row-level;
        it belongs in the QuickSight dataset), `row-level` (row-level, no
        stated preference) or `analysis` (aggregates, table or level-aware,
        or reads a parameter).
      required: [name, expression, verdict, note]
      properties:
        name:
          type: string
        expression:
          type: string
        dataset:
          type: string
        verdict:
          type: string
          enum: [use-column, push-down, dataset, row-level, analysis]
        column:
          type: string
        note:
          type: string

    AssistantArtifact:
      type: object
      description: |
        Something to show, by reference. `preview`: re-run this read-only
        preview call and draw its definition as a wireframe. `asset`: draw
        the dashboard or analysis as it is. `lineage`: draw the calculated
        field's lineage from GET /api/data-catalog/calculated-fields/{fieldKey}.
        `plan`: what a change builds - its lineage (listings, datasets, the
        analysis or dashboard) and `build`, the exact write that carries it
        out, which is what the person runs. `fields`: the calculated fields
        it adds, each placed by the organisation's field strategy.
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [preview, asset, lineage, plan, fields]
        sources:
          type: array
          items:
            type: object
            required: [listing]
            properties:
              listing:
                type: string
              project:
                type: string
              table:
                type: string
        datasets:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              id:
                type: string
              status:
                type: string
                enum: [existing, new]
              dataSource:
                type: string
        calculatedFields:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              expression:
                type: string
              status:
                type: string
                enum: [existing, new]
              dataset:
                type: string
        asset:
          type: object
          required: [kind, name, status]
          properties:
            kind:
              type: string
              enum: [dashboard, analysis]
            name:
              type: string
            id:
              type: string
            status:
              $ref: '#/components/schemas/PlanStatus'
        build:
          $ref: '#/components/schemas/AssistantPlanBuild'
        filters:
          type: array
          description: plan - the filters its build adds, for drawing (the build is what runs).
          items:
            type: object
            required: [column]
            properties:
              column:
                type: string
              title:
                type: string
              control:
                $ref: '#/components/schemas/FilterControlKind'
              placement:
                $ref: '#/components/schemas/ControlPlacement'
        model:
          description: plan - the model that drew it.
          type: object
          required: [key, label]
          properties:
            key:
              $ref: '#/components/schemas/AiModelKey'
            label:
              type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldVerdict'
        title:
          type: string
        method:
          type: string
        path:
          type: string
        body:
          type: object
          additionalProperties: true
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        fieldKey:
          type: string

    AssistantPlanBuild:
      type: object
      description: |
        The exact write a plan carries out: a new asset (`create`, the body
        of POST /api/authoring/new), or a change to an existing one (`edit`:
        the body of POST /api/authoring/{assetType}/{assetId}/rebind - ops,
        a rebind onto other datasets, a copy, a template). Checked against
        the contract and rehearsed through the matching preview when the plan
        is drawn; the Run button sends it unchanged.
      oneOf:
        - required: [create]
        - required: [edit]
      properties:
        create:
          $ref: '#/components/schemas/NewAssetRequest'
        edit:
          type: object
          required: [assetType, assetId, request]
          properties:
            assetType:
              type: string
              enum: [dashboard, analysis]
            assetId:
              type: string
            request:
              $ref: '#/components/schemas/ApplyRebindRequest'

    AssistantAction:
      type: object
      description: A write the assistant prepared; the person runs it with their own session.
      required: [id, title, why, method, path]
      properties:
        id:
          type: string
        title:
          type: string
        why:
          type: string
        method:
          type: string
          enum: [POST, PUT, DELETE]
        path:
          type: string
        body:
          type: object
          additionalProperties: true
        previewId:
          type: string
          description: The preview artifact this action publishes.
        planId:
          type: string
          description: The plan artifact this action carries out.

    AssistantChatResult:
      type: object
      required: [reply, calls, actions, artifacts, model, usage, cost, rounds, outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/AgUiRunOutcome'
        helpers:
          type: array
          description: Other models the answer used through the portal, such as the planner.
          items:
            type: object
            required: [role, label, modelId, provider]
            properties:
              role:
                type: string
                enum: [planner]
              label:
                type: string
              modelId:
                type: string
              provider:
                type: string
        reply:
          type: string
        calls:
          type: array
          items:
            type: object
            required: [method, path, status, ok]
            properties:
              method:
                type: string
              path:
                type: string
              status:
                type: integer
              ok:
                type: boolean
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AssistantAction'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/AssistantArtifact'
        model:
          type: object
          required: [key, label, modelId]
          properties:
            key:
              $ref: '#/components/schemas/AiModelKey'
            label:
              type: string
            modelId:
              type: string
        usage:
          type: object
          required: [inputTokens, outputTokens]
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer
        cost:
          type: number
          description: Dollars at list price; a rough guide.
        rounds:
          type: integer

    JobType:
      type: string
      enum: [export, deploy, ingestion, rebuild, activity-refresh, bulk-operation, csv-export, smus-export, planner, assistant, asset-refresh]

    Job:
      type: object
      description: One background job, as /api/jobs returns it.
      required: [jobId, jobType, status, startTime]
      additionalProperties: true
      properties:
        lastUpdatedTime:
          type: string
          format: date-time
          description: |
            Heartbeat - stamped on every job write. The UI uses it to show
            worker liveness ("active Ns ago") and flag stalled jobs.
        duration:
          type: integer
          description: Duration in milliseconds
          nullable: true
        stats:
          type: object
          properties:
            totalAssets:
              type: integer
            processedAssets:
              type: integer
            failedAssets:
              type: integer
            apiCalls:
              type: integer
            operations:
              type: object
              description: Counts by operation, for jobs that track them.
              additionalProperties:
                type: integer
        failures:
          type: array
          description: |
            Item-level failures for bulk jobs (capped; the full list is on
            the job result). Present only when at least one item failed.
          items:
            $ref: '#/components/schemas/BulkItemFailure'
        phases:
          type: array
          description: |
            Optional step-based progress. Present for jobs that emit phases
            (e.g. activity-refresh). Older job types omit this field.
          items:
            $ref: '#/components/schemas/JobPhase'
        checkpoint:
          type: object
          description: |
            Resumable-export progress (export jobs only). Written after
            each asset type completes so continuation invocations resume
            where the previous one paused; the UI renders it as per-type
            progress.
          properties:
            completedAssetTypes:
              type: array
              items:
                type: string
            hydratedAssetTypes:
              type: array
              items:
                type: string
            catalogPending:
              type: boolean
            totalProcessed:
              type: integer
            updatedAt:
              type: string
              format: date-time
        jobId:
          type: string
        jobType:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: number
        message:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        error:
          type: string
        errorStack:
          type: string
        userId:
          type: string
        accountId:
          type: string
        assetType:
          type: string
          description: Deploy jobs - the asset deployed.
        assetId:
          type: string
          description: Deploy jobs - the asset deployed.
        deploymentType:
          type: string
          description: Deploy jobs - restore, clone, and so on.
        exportOptions:
          type: object
          description: Export jobs - the options the export was started with.
          additionalProperties: true
        stopRequested:
          type: boolean
          description: A stop was asked for; the job stops at its next checkpoint.

    JobLog:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warn, error, debug]
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AssetRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [dashboard, analysis, dataset, datasource, folder, user, group]
        id:
          type: string
        name:
          type: string

    PrincipalActions:
      type: object
      required: [principal, actions]
      properties:
        principal:
          type: string
          description: A QuickSight user or group ARN.
        actions:
          type: array
          items:
            type: string

    DefinitionRequest:
      type: object
      required: [definition]
      properties:
        definition:
          type: object
          additionalProperties: true
          description: A full QuickSight AnalysisDefinition or DashboardVersionDefinition.

    DefinitionApplyRequest:
      allOf:
        - $ref: '#/components/schemas/DefinitionRequest'
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [update, clone]
            name:
              type: string
              description: Required for clone; an optional rename for update.
            newAssetId:
              type: string
            folderId:
              type: string
              description: Clone only.
            themeArn:
              type: string
            permissionsFrom:
              type: object
              description: Clone only; defaults to the source's audience.
              required: [assetType, assetId]
              properties:
                assetType:
                  $ref: '#/components/schemas/AuthorableAssetType'
                assetId:
                  type: string

    NewDefinitionRequest:
      allOf:
        - $ref: '#/components/schemas/DefinitionRequest'
        - type: object
          required: [assetType, name]
          properties:
            assetType:
              $ref: '#/components/schemas/AuthorableAssetType'
            name:
              type: string
            newAssetId:
              type: string
            folderId:
              type: string
            themeArn:
              type: string
            permissionsFrom:
              type: object
              required: [assetType, assetId]
              properties:
                assetType:
                  $ref: '#/components/schemas/AuthorableAssetType'
                assetId:
                  type: string

    DefinitionDatasetCheck:
      type: object
      required: [identifier, dataSetId, readable, referenced, missing]
      properties:
        identifier:
          type: string
        dataSetId:
          type: string
        name:
          type: string
        readable:
          type: boolean
        referenced:
          type: integer
        missing:
          type: array
          items:
            type: string

    DefinitionPreview:
      type: object
      required: [datasets, issues, summary, outline, warnings, canApply]
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionDatasetCheck'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RepairIssue'
        summary:
          type: object
          required: [fixable, needsChoice, unfixable]
          properties:
            fixable:
              type: integer
            needsChoice:
              type: integer
            unfixable:
              type: integer
        outline:
          type: array
          items:
            $ref: '#/components/schemas/SheetOutline'
        warnings:
          type: array
          items:
            type: string
        canApply:
          type: boolean

    DefinitionApplyResult:
      type: object
      required: [assetType, assetId, name, arn, mode, warnings]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        name:
          type: string
        arn:
          type: string
        versionNumber:
          type: integer
        mode:
          type: string
          enum: [update, clone, create]
        folderIds:
          type: array
          description: The folders it was filed in - the request's folderId and the default folders from Settings.
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    # Core types
    AssetType:
      type: string
      enum: [dashboard, analysis, dataset, datasource, folder, user, group]

    AssetStatus:
      type: string
      enum: [active, archived, deleted]

    EnrichmentStatus:
      type: string
      enum: [skeleton, enriched, partial, metadata-update]

    # Search match reasons - indicates why an asset matched a search query
    SearchMatchReason:
      type: string
      enum:
        - name           # Matched on asset name
        - id             # Matched on asset ID
        - description    # Matched on description
        - arn            # Matched on ARN
        - tag_key        # Matched on tag key
        - tag_value      # Matched on tag value
        - permission     # Matched on permission principal (user/group name)
        - dependency_dataset     # Asset depends on a dataset matching the query
        - dependency_datasource  # Asset depends on a datasource matching the query
        - dependency_analysis    # Asset depends on an analysis matching the query
      description: |
        Indicates why an asset was included in search results.
        Multiple reasons can apply to a single asset.

    # Paginated response
    PaginatedAssetResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          description: The page, keyed by the plural asset type asked for (`dashboards`, `users`, ...).
          required: [pagination, fromCache]
          properties:
            dashboards:
              type: array
              items:
                $ref: '#/components/schemas/DashboardListItem'
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/DatasetListItem'
            analyses:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisListItem'
            datasources:
              type: array
              items:
                $ref: '#/components/schemas/DatasourceListItem'
            folders:
              type: array
              items:
                $ref: '#/components/schemas/FolderListItem'
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserListItem'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupListItem'
            pagination:
              $ref: '#/components/schemas/PaginationInfo'
            fromCache:
              type: boolean
            availableRoles:
              type: array
              description: Users - the roles in use, with counts, for the role filter.
              items:
                $ref: '#/components/schemas/FilterValueCount'
            availableGroups:
              type: array
              description: Users - the groups, with member counts, for the group filter.
              items:
                $ref: '#/components/schemas/FilterValueCount'
            availableSourceTypes:
              type: array
              description: Datasets and data sources - the source types in use, with counts.
              items:
                $ref: '#/components/schemas/FilterValueCount'
    
    FilterValueCount:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer

    PaginationInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        hasMore:
          type: boolean

    # Filter types (shared across frontend and backend)
    AssetListItem:
      type: object
      required: [id, name, type, status, createdTime, lastUpdatedTime, lastExportTime, enrichmentStatus]
      properties:
        id:
          type: string
          description: Asset unique identifier
        name:
          type: string
          description: Asset display name
        type:
          $ref: '#/components/schemas/AssetType'
        status:
          $ref: '#/components/schemas/AssetStatus'
        createdTime:
          type: string
          format: date-time
          description: When asset was created in QuickSight
        lastUpdatedTime:
          type: string
          format: date-time
          description: When asset was last updated in QuickSight (QuickSight's lastModifiedTime)
        lastExportTime:
          type: string
          format: date-time
          description: When asset was last exported to our portal (our timestamp)
        enrichmentStatus:
          $ref: '#/components/schemas/EnrichmentStatus'
        enrichmentTimestamps:
          type: object
          description: Timestamps for when each enrichment step was completed
          properties:
            definition:
              type: string
              format: date-time
              description: When asset definition was enriched
            permissions:
              type: string
              format: date-time
              description: When permissions were enriched
            tags:
              type: string
              format: date-time
              description: When tags were enriched
            lineage:
              type: string
              format: date-time
              description: When lineage was enriched
            views:
              type: string
              format: date-time
              description: When view stats were enriched
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          default: []
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          default: []
          description: Asset permissions
        searchMatchReasons:
          type: array
          items:
            $ref: '#/components/schemas/SearchMatchReason'
          description: |
            Why this asset matched the search query. Only present when a search
            query was provided. Multiple reasons can apply (e.g., matched on name
            AND is a dependency of another matched asset).

    # Archived asset response (extends AssetListItem)
    ArchivedAssetItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [archivedDate, archiveReason]
          properties:
            archivedDate:
              type: string
              format: date-time
              description: When asset was archived
            archiveReason:
              type: string
              description: Reason for archiving the asset
            archivedBy:
              type: string
              description: User or system that archived the asset
            lastActivity:
              type: string
              format: date-time
              nullable: true
              description: Last time the asset was viewed/accessed before archiving

    # Folder-specific responses
    FolderListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [path, memberCount]
          properties:
            path:
              type: string
              description: Full folder path like /parent/child
              example: "/Marketing/Reports"
            memberCount:
              type: integer
              description: Number of assets in folder
              minimum: 0
            parentId:
              type: string
              description: Parent folder ID (if any)

    FolderDetails:
      allOf:
        - $ref: '#/components/schemas/FolderListItem'
        - type: object
          properties:
            createdBy:
              type: string
              description: User who created the folder
            description:
              type: string
              description: Folder description

    FolderMember:
      type: object
      required: [MemberId, MemberType, MemberName]
      properties:
        MemberId:
          type: string
          description: Asset ID of the member
        MemberType:
          type: string
          enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE]
          description: Type of asset
        MemberName:
          type: string
          description: Display name of the asset

    # Dashboard-specific responses
    # Shared 202 response for queued bulk jobs (delete, membership, permissions)
    BulkJobAccepted:
      type: object
      required: [success, jobId, status, message]
      properties:
        success:
          type: boolean
        jobId:
          type: string
          description: Poll /jobs/{jobId} for completion
        status:
          type: string
        message:
          type: string
        estimatedOperations:
          type: integer

    # View-activity summary attached to dashboard/analysis list items
    ViewActivitySummary:
      type: object
      description: Activity summary (views)
      properties:
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true

    DefinitionError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          description: Error type (e.g., COLUMN_NOT_FOUND)
        message:
          type: string
          description: Error message
        violatedEntities:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: Path to the entity with the error

    DashboardListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [dashboardStatus, visualCount, sheetCount, datasetCount]
          properties:
            dashboardStatus:
              type: string
              description: Dashboard creation status
              example: "CREATION_SUCCESSFUL"
            visualCount:
              type: integer
              description: Number of visuals in dashboard
              minimum: 0
            sheetCount:
              type: integer
              description: Number of sheets in dashboard
              minimum: 0
            datasetCount:
              type: integer
              description: Number of datasets used
              minimum: 0
            publishedVersionNumber:
              type: integer
              description: Published version number (if any)
            activity:
              $ref: '#/components/schemas/ViewActivitySummary'
            definitionErrors:
              type: array
              description: Definition validation errors
              items:
                $ref: '#/components/schemas/DefinitionError'

    # Dataset-specific responses
    AnalysisListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [sheetCount, visualCount, datasetCount]
          properties:
            sheetCount:
              type: integer
              description: Number of sheets in the analysis
            visualCount:
              type: integer
              description: Total number of visuals across all sheets
            datasetCount:
              type: integer
              description: Number of datasets used
            activity:
              $ref: '#/components/schemas/ViewActivitySummary'
            definitionErrors:
              type: array
              description: Definition validation errors
              items:
                $ref: '#/components/schemas/DefinitionError'
            sourceEntity:
              type: object
              properties:
                sourceTemplate:
                  type: object
                  properties:
                    dataSetReferences:
                      type: array
                      items:
                        type: object
                    arn:
                      type: string
    
    DatasetListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [importMode, fieldCount]
          properties:
            importMode:
              type: string
              enum: [SPICE, DIRECT_QUERY]
              description: How data is imported
            fieldCount:
              type: integer
              description: Number of fields in dataset
              minimum: 0
            sizeInBytes:
              type: integer
              description: Dataset size in bytes
            sourceType:
              type: string
              description: >
                Data source type resolved from the dataset's data sources
                (the DataSource API's Type field — ATHENA, REDSHIFT, S3, etc.)
            schemas:
              type: array
              items:
                type: string
              description: >
                Distinct source schemas (databases) from the dataset's
                relational physical tables — the RelationalTable Schema field,
                which is the database for Athena sources and the schema for
                Redshift and other relational engines. Populated at export time.
            hasRefreshProperties:
              type: boolean
              description: Whether dataset has refresh properties configured
            refreshScheduleCount:
              type: integer
              description: Number of refresh schedules configured
              minimum: 0
            refreshSchedules:
              type: array
              description: List of refresh schedules for the dataset
              items:
                $ref: '#/components/schemas/RefreshSchedule'
            dataSetRefreshProperties:
              type: object
              description: Refresh configuration properties for the dataset
            activity:
              type: object
              description: >
                Aggregated activity for the dataset — views across the
                dashboards/analyses that use it, plus last refresh (ingestion).
              properties:
                totalViews:
                  type: integer
                  minimum: 0
                uniqueViewers:
                  type: integer
                  minimum: 0
                lastViewed:
                  type: string
                  format: date-time
                  nullable: true
                lastRefreshTime:
                  type: string
                  format: date-time
                  nullable: true
                lastRefreshStatus:
                  type: string
                  nullable: true

    RefreshSchedule:
      type: object
      required: [scheduleId, scheduleFrequency, refreshType, arn]
      properties:
        scheduleId:
          type: string
          description: Unique identifier for the refresh schedule
        scheduleFrequency:
          type: object
          required: [interval]
          properties:
            interval:
              type: string
              enum: [MINUTE15, MINUTE30, HOURLY, DAILY, WEEKLY, MONTHLY]
              description: Frequency of the refresh
            refreshOnDay:
              type: object
              properties:
                dayOfWeek:
                  type: string
                  enum: [SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
                  description: Day of the week for weekly schedules
                dayOfMonth:
                  type: string
                  description: Day of the month for monthly schedules
            timeOfTheDay:
              type: string
              description: Time of day for the refresh (HH:MM format)
            timezone:
              type: string
              description: Timezone for the schedule
        startAfterDateTime:
          type: string
          format: date-time
          description: When the schedule starts
        refreshType:
          type: string
          enum: [INCREMENTAL_REFRESH, FULL_REFRESH]
          description: Type of refresh to perform
        arn:
          type: string
          description: ARN of the refresh schedule

    # User-specific responses
    DatasourceListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [type, connectionMode]
          properties:
            type:
              type: string
              description: Type of datasource (e.g., ATHENA, REDSHIFT, S3)
            connectionMode:
              type: string
              description: Connection mode (DIRECT_QUERY or IMPORT)
            dataSourceParameters:
              type: object
              description: Connection parameters
            vpcConnectionProperties:
              type: object
              properties:
                vpcConnectionArn:
                  type: string
    
    GroupListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [memberCount]
          properties:
            memberCount:
              type: integer
              description: Number of members in the group
            description:
              type: string
              description: Group description
            principalId:
              type: string
              description: Principal ID of the group
    
    UserListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [email, role, active, groupCount]
          properties:
            email:
              type: string
              format: email
              description: User email address
            role:
              type: string
              description: User role in QuickSight
              example: "AUTHOR"
            active:
              type: boolean
              description: Whether user is active
            groupCount:
              type: integer
              description: Number of groups user belongs to
              minimum: 0
            assetAccessCount:
              type: integer
              description: Number of assets the user has access to
              minimum: 0
            groups:
              type: array
              items:
                type: string
              description: List of group names user belongs to
              default: []
            lastActivityTime:
              type: string
              format: date-time
              description: Last time user was active
            activityCount:
              type: integer
              description: Total number of user activities
              minimum: 0
            activity:
              type: object
              description: User activity summary
              properties:
                totalActivities:
                  type: integer
                  minimum: 0
                lastActive:
                  type: string
                  format: date-time
                  nullable: true
                dashboardCount:
                  type: integer
                  minimum: 0
                analysisCount:
                  type: integer
                  minimum: 0

    # Lineage types
    Tag:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: Tag key
        value:
          type: string
          description: Tag value

    Permission:
      type: object
      required: [principal, principalType, actions]
      properties:
        principal:
          type: string
          description: Principal ARN or identifier
        principalType:
          type: string
          enum: [USER, GROUP, NAMESPACE, PUBLIC]
          description: Type of principal
        actions:
          type: array
          items:
            type: string
          description: List of allowed actions

    AccessSource:
      type: object
      required: [type, actions]
      properties:
        type:
          type: string
          enum: [direct, group, folder]
          description: How the user has access
        actions:
          type: array
          items:
            type: string
          description: Permission actions from this source
        groupName:
          type: string
          description: Group name if access is via group
        folderName:
          type: string
          description: Folder name if access is via folder
        folderPath:
          type: string
          description: Folder path if access is via folder

    UserAccessInfo:
      type: object
      required: [userName, userArn, sources]
      properties:
        userName:
          type: string
          description: The user's name
        userArn:
          type: string
          description: The user's ARN
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways this user has access to the asset

    GroupAccessInfo:
      type: object
      required: [groupName, groupArn, sources]
      properties:
        groupName:
          type: string
          description: The group's name
        groupArn:
          type: string
          description: The group's ARN
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways this group has access to the asset

    UserAssetAccessResponse:
      type: object
      required: [userName, totalAssets, assets]
      properties:
        userName:
          type: string
        totalAssets:
          type: integer
        assetsByType:
          type: object
          properties:
            dashboards:
              type: integer
            datasets:
              type: integer
            analyses:
              type: integer
            datasources:
              type: integer
            folders:
              type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/UserAssetAccessItem'

    UserAssetAccessItem:
      type: object
      required: [assetId, assetType, assetName, sources]
      properties:
        assetId:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        assetName:
          type: string
        arn:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways the user has access to this asset

    # Activity types
    ActivityData:
      type: object
      required: [assetId, assetType, totalViews, uniqueViewers, lastViewed, viewsByDate, viewers]
      properties:
        assetId:
          type: string
          description: Asset identifier
        assetName:
          type: string
          description: Asset name from cache
        assetType:
          type: string
          enum: [dashboard, analysis]
        totalViews:
          type: integer
          description: Total number of views in activity window
        uniqueViewers:
          type: integer
          description: Number of unique viewers
        lastViewed:
          type: string
          format: date-time
          description: Most recent view timestamp (persisted forever)
        viewsByDate:
          type: object
          additionalProperties:
            type: integer
          description: View counts by date (YYYY-MM-DD)
        viewers:
          type: array
          description: All viewers with their activity counts
          items:
            type: object
            required: [userName, viewCount, lastViewed]
            properties:
              userName:
                type: string
                description: User name or ARN
              viewCount:
                type: integer
                description: Number of views by this user
              lastViewed:
                type: string
                format: date-time
                description: Last time this user viewed the asset
              groups:
                type: array
                items:
                  type: string
                description: Groups the user belongs to

    DatasetActivityData:
      type: object
      description: >
        Activity for a dataset — refresh (ingestion) history plus aggregated
        view/update activity of the dashboards and analyses that use it.
      required: [datasetId, totalViews, uniqueViewers, viewsByDate, usedBy, ingestions, refreshSummary]
      properties:
        datasetId:
          type: string
          description: Dataset identifier
        datasetName:
          type: string
          description: Dataset name from cache
        totalViews:
          type: integer
          minimum: 0
          description: Total views across all dashboards/analyses that use this dataset
        uniqueViewers:
          type: integer
          minimum: 0
          description: Unique viewers across all dependent assets (true union, not a sum)
        lastViewed:
          type: string
          format: date-time
          nullable: true
          description: Most recent view of any dependent asset
        viewsByDate:
          type: object
          additionalProperties:
            type: integer
          description: Aggregated dependent-asset view counts by date (YYYY-MM-DD)
        usedBy:
          type: array
          description: Per-dependent activity for dashboards/analyses that use this dataset
          items:
            $ref: '#/components/schemas/DatasetDependentActivity'
        refreshSummary:
          type: object
          description: Summary of the dataset's ingestion (refresh) activity
          required: [totalIngestions, failedIngestions]
          properties:
            totalIngestions:
              type: integer
              minimum: 0
            failedIngestions:
              type: integer
              minimum: 0
            lastIngestionTime:
              type: string
              format: date-time
              nullable: true
            lastIngestionStatus:
              type: string
              nullable: true
        ingestions:
          type: array
          description: Recent ingestion runs for this dataset, newest first
          items:
            $ref: '#/components/schemas/Ingestion'

    DatasetDependentActivity:
      type: object
      required: [assetId, assetType, totalViews, uniqueViewers]
      properties:
        assetId:
          type: string
          description: Dependent asset identifier
        assetName:
          type: string
          description: Dependent asset name
        assetType:
          type: string
          enum: [dashboard, analysis]
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true
          description: Most recent view of this dependent asset
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: Most recent mutation (update/publish) of this dependent asset

    TimelineActor:
      type: object
      description: The actor in words. The portal's own Lambda role shows as "Portal".
      required: [kind, label, raw]
      properties:
        kind:
          type: string
          enum: [portal, user, role, root, service, unknown]
        label:
          type: string
        raw:
          type: string

    TimelineOrigin:
      type: string
      description: >
        Where a change came from. portal-ui and portal-api are portal writes attributed
        through the audit log (a person in the UI, or an API key such as an agent);
        portal is a portal write without a matching record; console is a person or
        role acting directly; automation is an AWS service.
      enum: [portal-ui, portal-api, portal, console, automation, unknown]

    TimelineProvenance:
      type: object
      required: [actor, channel, action, distanceMs]
      properties:
        actor:
          type: object
          required: [kind, id, label]
          properties:
            kind:
              type: string
              enum: [user, api-key]
            id:
              type: string
            label:
              type: string
        channel:
          type: string
          enum: [ui, api]
        action:
          type: string
          description: e.g. authoring.update, authoring.clone, asset.rename, asset.delete, asset.tags
        jobId:
          type: string
        distanceMs:
          type: integer
          description: How far the audit record was from the event; small means confident.

    TimelineEvent:
      type: object
      required: [id, timestamp, eventName, kind, user, actor, origin]
      properties:
        id:
          type: string
          description: Stable identifier hash for the event (timestamp + name + resource + user).
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO).
        eventName:
          type: string
          description: CloudTrail event name (e.g. CreateDashboard, UpdateDataSetPermissions, TagResource).
        kind:
          type: string
          enum: [view, mutation]
          description: Whether this event is a read/view or a mutation. The timeline returns mutations only by default.
        action:
          type: string
          enum: [create, update, delete, publish, grant, revoke, member, tag, job, batch]
          description: Coarse action category derived from the event name.
        user:
          type: string
          description: User name or ARN that performed the action.
        actor:
          $ref: '#/components/schemas/TimelineActor'
        origin:
          $ref: '#/components/schemas/TimelineOrigin'
        provenance:
          description: For portal events, who was behind it, from the portal's own audit log.
          allOf:
            - $ref: '#/components/schemas/TimelineProvenance'
        resourceType:
          type: string
          enum: [dashboard, analysis, dataset, datasource, folder, group, user, other]
          description: >
            Resource type the event targets. Catalog types (dashboard / analysis / dataset /
            datasource / folder / group / user) are hydrated with asset names; `other` covers
            templates, themes, brands, topics, action connectors, VPC connections, namespaces,
            and account-level settings.
        assetType:
          type: string
          enum: [dashboard, analysis, dataset, datasource, folder, group, user]
          description: Catalog asset type (only set when resourceType is a catalog asset).
        assetId:
          type: string
          description: Resource identifier (dashboardId, analysisId, ...). Absent for some account-level settings events.
        assetName:
          type: string
          description: Asset name from the portal catalog. Absent if the catalog does not know this asset.
        arn:
          type: string
          description: Full resource ARN, when present on the CloudTrail event.
        raw:
          type: object
          description: >
            The stored activity record, verbatim — pruned but with readable
            field names (timestamp, eventName, user, resourceId, name, kind,
            action, resourceType, details, eventId). For mutations, details
            holds the allowlisted CloudTrail payload slice. Powers the
            per-event JSON debugging view.

    TimelinePage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
          description: Timeline events for this page, sorted newest-first.
        nextCursor:
          type: string
          nullable: true
          format: date-time
          description: ISO timestamp of the last item in `items`. Pass back as `cursor` to fetch the next page. `null` when there are no more events.
        hasMore:
          type: boolean
          description: True if more events exist beyond this page.
        cacheLastUpdated:
          type: string
          format: date-time
          description: ISO timestamp of when the activity cache was last refreshed (from the most recent /activity/refresh job). Shown in the UI as "last refreshed X ago".

    UserActivity:
      type: object
      required: [userName, lastActive, totalActivities, activitiesByDate, dashboards, analyses]
      properties:
        userName:
          type: string
          description: User name or ARN
        lastActive:
          type: string
          format: date-time
          description: Last activity timestamp (persisted forever)
        totalActivities:
          type: integer
          description: Total number of activities in activity window
        activitiesByDate:
          type: object
          additionalProperties:
            type: integer
          description: Activity counts by date (YYYY-MM-DD)
        dashboards:
          type: array
          description: Dashboards viewed with activity counts
          items:
            type: object
            required: [dashboardId, viewCount, lastViewed]
            properties:
              dashboardId:
                type: string
                description: Dashboard ID
              dashboardName:
                type: string
                description: Dashboard name from cache
              viewCount:
                type: integer
                description: Number of times viewed
              lastViewed:
                type: string
                format: date-time
                description: Last time viewed
        analyses:
          type: array
          description: Analyses viewed with activity counts
          items:
            type: object
            required: [analysisId, viewCount, lastViewed]
            properties:
              analysisId:
                type: string
                description: Analysis ID
              analysisName:
                type: string
                description: Analysis name from cache
              viewCount:
                type: integer
                description: Number of times viewed
              lastViewed:
                type: string
                format: date-time
                description: Last time viewed (YYYY-MM-DD)

    # Export status types
    ExportSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [totalAssets, exportedAssets, lastExportDate, exportInProgress, assetTypeCounts, fieldStatistics]
          properties:
            totalAssets:
              type: integer
            exportedAssets:
              type: integer
            lastExportDate:
              type: string
              format: date-time
              nullable: true
            exportInProgress:
              type: boolean
            needsInitialExport:
              type: boolean
              description: Indicates if initial export is needed (no cache exists)
            message:
              type: string
              description: Optional message providing export status context
            assetTypeCounts:
              type: object
              properties:
                dashboards:
                  type: integer
                datasets:
                  type: integer
                analyses:
                  type: integer
                datasources:
                  type: integer
                folders:
                  type: integer
                users:
                  type: integer
                groups:
                  type: integer
            archivedAssetCounts:
              type: object
              properties:
                dashboards:
                  type: integer
                datasets:
                  type: integer
                analyses:
                  type: integer
                datasources:
                  type: integer
                folders:
                  type: integer
                users:
                  type: integer
                groups:
                  type: integer
                total:
                  type: integer
            fieldStatistics:
              type: object
              nullable: true
              properties:
                totalFields:
                  type: integer
                totalCalculatedFields:
                  type: integer
                totalUniqueFields:
                  type: integer
            totalSize:
              type: integer
              description: Total storage size in bytes
            cacheVersion:
              type: string

    # Export job schemas
    ExportJobRequest:
      type: object
      description: Every field is optional; the defaults are an incremental export of every asset type.
      properties:
        forceRefresh:
          type: boolean
          description: Force re-export of all assets even if cached (default false)
        rebuildIndex:
          type: boolean
          description: Rebuild all indexes from scratch (default false)
        assetTypes:
          type: array
          items:
            $ref: '#/components/schemas/AssetType'
          description: Specific asset types to export (all if not specified)
        exportOrganizational:
          type: boolean
          description: Export all organizational assets (users, groups, folders) together (default false)
        refreshOptions:
          type: object
          description: Which parts of each asset to re-read; each defaults to true.
          properties:
            definitions:
              type: boolean
            permissions:
              type: boolean
            tags:
              type: boolean

    ExportJobResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [jobId, status, message]
          properties:
            jobId:
              type: string
              description: Unique job identifier
            status:
              $ref: '#/components/schemas/JobStatus'
            message:
              type: string
              description: User-friendly status message

    JobStatus:
      type: string
      enum: [queued, processing, completed, failed, stopping, stopped]
      description: Current status of the export job

    JobPhase:
      type: object
      required: [key, status]
      description: |
        One step of a multi-phase job. Optional. Jobs that report phases
        emit a fixed-length array; status transitions monotonically
        (pending → in_progress → completed/failed/skipped).
      properties:
        key:
          type: string
          description: Stable phase identifier (e.g. fetch-views, fetch-mutations)
        status:
          type: string
          enum: [pending, in_progress, completed, failed, skipped]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
        counts:
          type: object
          nullable: true
          properties:
            processed:
              type: integer
            total:
              type: integer
            newEvents:
              type: integer
            truncated:
              type: integer
            errors:
              type: integer

    DatasetPhysicalTable:
      type: object
      required: [id, kind, dataSourceArn, name, columnCount, editable]
      properties:
        id:
          type: string
          description: |
            Key in the dataset's PhysicalTableMap. Referenced by the logical
            table map, so it never changes.
        kind:
          type: string
          enum: [RELATIONAL, CUSTOM_SQL, S3]
        dataSourceArn:
          type: string
        name:
          type: string
          description: "Relational: the table name. Custom SQL: the query's display name."
        catalog:
          type: string
          description: Relational only; absent for engines with no catalog concept.
        schema:
          type: string
          description: Relational only. The database for Athena-backed sources.
        sqlQuery:
          type: string
          description: Custom SQL only.
        columnCount:
          type: integer
          description: How many columns are pinned to this table.
        editable:
          type: boolean
          description: False for S3 sources, which have no schema or query to edit.

    DatasetSource:
      type: object
      required: [dataSetId, name, importMode, tables]
      properties:
        dataSetId:
          type: string
        name:
          type: string
        importMode:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/DatasetPhysicalTable'

    DatasetTableEdit:
      type: object
      required: [id]
      description: A change to one physical table. Omitted fields are left alone.
      properties:
        id:
          type: string
        dataSourceArn:
          type: string
          description: Must be one of the account's data sources.
        name:
          type: string
        catalog:
          type: string
          description: Relational only. Send an empty string to clear it.
        schema:
          type: string
          description: Relational only.
        sqlQuery:
          type: string
          description: Custom SQL only.

    DataSourceOption:
      type: object
      required: [id, name, arn]
      properties:
        id:
          type: string
        name:
          type: string
        arn:
          type: string
        type:
          type: string

    # -------------------------------------------------------------------------
    # Authoring - rebind a definition to different datasets
    # -------------------------------------------------------------------------
    ColumnUsage:
      type: object
      description: How many times a column is referenced, by kind of site.
      required: [visual, filter, calculatedField, parameter, control, other]
      properties:
        visual:
          type: integer
        filter:
          type: integer
        calculatedField:
          type: integer
        parameter:
          type: integer
        control:
          type: integer
        other:
          type: integer

    ReferencedColumn:
      type: object
      required: [name, usage]
      properties:
        name:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'

    DefinitionDataset:
      type: object
      description: One DataSetIdentifierDeclarations entry and what the definition takes from it.
      required: [identifier, dataSetArn, dataSetId, columns, calculatedFields]
      properties:
        identifier:
          type: string
        dataSetArn:
          type: string
        dataSetId:
          type: string
        columns:
          type: array
          description: Columns the definition reads from this dataset, calculated fields excluded.
          items:
            $ref: '#/components/schemas/ReferencedColumn'
        calculatedFields:
          type: array
          description: Calculated fields declared against this dataset. Provided by the definition, not the dataset.
          items:
            type: string

    DefinitionDatasets:
      type: object
      required: [assetType, assetId, name, datasets]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionDataset'

    AuthorableAssetType:
      type: string
      enum: [analysis, dashboard]

    RepairOp:
      type: object
      description: |
        One repair, applied by deterministic code before the rebind plan.
        dropColumn removes every reference to a dataset column (field wells,
        filters, sorts, hierarchies, calculated fields reading it; empty
        filter groups go too). dropParameter removes a parameter's
        declaration, controls and filters. declareParameter adds a
        declaration for a parameter that is referenced but never declared.
      required: [op]
      properties:
        op:
          type: string
          enum: [dropColumn, dropParameter, declareParameter]
        identifier:
          type: string
          description: dropColumn - the dataset identifier.
        columnName:
          type: string
          description: dropColumn - the column.
        name:
          type: string
          description: dropParameter / declareParameter - the parameter name.
        type:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATETIME]
          description: declareParameter - the value type.
        defaultValue:
          type: string
          description: declareParameter - an optional static default.

    RepairFix:
      type: object
      description: |
        A fix for one issue. Repair ops as above, plus `rename` (a column
        map entry on the identifier's rebind) and `rebind` (the caller must
        choose a dataset for the identifier).
      required: [op]
      properties:
        op:
          type: string
          enum: [dropColumn, dropParameter, declareParameter, rename, rebind]
        identifier:
          type: string
        columnName:
          type: string
        to:
          type: string
          description: rename - the column in the target that takes its place.
        name:
          type: string
        type:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATETIME]
        defaultValue:
          type: string

    RepairIssue:
      type: object
      required: [id, kind, severity, message, alternatives]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [dataset-missing, column-missing, parameter-missing, quicksight-error]
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        identifier:
          type: string
        dataSetId:
          type: string
        columnName:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'
        parameterName:
          type: string
        quickSight:
          type: object
          description: QuickSight's own error, when it reported this.
          required: [type, message, paths]
          properties:
            type:
              type: string
            message:
              type: string
            paths:
              type: array
              items:
                type: string
        fix:
          description: The proposed fix; absent when the caller must choose or nothing can be done.
          allOf:
            - $ref: '#/components/schemas/RepairFix'
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/RepairFix'

    RepairPlan:
      type: object
      required: [issues, summary, proposed]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RepairIssue'
        summary:
          type: object
          required: [fixable, needsChoice, unfixable]
          properties:
            fixable:
              type: integer
            needsChoice:
              type: integer
              description: Issues that need a dataset chosen before they can be fixed.
            unfixable:
              type: integer
        proposed:
          type: object
          description: The proposed fixes in request form, ready for preview and apply.
          required: [repairs, rebinds]
          properties:
            repairs:
              type: array
              items:
                $ref: '#/components/schemas/RepairOp'
            rebinds:
              type: array
              items:
                $ref: '#/components/schemas/RebindRequest'

    VisualSpec:
      type: object
      description: |
        One visual by column names; the builder decides the field wells from
        the columns' types. A column the dataset does not have refuses the
        build (it is never left out quietly).
      required: [type, title, identifier, values]
      properties:
        key:
          type: string
          description: How filters (`appliesTo`) and actions (`targets`) refer to this visual; its title works too.
        type:
          type: string
          enum: [KPI, BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
        title:
          type: string
        identifier:
          type: string
          description: The dataset identifier every column belongs to.
        category:
          type: string
          description: The dimension (x axis, group-by, pivot rows). Not for KPI.
        granularity:
          type: string
          enum: [DAY, WEEK, MONTH, QUARTER, YEAR]
          description: When the category is a date.
        values:
          type: array
          items:
            type: object
            required: [column]
            properties:
              column:
                type: string
              aggregation:
                type: string
                enum: [SUM, AVERAGE, COUNT, DISTINCT_COUNT, MIN, MAX]
        color:
          type: string
          description: A second dimension (colours, pivot columns).
        actions:
          type: array
          description: Interactions on this visual - a click that filters other visuals, or opens a sheet.
          items:
            $ref: '#/components/schemas/VisualAction'

    VisualAction:
      type: object
      description: |
        An interaction on a visual (a QuickSight custom action). `filter` is
        what people call an action filter, click-to-filter or cross-filter:
        selecting a data point filters other visuals by it. `navigate` opens
        another sheet (drill to a detail sheet). A visual runs one action on
        select (click); others go in its data point menu.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [filter, navigate]
        name:
          type: string
          description: Shown in the visual's menu.
        trigger:
          type: string
          enum: [select, menu]
          description: select (default) - clicking a data point runs it; menu - offered in the data point's menu.
        targets:
          type: array
          items:
            type: string
          description: filter. Keys (or titles) of the visuals it filters; every other visual on the sheet when omitted.
        fields:
          type: array
          items:
            type: string
          description: filter. Columns the selection filters by; every field of the visual when omitted.
        sheet:
          type: string
          description: navigate. The name of the sheet it opens.

    FilterSpec:
      type: object
      description: |
        A column the person filters on, with its control. Controls by column
        type - text: dropdown (multi-select, the default), singleSelect or
        list; date: dateRange (the default) or relativeDate ("last N days");
        number: slider (needs min and max). The control goes in the sheet's
        control bar (the collapsible strip at the top, the default) or on the
        canvas above the visuals. The filter narrows every visual on the
        sheet, or only those named in `appliesTo`. A filter that cannot be
        built as asked refuses the build with the reason.
      required: [identifier, column]
      properties:
        identifier:
          type: string
          description: The dataset identifier the column belongs to.
        column:
          type: string
        control:
          $ref: '#/components/schemas/FilterControlKind'
        placement:
          $ref: '#/components/schemas/ControlPlacement'
        appliesTo:
          type: array
          items:
            type: string
          description: Keys (or titles) of the visuals it narrows; every visual on the sheet when omitted.
        lastDays:
          type: integer
          minimum: 1
          description: relativeDate. The last N days selected to start with (30 when omitted).
        title:
          type: string
          description: The control's title; the column name when omitted.
        values:
          type: array
          description: Text columns - values selected to start with; all when omitted.
          items:
            type: string
        min:
          type: number
        max:
          type: number

    NewAssetRequest:
      type: object
      required: [assetType, name, datasets]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        name:
          type: string
        datasets:
          type: array
          minItems: 1
          items:
            type: object
            required: [identifier, dataSetId]
            properties:
              identifier:
                type: string
              dataSetId:
                type: string
              shareWithAudience:
                type: boolean
                description: |
                  Give the asset's audience (permissionsFrom or the template's)
                  the same standing on this dataset: owners own it, viewers read
                  it. For a dataset created for this asset, which nobody can see
                  yet. A grant that fails is a warning, not a failed create.
        visuals:
          type: array
          description: |
            What to show, by column name. The layout is decided for you: KPIs
            in a band at the top, charts two to a row (a lone one full width),
            tables and pivot tables full width.
          items:
            $ref: '#/components/schemas/VisualSpec'
        visualTemplates:
          type: array
          description: Saved visual templates to add, each on the dataset identifier given.
          items:
            type: object
            required: [templateId, identifier]
            properties:
              templateId:
                type: string
              identifier:
                type: string
              title:
                type: string
        filterBarTemplateId:
          type: string
          description: |
            The filter bar template to start from; the organisation's default
            when omitted, none with 'none'. Its controls come first, in its
            order and widths; `filters` follow.
        filters:
          type: array
          description: Columns to filter on, each a control in the sheet's control bar.
          items:
            $ref: '#/components/schemas/FilterSpec'
        ask:
          type: string
          description: When visuals are absent, the planner proposes them (and filters, unless given) from this.
        sheetName:
          type: string
        addCalculatedFields:
          type: array
          items:
            $ref: '#/components/schemas/AddedCalculatedField'
        template:
          $ref: '#/components/schemas/TemplateRequest'
        typeRules:
          $ref: '#/components/schemas/TypeRules'
        permissionsFrom:
          type: object
          description: Inherit this asset's audience; defaults to the template's when one is given.
          required: [assetType, assetId]
          properties:
            assetType:
              type: string
              enum: [dashboard, analysis]
            assetId:
              type: string
        folderId:
          type: string
        newAssetId:
          type: string
        model:
          $ref: '#/components/schemas/AiModelKey'

    NewAssetPreview:
      type: object
      required: [definition, outline, changes, warnings, visuals, filters]
      properties:
        filters:
          type: array
          description: The filters that were built, given or proposed.
          items:
            $ref: '#/components/schemas/FilterSpec'
        definition:
          type: object
          additionalProperties: true
        outline:
          type: array
          items:
            $ref: '#/components/schemas/SheetOutline'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        warnings:
          type: array
          items:
            type: string
        visuals:
          type: array
          description: The visuals that were built, given or proposed.
          items:
            $ref: '#/components/schemas/VisualSpec'
        proposal:
          type: object
          required: [reason, model]
          properties:
            reason:
              type: string
            model:
              type: object
              required: [provider, model]
              properties:
                provider:
                  type: string
                model:
                  type: string
        themeArn:
          type: string

    NewAssetResult:
      type: object
      required: [assetType, assetId, name, arn, changes, warnings]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        name:
          type: string
        arn:
          type: string
        versionNumber:
          type: integer
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        warnings:
          type: array
          items:
            type: string
        folderIds:
          type: array
          description: Every folder it was filed in - the request's folderId and the default folders from Settings.
          items:
            type: string
        owner:
          type: string
          description: The QuickSight user made its owner - the person who built it, matched by sign-in email.

    TypeRules:
      type: object
      description: |
        Conversions applied to every visual at once. chartFamily: retypes
        every visual of one editable type to another (table to pivot, bar to
        column, pie to donut and the reverse) wherever the field wells
        translate; a visual whose wells do not fit is left alone and named in
        `warnings`. kpi: gauges become KPIs and every KPI takes the
        template's KPI options when a template is given. casts: where the
        dataset a definition now reads has a column of a different type than
        the definition was built for, a calculated field with the cast is
        added and the visuals read it instead.
      properties:
        chartFamily:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
                enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
              to:
                type: string
                enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
        kpi:
          type: boolean
        casts:
          type: boolean

    AuthoringDatasetColumns:
      type: object
      required: [dataSetId, name, columns]
      properties:
        dataSetId:
          type: string
        name:
          type: string
        columns:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              type:
                type: string

    TemplateRequest:
      type: object
      description: |
        Migrate onto a template dashboard's layout standard. The template's
        text boxes and title band come across at their positions, its
        filter and parameter controls where a source dataset has the column,
        its sheet names and its theme; the source's visuals reflow, in
        order, into rows of the template's standard tile size below the
        furniture, KPIs first at the template's KPI size when it has a KPI
        band. Applied after rebinds and before added fields and ops.

        Every part is optional and on by default, so a caller that wants the
        whole standard sends only assetType and assetId.
      required: [assetType, assetId]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        textBoxes:
          type: boolean
          description: Carry the template's text boxes and title band. Default true.
        controls:
          type: boolean
          description: Carry the template's controls where a source column matches. Default true.
        sheetNames:
          type: boolean
          description: Take the template's sheet names. Default true.
        kpisFirst:
          type: boolean
          description: KPIs first at the template's KPI size when it has a KPI band. Default true.
        theme:
          type: boolean
          description: Write the template's theme. Default true.

    RebindRequest:
      type: object
      description: Point one dataset identifier at a different dataset.
      required: [identifier, targetDataSetId]
      properties:
        identifier:
          type: string
          description: A DataSetIdentifierDeclarations entry of the definition.
        targetDataSetId:
          type: string
        columnMap:
          type: object
          description: Source column name to target column name, for names that differ.
          additionalProperties:
            type: string

    ColumnResolutionStatus:
      type: string
      enum: [matched, mapped, suggested, missing]

    ColumnResolution:
      type: object
      required: [name, status, usage]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/ColumnResolutionStatus'
        resolvedTo:
          type: string
          description: The name the definition will use after the rebind (matched or mapped).
        suggestion:
          type: string
          description: A target column that differs only in case, spacing or separators.
        targetType:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'

    DatasetRebindPlan:
      type: object
      required: [identifier, current, target, columns, unusedTargetColumns, summary]
      properties:
        identifier:
          type: string
        current:
          type: object
          required: [dataSetId, dataSetArn]
          properties:
            dataSetId:
              type: string
            dataSetArn:
              type: string
        target:
          type: object
          required: [dataSetId, dataSetArn, name, columnCount]
          properties:
            dataSetId:
              type: string
            dataSetArn:
              type: string
            name:
              type: string
            columnCount:
              type: integer
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnResolution'
        unusedTargetColumns:
          type: array
          description: Target columns nothing in the definition uses. Informational.
          items:
            type: string
        summary:
          type: object
          required: [matched, mapped, suggested, missing]
          properties:
            matched:
              type: integer
            mapped:
              type: integer
            suggested:
              type: integer
            missing:
              type: integer

    RebindPlan:
      type: object
      required: [assetType, assetId, name, datasets, canApply]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRebindPlan'
        canApply:
          type: boolean
          description: True only when every referenced column is matched or mapped.

    ApplyRebindRequest:
      type: object
      required: [mode, rebinds]
      properties:
        mode:
          type: string
          enum: [update, clone]
        rebinds:
          type: array
          description: May be empty for a rename-only update or a plain clone.
          items:
            $ref: '#/components/schemas/RebindRequest'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required for clone. Optional rename for update.
        newAssetId:
          type: string
          description: Clone only. Generated when omitted.
        addCalculatedFields:
          type: array
          description: |
            Calculated fields to add to the written definition, typically from
            the template library. Each is declared against a dataset
            identifier; a name that already exists there is rejected.
          items:
            $ref: '#/components/schemas/AddedCalculatedField'
        ops:
          type: array
          description: Edits applied after rebinds and added fields, in order.
          items:
            $ref: '#/components/schemas/DefinitionOp'
        repairs:
          type: array
          description: Repairs applied first, before the rebind plan (see the repair plan endpoint).
          items:
            $ref: '#/components/schemas/RepairOp'
        template:
          $ref: '#/components/schemas/TemplateRequest'
        typeRules:
          $ref: '#/components/schemas/TypeRules'
        folderId:
          type: string
          description: Clone only. Put the new asset in this QuickSight folder.

    AddedCalculatedField:
      type: object
      required: [identifier, name, expression]
      properties:
        identifier:
          type: string
        name:
          type: string
        expression:
          type: string
        templateId:
          type: string

    ApplyRebindResult:
      type: object
      required: [assetType, assetId, name, arn, mode, plan]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
          description: The written asset - the source for update, the new asset for clone.
        name:
          type: string
        arn:
          type: string
        mode:
          type: string
          enum: [update, clone]
        versionNumber:
          type: integer
          description: Dashboards only. The version created (and, for update, published).
        plan:
          $ref: '#/components/schemas/RebindPlan'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        folderIds:
          type: array
          description: Clone only - the folders it was filed in (the request's folderId and the default folders from Settings).
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    ProposeRequest:
      type: object
      required: [ask]
      properties:
        ask:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the person wants, in their words.
        candidateDataSetIds:
          type: array
          description: Restrict the datasets the planner may choose from. Defaults to every active dataset.
          items:
            type: string
        model:
          $ref: '#/components/schemas/AiModelKey'

    ProposedRebind:
      allOf:
        - $ref: '#/components/schemas/RebindRequest'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: Why the planner chose this dataset.

    UnmappedColumn:
      type: object
      required: [identifier, column, reason]
      properties:
        identifier:
          type: string
        column:
          type: string
        reason:
          type: string

    Proposal:
      type: object
      required: [ask, intent, mode, reason, rebinds, unmapped, ops, plan, model]
      properties:
        ask:
          type: string
        intent:
          type: string
          enum: [rebind, unclear]
          description: unclear when the ask is not a rebind or clone the planner can express.
        mode:
          type: string
          enum: [update, clone]
        name:
          type: string
          description: Proposed name. Absent means keep the current one.
        reason:
          type: string
        rebinds:
          type: array
          items:
            $ref: '#/components/schemas/ProposedRebind'
        unmapped:
          type: array
          description: Columns the planner looked at and could not map.
          items:
            $ref: '#/components/schemas/UnmappedColumn'
        ops:
          type: array
          description: Layout and visual edits the planner proposes, already validated against the definition.
          items:
            $ref: '#/components/schemas/DefinitionOp'
        plan:
          type: object
          nullable: true
          description: The server's own dry run of the proposal. Null when the intent is unclear.
          allOf:
            - $ref: '#/components/schemas/RebindPlan'
        model:
          type: object
          required: [provider, model]
          properties:
            provider:
              type: string
            model:
              type: string

    RebindPreview:
      type: object
      required: [plan, definition, changes, outline]
      properties:
        plan:
          $ref: '#/components/schemas/RebindPlan'
        definition:
          type: object
          additionalProperties: true
          description: The QuickSight Definition as apply would write it.
        changes:
          type: array
          description: Every change in plain language, in the order it is applied.
          items:
            $ref: '#/components/schemas/DefinitionChange'
        outline:
          type: array
          description: The sheets of the resulting definition, with ids, for editing.
          items:
            $ref: '#/components/schemas/SheetOutline'
        warnings:
          type: array
          description: What a template could not carry, and why.
          items:
            type: string
        themeArn:
          type: string
          description: The theme that would be written when a template is applied.

    SettingSource:
      type: string
      enum: [stored, env, default]

    SettingDefinition:
      type: object
      required: [key, label, description, type, source, sensitive]
      properties:
        key:
          type: string
          description: Dotted key, e.g. smus.domainId
        label:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [string, text, select, multiselect, boolean]
        value:
          description: The effective value. A string, a list of strings, or a boolean; absent when unset.
          oneOf:
            - type: string
            - type: boolean
            - type: array
              items:
                type: string
        source:
          $ref: '#/components/schemas/SettingSource'
        envVar:
          type: string
          description: The environment variable the setting falls back to.
        sensitive:
          type: boolean
          description: Read-only here; only reports whether the env var is set.
        options:
          type: array
          description: For select and multiselect, the fixed choices when they are static.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        optionsFrom:
          type: string
          description: For multiselect choices fetched live, the endpoint that serves them.

    SettingsGroup:
      type: object
      required: [id, title, description, settings]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SettingDefinition'

    SettingsSnapshot:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SettingsGroup'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    ApiKey:
      type: object
      required: [id, label, prefix, createdAt, createdBy]
      properties:
        id:
          type: string
        label:
          type: string
        prefix:
          type: string
          description: The first characters of the secret, to recognise it in a config file.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUsedAt:
          type: string
          format: date-time

    ApiKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: "Shown once. Send it as `Authorization: Bearer <secret>`."

    SettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Setting key to new value. null clears the stored value.
          additionalProperties:
            anyOf:
              - type: string
                nullable: true
              - type: boolean
              - type: array
                items:
                  type: string

    SmusProjectDiagnostics:
      type: object
      description: How the project list was found, so an empty picker can explain itself.
      required: [domainId, region, fromListProjects, listings, publishers]
      properties:
        domainId:
          type: string
        region:
          type: string
        fromListProjects:
          type: integer
          description: Projects DataZone ListProjects returned for the portal's role (member-scoped).
        listings:
          type: integer
          description: Published listings the catalog sweep saw.
        publishers:
          type: integer
          description: Distinct projects that own those listings.
        listProjectsError:
          type: string
        listingsError:
          type: string
        callerArn:
          type: string
          description: The principal DataZone saw (the Lambda's assumed-role session), from STS.
        roleArn:
          type: string
          description: The IAM role behind that session - what smus-grant and the SMUS console register.
        profileStatus:
          type: string
          description: The role's user profile status in the domain, or 'not found'.
        listingsFallback:
          type: string
          description: Set when the per-project listing filter was refused and the domain was swept instead.
        listingsWithTable:
          type: integer
          description: Listings whose metadata forms named a Glue table.
        listingsWithColumns:
          type: integer
          description: Listings whose metadata forms carried a column list. Without these there is no column tie-back.
        formNames:
          type: array
          description: The metadata forms seen across the listings, so a domain that publishes no schema says what it does publish.
          items:
            type: string

    SmusProject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    SmusAssetColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: The source type as the catalog reports it, e.g. string, bigint, timestamp.

    SmusMatchType:
      type: string
      enum: [source-table, custom-sql, name, lineage]
      description: >
        How a dataset was tied to a listing, in descending confidence — by a
        relational source table (schema.table), by a db.table reference parsed
        from custom SQL, by the dataset's display name, or through a parent
        dataset that matched, for a dataset built on another one and so
        carrying no table identity of its own.

    SmusLinkVia:
      type: object
      required: [datasetId]
      description: The parent dataset a `lineage` tie came through.
      properties:
        datasetId:
          type: string
        name:
          type: string

    SmusLinkedDataset:
      type: object
      required: [id, name, matchType]
      properties:
        id:
          type: string
        name:
          type: string
        matchType:
          $ref: '#/components/schemas/SmusMatchType'
        via:
          $ref: '#/components/schemas/SmusLinkVia'

    SmusAsset:
      type: object
      required: [listingId, assetId, name, assetType, datasets]
      properties:
        listingId:
          type: string
        assetId:
          type: string
        name:
          type: string
        assetType:
          type: string
        description:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
          description: Deep link to the listing in the SMUS portal.
        table:
          type: object
          description: The Glue table behind the listing, when its forms say.
          required: [database, name]
          properties:
            catalog:
              type: string
            database:
              type: string
            name:
              type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SmusAssetColumn'
        datasets:
          type: array
          description: QuickSight datasets the portal matched to this listing.
          items:
            $ref: '#/components/schemas/SmusLinkedDataset'

    CreateSmusDatasetRequest:
      type: object
      properties:
        dataSourceId:
          type: string
          description: |
            An existing QuickSight data source. Omitted: the Athena data source
            the SMUS-linked datasets already read through (see
            GET /api/smus/data-source).
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to the listing name.
        importMode:
          type: string
          enum: [DIRECT_QUERY, SPICE]
        permissionsFromDataSetId:
          type: string
          description: Copy this dataset's permissions onto the new one, so it has the same audience.

    GlossaryTerm:
      type: object
      required: [name]
      properties:
        name:
          type: string
        shortDescription:
          type: string

    MetadataForm:
      type: object
      description: One SMUS metadata form, flattened to label/value pairs.
      required: [name, fields]
      properties:
        name:
          type: string
        fields:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string

    SmusCatalogColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
          description: From the SMUS column metadata, when present.

    FieldUsage:
      type: object
      required: [dashboards, analyses]
      properties:
        dashboards:
          type: integer
        analyses:
          type: integer

    FieldUsedIn:
      type: object
      required: [assetType, assetId, assetName]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        assetName:
          type: string

    FieldLineageNotes:
      type: object
      description: Where a field's data comes from, as the person who documented it wrote it down.
      properties:
        sourceSystem:
          type: string
        sourceTable:
          type: string
        sourceField:
          type: string
        transformationLogic:
          type: string
        updateFrequency:
          type: string

    FieldMetadataUpdate:
      type: object
      description: What the portal keeps about a field. Tags are free text.
      properties:
        description:
          type: string
        businessGlossary:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]
        lineage:
          $ref: '#/components/schemas/FieldLineageNotes'
        updatedBy:
          type: string

    FieldMetadata:
      allOf:
        - $ref: '#/components/schemas/FieldMetadataUpdate'
        - type: object
          required: [sourceType, sourceId, fieldName]
          properties:
            sourceType:
              type: string
              enum: [dataset, analysis, dashboard]
            sourceId:
              type: string
            fieldName:
              type: string
            lastUpdated:
              type: string
              format: date-time

    PortalFieldMetadata:
      type: object
      description: What the portal stores for a field because SMUS has no home for it.
      properties:
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]

    FieldVisualUsage:
      type: object
      description: One visual that reads the field.
      required: [assetType, assetId, assetName, visualId, visualName]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        assetName:
          type: string
        sheetName:
          type: string
        visualId:
          type: string
        visualName:
          type: string

    ExpressionVariant:
      type: object
      description: One distinct expression a calculated field has somewhere.
      required: [expression, sources]
      properties:
        expression:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FieldUsedIn'

    FieldConflict:
      type: object
      description: |
        The same calculated field name defined with different expressions
        across assets. The dataset's own expression is the reference; the
        variants are what dashboards and analyses redefined it as.
      required: [count, variants]
      properties:
        count:
          type: integer
          description: Number of distinct expressions, including the dataset's own.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ExpressionVariant'

    SmusColumnLink:
      type: object
      description: Where a plain column comes from in SMUS.
      required: [listingId, columnName]
      properties:
        listingId:
          type: string
        columnName:
          type: string
        description:
          type: string
        url:
          type: string

    DatasetCatalogField:
      type: object
      required: [name, dataType, isCalculated, usage, usedIn, references, usedBy]
      properties:
        name:
          type: string
        dataType:
          type: string
        isCalculated:
          type: boolean
        expression:
          type: string
          description: Calculated fields only.
        references:
          type: array
          description: Fields this expression reads (calculated fields only). Lineage downwards.
          items:
            type: string
        usedBy:
          type: array
          description: Calculated fields in the same dataset whose expressions read this field. Lineage upwards.
          items:
            type: string
        usage:
          $ref: '#/components/schemas/FieldUsage'
        usedIn:
          type: array
          description: Dashboards and analyses that use the field.
          items:
            $ref: '#/components/schemas/FieldUsedIn'
        visuals:
          type: array
          description: The visuals that read the field, when the visual-field index has them.
          items:
            $ref: '#/components/schemas/FieldVisualUsage'
        conflict:
          $ref: '#/components/schemas/FieldConflict'
        smus:
          $ref: '#/components/schemas/SmusColumnLink'
        portal:
          $ref: '#/components/schemas/PortalFieldMetadata'
        template:
          type: object
          description: Present when this field is saved in the template library.
          required: [id]
          properties:
            id:
              type: string

    TemplateVisual:
      type: object
      description: A visual by column names, with no dataset; the builder places it by rule.
      required: [type, values]
      properties:
        type:
          type: string
          enum: [KPI, BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
        title:
          type: string
        category:
          type: string
          description: Required except for KPI and Table.
        granularity:
          type: string
          enum: [DAY, WEEK, MONTH, QUARTER, YEAR]
        values:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [column]
            properties:
              column:
                type: string
              aggregation:
                type: string
                enum: [SUM, AVERAGE, COUNT, DISTINCT_COUNT, MIN, MAX]
        color:
          type: string

    VisualTemplateInput:
      type: object
      required: [name, visual]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        visual:
          $ref: '#/components/schemas/TemplateVisual'

    VisualTemplate:
      type: object
      required: [id, name, visual, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        visual:
          $ref: '#/components/schemas/TemplateVisual'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FilterBarControl:
      type: object
      required: [column, span]
      properties:
        column:
          type: string
          description: Matched case-insensitively against the datasets' columns; a column no dataset has is skipped.
        title:
          type: string
        span:
          type: integer
          minimum: 1
          maximum: 6
          description: Width in the control bar.
        values:
          type: array
          items:
            type: string
          description: Text columns - values selected to start with.

    FilterBarTemplateInput:
      type: object
      required: [name, controls]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        isDefault:
          type: boolean
          description: Make this the default; the previous default stops being it.
        controls:
          type: array
          minItems: 1
          maxItems: 12
          description: The controls, in bar order.
          items:
            type: object
            required: [column]
            properties:
              column:
                type: string
              title:
                type: string
              span:
                type: integer
                minimum: 1
                maximum: 6
              values:
                type: array
                items:
                  type: string

    FilterBarTemplate:
      type: object
      required: [id, name, isDefault, controls, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        controls:
          type: array
          items:
            $ref: '#/components/schemas/FilterBarControl'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalculatedFieldTemplate:
      type: object
      description: |
        A calculated field saved for reuse. Author can add it to a copy it
        creates; the catalog shows which fields already match it.
      required: [id, name, expression, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        expression:
          type: string
        dataType:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: object
          description: Where it was saved from, when saved from the catalog.
          properties:
            datasetId:
              type: string
            datasetName:
              type: string
            listingId:
              type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalculatedFieldTemplateInput:
      type: object
      required: [name, expression]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        expression:
          type: string
          minLength: 1
        dataType:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: object
          properties:
            datasetId:
              type: string
            datasetName:
              type: string
            listingId:
              type: string

    CatalogDataset:
      type: object
      required: [id, name, matchType, calculatedFieldCount, fields]
      properties:
        id:
          type: string
        name:
          type: string
        matchType:
          $ref: '#/components/schemas/SmusMatchType'
        importMode:
          type: string
        calculatedFieldCount:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetCatalogField'

    SmusCatalogAssetBase:
      type: object
      required: [listingId, assetId, name, glossaryTerms, columnCount, calculatedFieldCount, usage]
      properties:
        listingId:
          type: string
        assetId:
          type: string
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
        table:
          type: object
          required: [database, name]
          properties:
            catalog:
              type: string
            database:
              type: string
            name:
              type: string
        glossaryTerms:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryTerm'
        columnCount:
          type: integer
        calculatedFieldCount:
          type: integer
        usage:
          $ref: '#/components/schemas/FieldUsage'
        updatedAt:
          type: string
          format: date-time

    SmusCatalogAssetSummary:
      allOf:
        - $ref: '#/components/schemas/SmusCatalogAssetBase'
        - type: object
          required: [datasets]
          properties:
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/SmusLinkedDataset'

    CalculatedFieldRef:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [dashboard, analysis, dataset]
        id:
          type: string
        name:
          type: string

    CatalogListingRef:
      type: object
      required: [listingId, name]
      properties:
        listingId:
          type: string
        name:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
        matchType:
          $ref: '#/components/schemas/SmusMatchType'
        via:
          $ref: '#/components/schemas/SmusLinkVia'

    CatalogDatasetRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        listing:
          $ref: '#/components/schemas/CatalogListingRef'

    SmusColumnRef:
      type: object
      required: [listingId, name, match, listingColumnCount, glossaryTerms]
      properties:
        listingId:
          type: string
        name:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
        columnName:
          type: string
          description: Absent when the dataset is tied to the listing but the listing's schema does not name the column.
        columnType:
          type: string
          description: The type the listing gives the column, which is rarely spelled as QuickSight spells it.
        match:
          type: string
          enum: [exact, normalized, listing-only, no-schema]
          description: |
            How the column tied back - exact name, normalized name (case,
            separators, camel humps), a listing whose schema does not have this
            column, or a listing that published no column list at all.
        listingColumnCount:
          type: integer
          description: How many columns the listing names, so an empty schema is legible as one.
        description:
          type: string
        glossaryTerms:
          type: array
          items:
            type: string

    FieldUsageCounts:
      type: object
      required: [dashboards, analyses, visuals]
      properties:
        dashboards:
          type: integer
        analyses:
          type: integer
        visuals:
          type: integer

    CalculatedFieldSummary:
      type: object
      required: [key, name, expression, definedIn, datasets, references, usedBy, hasNote]
      properties:
        key:
          type: string
          description: Stable id for one distinct (name, expression).
        name:
          type: string
        expression:
          type: string
        dataType:
          type: string
        definedIn:
          type: array
          items:
            $ref: '#/components/schemas/CalculatedFieldRef'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDatasetRef'
        references:
          type: array
          items:
            type: string
        usedBy:
          $ref: '#/components/schemas/FieldUsageCounts'
        conflict:
          type: object
          description: Other expressions carrying the same name.
          required: [variants]
          properties:
            variants:
              type: integer
        template:
          type: object
          required: [id]
          properties:
            id:
              type: string
        hasNote:
          type: boolean

    CalculatedFieldCatalog:
      type: object
      required: [configured, exportedAt, projectFilter, counts, items]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
        projectFilter:
          type: array
          items:
            type: string
        counts:
          type: object
          required: [fields, names, conflicts, templated, unused, datasets, outsideSmus]
          properties:
            fields:
              type: integer
            names:
              type: integer
            conflicts:
              type: integer
            templated:
              type: integer
            unused:
              type: integer
            datasets:
              type: integer
            outsideSmus:
              type: integer
              description: Fields on datasets that matched no listing, counted before the scope filter.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalculatedFieldSummary'

    LineageRead:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [column, calculated]
        key:
          type: string
        dataType:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        smus:
          $ref: '#/components/schemas/SmusColumnRef'

    FieldLineageNode:
      type: object
      required: [id, name, kind, depth]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [column, calculated]
        depth:
          type: integer
          description: >
            Signed — negative upstream (what the focused field is computed
            from), 0 for the field itself, positive downstream. A field
            reachable at several depths keeps the nearest.
        key:
          type: string
          description: Calculated fields only — their catalog key, so a node opens.
        expression:
          type: string
        dataType:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        smus:
          $ref: '#/components/schemas/SmusColumnRef'
        usedBy:
          $ref: '#/components/schemas/FieldUsageCounts'

    FieldLineageEdge:
      type: object
      required: [from, to]
      description: Data flows from `from` to `to` — `to` reads `from`.
      properties:
        from:
          type: string
        to:
          type: string

    FieldLineage:
      type: object
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FieldLineageNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/FieldLineageEdge'
        truncated:
          type: boolean
          description: True when the walk hit its depth or size bound, so the chain is partial.

    CalculatedFieldDetail:
      allOf:
        - $ref: '#/components/schemas/CalculatedFieldSummary'
        - type: object
          required: [variants, reads, readBy, usedIn, visuals, lineage]
          properties:
            variants:
              type: array
              description: Every distinct expression under this name, this one included.
              items:
                type: object
                required: [key, expression, definedIn]
                properties:
                  key:
                    type: string
                  expression:
                    type: string
                  definedIn:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalculatedFieldRef'
            reads:
              type: array
              items:
                $ref: '#/components/schemas/LineageRead'
            readBy:
              type: array
              items:
                type: object
                required: [key, name, expression, definedIn]
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  expression:
                    type: string
                  definedIn:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalculatedFieldRef'
            usedIn:
              type: array
              items:
                $ref: '#/components/schemas/FieldUsedIn'
            visuals:
              type: array
              items:
                $ref: '#/components/schemas/FieldVisualUsage'
            lineage:
              $ref: '#/components/schemas/FieldLineage'
            portal:
              $ref: '#/components/schemas/PortalFieldMetadata'

    ColumnCatalogItem:
      type: object
      required: [name, datasets, usedBy, usedByCalculated]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Absent when the dataset export did not say (QuickSight leaves OutputColumns.Type out for some columns).
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDatasetRef'
        smus:
          $ref: '#/components/schemas/SmusColumnRef'
        usedBy:
          $ref: '#/components/schemas/FieldUsageCounts'
        usedByCalculated:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key:
                type: string
              name:
                type: string

    ColumnCatalog:
      type: object
      required: [configured, exportedAt, counts, items]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
        counts:
          type: object
          required: [columns, datasets, withSmus, withSmusColumn, outsideSmus]
          properties:
            columns:
              type: integer
            datasets:
              type: integer
            withSmus:
              type: integer
              description: Columns whose dataset is tied to a SMUS listing.
            withSmusColumn:
              type: integer
              description: Of those, the ones the listing's own schema names.
            outsideSmus:
              type: integer
              description: Columns on datasets that matched no listing, counted before the scope filter.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ColumnCatalogItem'

    SmusCatalogAsset:
      allOf:
        - $ref: '#/components/schemas/SmusCatalogAssetBase'
        - type: object
          required: [forms, columns, datasets]
          properties:
            forms:
              type: array
              items:
                $ref: '#/components/schemas/MetadataForm'
            columns:
              type: array
              items:
                $ref: '#/components/schemas/SmusCatalogColumn'
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/CatalogDataset'

    SmusCatalog:
      type: object
      required: [configured, projectFilter, projects, glossaryTerms, assets, exportedAt]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
          description: When the SMUS snapshot was taken; null when no export has run.
        projectFilter:
          type: array
          items:
            type: string
        projects:
          type: array
          description: Projects present in the result, with counts, for filtering.
          items:
            type: object
            required: [id, name, count]
            properties:
              id:
                type: string
              name:
                type: string
              count:
                type: integer
        glossaryTerms:
          type: array
          description: Terms present in the result, with counts, for filtering.
          items:
            allOf:
              - $ref: '#/components/schemas/GlossaryTerm'
              - type: object
                required: [count]
                properties:
                  count:
                    type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/SmusCatalogAssetSummary'

    FilterControlKind:
      type: string
      enum: [dropdown, singleSelect, list, dateRange, relativeDate, slider]
      description: |
        The control a filter gets. Text columns: dropdown (multi-select),
        singleSelect, list. Dates: dateRange, relativeDate. Numbers: slider
        (needs min and max). The column type's default when omitted.

    ControlPlacement:
      type: string
      enum: [controlBar, canvas]
      description: |
        controlBar - the collapsible strip at the top of the sheet, where
        QuickSight puts controls by default. canvas - on the sheet grid,
        above the visuals.

    DefinitionOp:
      type: object
      description: |
        One edit to a definition, applied by deterministic code after
        validation. Element and visual ids are the definition's own; a sheet
        outline (see RebindPreview.outline) lists them. addVisual builds a
        visual from column names (as VisualSpec) below the last tile;
        addFilter adds a filter with its control; addAction gives a visual an
        interaction (VisualAction). Changing a visual's
        type keeps its field wells, title and subtitle and resets the rest of
        the chart configuration to defaults; only conversions whose field
        wells translate are allowed.
      required: [op, sheetId]
      properties:
        op:
          type: string
          enum: [move, resize, retype, retitle, remove, duplicate, renameSheet, addFilter, addVisual, addAction]
        sheetId:
          type: string
        visual:
          $ref: '#/components/schemas/VisualSpec'
        action:
          $ref: '#/components/schemas/VisualAction'
        control:
          $ref: '#/components/schemas/FilterControlKind'
        placement:
          $ref: '#/components/schemas/ControlPlacement'
        appliesTo:
          type: array
          items:
            type: string
          description: addFilter. Visuals it narrows, by element id or title; every visual on the sheet when omitted.
        lastDays:
          type: integer
          minimum: 1
          description: addFilter with relativeDate.
        identifier:
          type: string
          description: addFilter. The dataset identifier the definition declares (not the dataset ARN).
        column:
          type: string
          description: addFilter. The column to filter on.
        columnType:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATETIME]
          description: addFilter. Read from how the definition uses the column when omitted.
        values:
          type: array
          items:
            type: string
          description: addFilter on a text column. Values selected to start with.
        min:
          type: number
          description: addFilter on a number column. Slider minimum (required with max).
        max:
          type: number
        elementId:
          type: string
          description: move, resize, remove, duplicate, retype, retitle, addAction. The layout element id (the visual id for visuals, the control id for controls, wherever they sit); addAction also takes the visual's title.
        col:
          type: integer
          minimum: 0
          maximum: 35
          description: move, duplicate. Grid column, 0-35.
        row:
          type: integer
          minimum: 0
          description: move, duplicate. Grid row.
        colSpan:
          type: integer
          minimum: 1
          maximum: 36
          description: resize.
        rowSpan:
          type: integer
          minimum: 1
          description: resize.
        visualType:
          type: string
          enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
          description: retype. Column is a vertical bar chart; Donut is a pie with a hole.
        title:
          type: string
          description: retitle, duplicate.
        subtitle:
          type: string
          description: retitle.
        name:
          type: string
          description: renameSheet.

    DefinitionChange:
      type: object
      description: One change in plain language, for review before publishing.
      required: [kind, description]
      properties:
        kind:
          type: string
          enum: [template, repair, rebind, rename, calculatedField, layout, visual, sheet, filter]
        description:
          type: string
        sheetId:
          type: string
        elementId:
          type: string

    SheetOutlineElement:
      type: object
      required: [elementId, kind]
      properties:
        elementId:
          type: string
        kind:
          type: string
          enum: [visual, filterControl, parameterControl, textBox, image, other]
        visualType:
          type: string
        title:
          type: string
        col:
          type: integer
        row:
          type: integer
        colSpan:
          type: integer
        rowSpan:
          type: integer
        placement:
          type: string
          enum: [canvas, controlBar]
          description: |
            Controls only. `controlBar` - in the sheet's collapsible control
            bar (SheetControlLayouts), QuickSight's default; `canvas` - placed
            on the sheet like a visual.
        fieldWells:
          type: array
          items:
            type: object
            required: [role, fields]
            properties:
              role:
                type: string
              fields:
                type: array
                items:
                  type: string

    SheetOutline:
      type: object
      description: A compact, id-bearing view of a sheet for editing and for the planner.
      required: [sheetId, name, layout, elements]
      properties:
        sheetId:
          type: string
        name:
          type: string
        layout:
          type: string
          enum: [grid, freeform, section, flow]
        elements:
          type: array
          items:
            $ref: '#/components/schemas/SheetOutlineElement'

    VisualHealth:
      type: object
      required: [sheetId, visualId]
      properties:
        sheetId:
          type: string
        visualId:
          type: string
        loadTimeP90Ms:
          type: number
        errors:
          type: integer
          description: Load errors over the window.

    AssetInsights:
      type: object
      description: |
        What the portal knows about how an asset is used, to rank sources and
        flag problems before they are cloned. Views come from the portal's
        activity data (CloudTrail); health comes from QuickSight's CloudWatch
        metrics when the dashboard has them.
      required: [assetType, assetId, views]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        views:
          type: object
          required: [total, last30d, uniqueViewers]
          properties:
            total:
              type: integer
            last30d:
              type: integer
            uniqueViewers:
              type: integer
            lastViewedAt:
              type: string
              format: date-time
        health:
          type: object
          description: Dashboards only. Absent when metrics are unavailable.
          required: [windowDays, viewLoads, visuals]
          properties:
            windowDays:
              type: integer
            viewLoads:
              type: integer
            viewLoadTimeP90Ms:
              type: number
            visuals:
              type: array
              items:
                $ref: '#/components/schemas/VisualHealth'

    AssetHealth:
      type: object
      required: [id]
      properties:
        id:
          type: string
        viewLoads:
          type: integer
          description: Dashboards. Views over the window.
        viewLoadTimeP90Ms:
          type: number
          description: Dashboards.
        visualErrors:
          type: integer
          description: Dashboards. Visual load errors over the window.
        ingestionRuns:
          type: integer
          description: Datasets. Refreshes over the window.
        ingestionLatencyP90Ms:
          type: number
          description: Datasets.
        ingestionErrorRows:
          type: integer
          description: Datasets. Rows skipped for errors over the window.

    AssetHealthBatch:
      type: object
      required: [assetType, windowDays, available, items]
      properties:
        assetType:
          type: string
          enum: [dashboard, dataset]
        windowDays:
          type: integer
        available:
          type: boolean
          description: False when CloudWatch could not be read (no metrics or no permission); items are then empty.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetHealth'

    BulkItemFailure:
      type: object
      required: [item, error]
      properties:
        item:
          type: string
          description: Human-readable item label, e.g. "alice → analysts"
        error:
          type: string
          description: Failure reason as reported by the underlying operation

    Ingestion:
      type: object
      required: [id, datasetId, status, createdTime]
      properties:
        id:
          type: string
          description: Ingestion ID
        datasetId:
          type: string
          description: Dataset ID
        datasetName:
          type: string
          description: Dataset name
        datasetArn:
          type: string
          description: Dataset ARN
        datasourceType:
          type: string
          description: Type of datasource (S3, REDSHIFT, etc.)
        importMode:
          type: string
          enum: [SPICE, DIRECT_QUERY]
          description: Import mode of the dataset (SPICE or DIRECT_QUERY)
        sizeInBytes:
          type: integer
          description: Size of the dataset in bytes (SPICE capacity)
        ingestionArn:
          type: string
          description: Ingestion ARN
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, CANCELLED, INITIALIZED, QUEUED]
          description: Ingestion status
        createdTime:
          type: string
          format: date-time
          description: When the ingestion was created
        ingestionTimeInSeconds:
          type: integer
          description: Time taken for ingestion in seconds
        ingestionSizeInBytes:
          type: integer
          description: Size of data ingested in bytes
        rowsIngested:
          type: integer
          description: Number of rows successfully ingested
        rowsDropped:
          type: integer
          description: Number of rows dropped during ingestion
        errorType:
          type: string
          description: Type of error if failed
        errorMessage:
          type: string
          description: Error message if failed
        requestType:
          type: string
          enum: [INITIAL_INGESTION, INCREMENTAL_REFRESH, FULL_REFRESH, EDIT]
          description: Type of ingestion request
        queueInfo:
          type: object
          properties:
            waitingOnIngestion:
              type: string
              description: ID of ingestion this is waiting on
            queuedIngestion:
              type: string
              description: ID of queued ingestion

    # SMUS (SageMaker Unified Studio) schemas
    SearchableType:
      type: string
      enum: [dashboard, analysis, dataset, datasource, folder, project, smus-listing, smus-column, calculated-field, visual, template]

    SearchAssetRef:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [dashboard, analysis, dataset]
        id:
          type: string
        name:
          type: string

    SearchHit:
      type: object
      required: [type, id, name, score, why, summary, path]
      properties:
        type:
          $ref: '#/components/schemas/SearchableType'
        id:
          type: string
        name:
          type: string
        score:
          type: number
        why:
          type: array
          description: 'Which field matched which query word, e.g. "column: revenue".'
          items:
            type: string
        summary:
          type: string
          description: One line for a person or an agent.
        path:
          type: string
          description: Where to open it in the portal.
        description:
          type: string
        views:
          type: integer
        updatedAt:
          type: string
          format: date-time
        expression:
          type: string
          description: Calculated fields and templates - the expression.
        parent:
          description: The asset a calculated field or visual belongs to.
          allOf:
            - $ref: '#/components/schemas/SearchAssetRef'
        definedIn:
          type: array
          description: Calculated fields - every asset that defines this exact expression.
          items:
            $ref: '#/components/schemas/SearchAssetRef'
        projectId:
          type: string
          description: The SMUS project a project, listing, column or linked dataset belongs to.
        entityId:
          type: string
          description: The same thing in the context graph (/api/context/entities/{entityId}).

    SearchResponse:
      type: object
      required: [q, hits, indexed, indexedAt]
      properties:
        q:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        indexed:
          type: object
          description: Documents considered, by type.
          additionalProperties:
            type: integer
        indexedAt:
          type: string
          format: date-time

    ContextEntityType:
      type: string
      enum: [project, listing, listing-column, glossary-term, datasource, dataset, calculated-field, analysis, dashboard, visual, template, folder]

    ContextRelation:
      type: string
      enum: [in-project, has-column, tagged, reads-listing, through-datasource, exposes, uses-dataset, defined-in, reads-column, in-asset, in-folder]

    ContextEntity:
      type: object
      required: [id, type, name, summary, attributes]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ContextEntityType'
        name:
          type: string
        description:
          type: string
        summary:
          type: string
        attributes:
          type: object
          description: Facts worth reasoning on (column type, import mode, project id, expression).
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        path:
          type: string

    ContextStep:
      type: object
      required: [relation, direction]
      properties:
        relation:
          $ref: '#/components/schemas/ContextRelation'
        direction:
          type: string
          enum: [out, in]
        note:
          type: string
          description: Why an inferred edge exists, e.g. "by table".

    ContextSearchHit:
      type: object
      required: [name, summary, why, score, path]
      properties:
        entityId:
          type: string
        type:
          type: string
        name:
          type: string
        summary:
          type: string
        why:
          type: array
          items:
            type: string
        score:
          type: number
        projectId:
          type: string
        path:
          type: string

    ContextSearchResponse:
      type: object
      required: [q, hits, indexedAt]
      properties:
        q:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ContextSearchHit'
        indexedAt:
          type: string
          format: date-time

    ContextEntityDetail:
      type: object
      required: [entity, relations]
      properties:
        entity:
          $ref: '#/components/schemas/ContextEntity'
        relations:
          type: array
          items:
            type: object
            required: [relation, direction, count, examples]
            properties:
              relation:
                $ref: '#/components/schemas/ContextRelation'
              direction:
                type: string
                enum: [out, in]
              count:
                type: integer
              examples:
                type: array
                items:
                  type: object
                  required: [entityId, name]
                  properties:
                    entityId:
                      type: string
                    name:
                      type: string
                    note:
                      type: string

    ContextRelatedResponse:
      type: object
      required: [from, hits]
      properties:
        from:
          type: string
        hits:
          type: array
          items:
            type: object
            required: [entityId, type, name, summary, attributes, depth, via]
            properties:
              entityId:
                type: string
              type:
                $ref: '#/components/schemas/ContextEntityType'
              name:
                type: string
              summary:
                type: string
              description:
                type: string
              attributes:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
              depth:
                type: integer
              via:
                type: array
                items:
                  $ref: '#/components/schemas/ContextStep'

    SmusStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a SMUS domain is configured for this portal
        domainId:
          type: string
          description: DataZone domain identifier backing the SMUS domain
        region:
          type: string
        portalUrl:
          type: string
          description: Base URL of the SMUS portal used for deep links
        snapshot:
          description: The last SMUS export; absent when none has run.
          allOf:
            - $ref: '#/components/schemas/SmusSnapshotSummary'

    SmusSnapshotSummary:
      type: object
      description: What the last SMUS export captured, for the Operations page and empty states.
      required: [exportedAt, projectFilter, projects, listings, publishers]
      properties:
        exportedAt:
          type: string
          format: date-time
        projectFilter:
          type: array
          description: The project ids the listings were limited to; empty means the whole domain.
          items:
            type: string
        domainId:
          type: string
        region:
          type: string
        projects:
          type: integer
          description: Projects in the snapshot (ListProjects unioned with listing publishers).
        listings:
          type: integer
          description: Published listings captured.
        publishers:
          type: integer
          description: Distinct projects owning those listings.
        jobId:
          type: string
          description: The export job that wrote the snapshot.
        diagnostics:
          $ref: '#/components/schemas/SmusProjectDiagnostics'

    JobQueuedEnvelope:
      type: object
      description: A job was queued (or an equivalent one is already running); follow `data.jobId`.
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/JobQueued'

    JobQueued:
      type: object
      description: |
        A call that runs as a job. Poll `GET /api/jobs/{jobId}` until
        `status` is `completed` or `failed`; a job that produces something
        puts it under `GET /api/jobs/{jobId}/result`.
      required: [jobId, status, message]
      properties:
        jobId:
          type: string
        status:
          type: string
        message:
          type: string

    SmusExportQueued:
      type: object
      required: [jobId, status, message]
      properties:
        jobId:
          type: string
        status:
          type: string
        message:
          type: string

    SmusDatasetLink:
      type: object
      required: [datasetId, linked]
      properties:
        datasetId:
          type: string
          description: QuickSight dataset identifier
        linked:
          type: boolean
          description: Whether a matching SMUS catalog listing was found
        matchType:
          $ref: '#/components/schemas/SmusMatchType'
        via:
          $ref: '#/components/schemas/SmusLinkVia'
        listingId:
          type: string
          description: SMUS catalog listing identifier
        assetId:
          type: string
          description: Underlying DataZone asset identifier
        listingName:
          type: string
          description: Name of the matched catalog listing
        url:
          type: string
          description: Deep link to the listing in the SMUS portal

    IngestionMetadata:
      type: object
      required: [totalIngestions, runningIngestions, failedIngestions, lastUpdated]
      properties:
        totalIngestions:
          type: integer
          description: Total number of ingestions
        runningIngestions:
          type: integer
          description: Number of currently running ingestions
        failedIngestions:
          type: integer
          description: Number of failed ingestions
        lastUpdated:
          type: string
          format: date-time
          description: When the data was last updated

    IngestionListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [ingestions, metadata, pagination, availableSourceTypes]
          properties:
            ingestions:
              type: array
              items:
                $ref: '#/components/schemas/Ingestion'
            availableSourceTypes:
              type: array
              description: The data source types among these ingestions, with counts, for the filter.
              items:
                type: object
                required: [value, count]
                properties:
                  value:
                    type: string
                  count:
                    type: integer
            metadata:
              $ref: '#/components/schemas/IngestionMetadata'
            pagination:
              type: object
              required: [page, pageSize, totalItems, totalPages, hasMore]
              properties:
                page:
                  type: integer
                pageSize:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasMore:
                  type: boolean

    # Data Catalog schemas
    TagWithCount:
      type: object
      required: [key, value, count]
      properties:
        key:
          type: string
          description: Tag key
        value:
          type: string
          description: Tag value
        count:
          type: integer
          description: Number of assets with this tag

    CatalogAsset:
      type: object
      required: [id, name, type, fieldCount]
      properties:
        id:
          type: string
          description: Asset ID
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: Asset type (dashboard, analysis, dataset)
        fieldCount:
          type: integer
          description: Number of fields from this asset in the catalog

    CatalogField:
      type: object
      required: [fieldId, fieldName, dataType, isCalculated, sourceAssetType, sourceAssetId, sourceAssetName]
      properties:
        fieldId:
          type: string
        fieldName:
          type: string
        dataType:
          type: string
        description:
          type: string
        isCalculated:
          type: boolean
        sourceAssetType:
          type: string
        sourceAssetId:
          type: string
        sourceAssetName:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        columnName:
          type: string
          nullable: true
        expression:
          type: string
          nullable: true
        expressions:
          type: array
          items:
            type: object
            properties:
              expression:
                type: string
              sources:
                type: array
                items:
                  type: object
                  properties:
                    assetType:
                      type: string
                    assetId:
                      type: string
                    assetName:
                      type: string
                    dataType:
                      type: string
                    lastUpdated:
                      type: string
        dependencies:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldSource'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldSource'
        hasVariants:
          type: boolean
        usageCount:
          type: integer
        analysisCount:
          type: integer
        dashboardCount:
          type: integer
        datasetCount:
          type: integer
        expressionLength:
          type: integer
          description: Trimmed character length of the representative expression.
        hasComments:
          type: boolean
          description: Whether any in-scope variant of this calculated field contains author comments.
        fieldReferences:
          type: array
          description: Field names referenced by this calculated field's expression(s).
          items:
            type: string
        hasExpressionConflict:
          type: boolean
          description: True when the same field name resolves to more than one distinct expression across assets.
        conflictCount:
          type: integer
          description: Number of distinct expressions found for this field name.
        usedBy:
          type: array
          description: Names of calculated fields that reference this field (reverse lineage).
          items:
            type: string

    CatalogFieldSource:
      type: object
      properties:
        assetType:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        dataType:
          type: string
        lastUpdated:
          type: string

    DataCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogField'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer
            hasMore:
              type: boolean
        summary:
          type: object
          properties:
            totalFields:
              type: integer
            distinctFields:
              type: integer
            totalCalculatedFields:
              type: integer
            calculatedDatasetFields:
              type: integer
            calculatedAnalysisFields:
              type: integer
            visualFields:
              type: integer
            fieldsByDataType:
              type: object
              additionalProperties:
                type: integer
            fieldsWithVariants:
              type: integer
            fieldsWithComments:
              type: integer
            fieldsWithConflicts:
              type: integer
            avgExpressionLength:
              type: integer
            lastUpdated:
              type: string
              format: date-time
            processingTimeMs:
              type: integer

    CatalogStats:
      type: object
      properties:
        totalAssets:
          type: integer
        assetsByType:
          type: object
          additionalProperties:
            type: integer
        totalFields:
          type: integer
        totalTags:
          type: integer
        lastUpdated:
          type: string
          format: date-time

    VisualFieldCatalogResponse:
      type: object
      properties:
        visualFields:
          type: array
          items:
            type: object
            properties:
              fieldId:
                type: string
              visualId:
                type: string
              visualName:
                type: string
              sheetId:
                type: string
              sheetName:
                type: string
              dashboardId:
                type: string
              dashboardName:
                type: string
              fieldName:
                type: string
              dataType:
                type: string
              isCalculated:
                type: boolean
              lastUpdated:
                type: string
        summary:
          type: object
          properties:
            totalVisualFields:
              type: integer
            totalVisuals:
              type: integer
            totalSheets:
              type: integer
            totalDashboards:
              type: integer
            lastUpdated:
              type: string
              format: date-time
            processingTimeMs:
              type: integer

    UserInactiveAnalysis:
      type: object
      required: [analysisId, analysisName, totalViews, uniqueViewers]
      properties:
        analysisId:
          type: string
        analysisName:
          type: string
        createdTime:
          type: string
          format: date-time
          nullable: true
        lastUpdatedTime:
          type: string
          format: date-time
          nullable: true
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true

    UserUnusedDataset:
      type: object
      required: [datasetId, datasetName, importMode, sizeInBytes]
      properties:
        datasetId:
          type: string
        datasetName:
          type: string
        createdTime:
          type: string
          format: date-time
          nullable: true
        lastUpdatedTime:
          type: string
          format: date-time
          nullable: true
        importMode:
          type: string
          enum: [SPICE, DIRECT_QUERY]
        sizeInBytes:
          type: integer
          minimum: 0
        sizeFormatted:
          type: string
          nullable: true
          description: Human-readable size (e.g. "12.5 MB", "1.2 GB") for SPICE datasets

    DeploymentValidationResult:
      type: object
      description: One check a deployment ran before writing.
      required: [validator, passed, severity]
      properties:
        validator:
          type: string
        passed:
          type: boolean
        message:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        details:
          type: object
          additionalProperties: true

    ResolvedRecipient:
      type: object
      required: [userName, email]
      properties:
        userName:
          type: string
        email:
          type: string

    # Error responses
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

  requestBodies:
    Tags:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tags]
            properties:
              tags:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    FieldTags:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tags]
            properties:
              tags:
                type: array
                items:
                  type: string
    AssetRefs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assets]
            properties:
              assets:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/AssetRef'
    Deployment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assetType, assetId, deploymentConfig]
            properties:
              assetType:
                type: string
                enum: [dashboard, analysis, dataset, datasource, folder, user, group]
                description: Any asset type; folders, users and groups are reported as not restorable.
              assetId:
                type: string
              deploymentConfig:
                type: object
                description: deploymentType (restore), source (archive), target and options; see the Deploy page for the shape it sends.
                additionalProperties: true

  responses:
    Acknowledged:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success:
                type: boolean
              data:
                type: object
                additionalProperties: true
    BulkJobQueued:
      description: Queued; follow the job under /api/jobs/{jobId}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkJobAccepted'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'