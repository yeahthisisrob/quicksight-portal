openapi: 3.0.3
info:
  title: QuickSight Assets Portal API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: API for managing and viewing QuickSight assets
  version: 1.0.0
  
servers:
  - url: /
    description: This portal (the API is served from the same origin as the page)

# Global security - applies to all endpoints unless overridden
security:
  - BearerAuth: []

paths:
  # Asset listing endpoints

  /api/assets/archived:
    get:
      operationId: getAssetsArchived
      tags: [Assets]
      summary: List archived assets
      description: Returns all archived assets across all asset types with archive metadata, with server-side pagination and filtering
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of items per page
        - name: search
          in: query
          schema:
            type: string
          description: Search term to filter assets by name, ID, or archive reason
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, type, createdTime, lastUpdatedTime, lastExportTime, archivedDate, archiveReason, archivedBy, lastActivity]
            default: archivedDate
          description: Field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: dateRange
          in: query
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
          description: Filter by archive date range
      responses:
        '200':
          description: Paginated list of archived assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [items, totalCount]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ArchivedAssetItem'
                      nextToken:
                        type: string
                        nullable: true
                      totalCount:
                        type: integer

  /api/folders/{folderId}:
    get:
      operationId: getFoldersByFolderId
      tags: [Folders]
      summary: Get folder details
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder details
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FolderDetails'

  /api/folders/{folderId}/members:
    get:
      operationId: getFoldersByFolderIdMembers
      tags: [Folders]
      summary: Get folder members
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder members
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FolderMember'
    post:
      operationId: postFoldersByFolderIdMembers
      tags: [Folders]
      summary: Add member to folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - memberType
              properties:
                memberId:
                  type: string
                memberType:
                  type: string
                  enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE, USER, GROUP]
                role:
                  type: string
                  enum: [ADMIN, AUTHOR, VIEWER]
                  description: Required for USER and GROUP member types
      responses:
        '200':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  
  /api/folders/{folderId}/members/{memberId}:
    delete:
      operationId: deleteFoldersByFolderIdMembersByMemberId
      tags: [Folders]
      summary: Remove member from folder
      description: Removes an asset (dashboard, analysis, dataset, datasource) from a folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE]
          description: The type of asset to remove from the folder
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Bad request - missing required parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/{assetType}/paginated:
    get:
      operationId: getAssetsByAssetTypePaginated
      tags: [Assets]
      summary: Get paginated assets by type
      description: Returns paginated list of assets for a specific type
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboards, datasets, analyses, datasources, folders, users, groups]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc, ASC, DESC]
        - name: filters
          in: query
          schema:
            type: string
            description: JSON stringified filters object
        - name: dateField
          in: query
          schema:
            type: string
            enum: [lastUpdatedTime, createdTime, lastActivity]
            default: lastUpdatedTime
          description: Which date field to filter on
        - name: dateRange
          in: query
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
          description: Date range filter value
        - name: includeTags
          in: query
          schema:
            type: string
          description: JSON-encoded array of {key, value} tag filters to include, e.g. [{"key":"env","value":"prod"}]
        - name: excludeTags
          in: query
          schema:
            type: string
          description: JSON-encoded array of {key, value} tag filters to exclude, e.g. [{"key":"env","value":"prod"}]
        - name: errorFilter
          in: query
          description: Only assets with (or without) definition errors.
          schema:
            type: string
            enum: [all, with_errors, without_errors]
        - name: activityFilter
          in: query
          description: Only assets with (or without) recorded activity.
          schema:
            type: string
            enum: [all, with_activity, without_activity]
        - name: roleFilter
          in: query
          description: Users - an array of roles to include. JSON-encoded.
          schema:
            type: string
        - name: permissionsFilter
          in: query
          description: Only assets with (or without) permissions.
          schema:
            type: string
            enum: [all, with_permissions, without_permissions]
        - name: groupMembershipFilter
          in: query
          description: Users - only those in (or not in) any group.
          schema:
            type: string
            enum: [all, in_groups, not_in_groups]
        - name: groupFilter
          in: query
          description: Users - an array of group names; users in any of them. JSON-encoded.
          schema:
            type: string
        - name: accessUsers
          in: query
          description: An array of user names; only assets any of them can open (directly, by group or by folder). JSON-encoded.
          schema:
            type: string
        - name: includeFolders
          in: query
          description: An array of `{id, name}` folders; assets in any of them. JSON-encoded.
          schema:
            type: string
        - name: excludeFolders
          in: query
          description: An array of `{id, name}` folders; assets in none of them. JSON-encoded.
          schema:
            type: string
        - name: sourceTypeFilter
          in: query
          description: Datasets and data sources - an array of source types (S3, ATHENA, ...). JSON-encoded.
          schema:
            type: string
        - name: smusFilter
          in: query
          description: Datasets - only those linked (or not) to a SMUS listing.
          schema:
            type: string
            enum: [all, smus_linked, not_smus_linked]
        - name: importModeFilter
          in: query
          description: Datasets - only SPICE or only direct query.
          schema:
            type: string
            enum: [all, SPICE, DIRECT_QUERY]
      responses:
        '200':
          description: Paginated asset list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetResponse'

  /api/assets/{assetType}/export:
    get:
      operationId: getAssetsByAssetTypeExport
      tags: [Assets]
      summary: Export assets to CSV (queues a job)
      description: Queues a background job to generate a CSV export of all assets of the specified type. Returns a job ID for polling progress.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboards, datasets, analyses, datasources, folders, users, groups]
        - name: search
          in: query
          schema:
            type: string
          description: Optional search term to filter assets
        - name: sortBy
          in: query
          schema:
            type: string
          description: Optional field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Optional sort order
        - name: filters
          in: query
          schema:
            type: string
            description: JSON stringified filters object
      responses:
        '202':
          description: CSV export job queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  jobId:
                    type: string
                    example: "csv-export-1234567890-abcd1234"
                  status:
                    type: string
                    example: "queued"
                  message:
                    type: string
                    example: "CSV export job for dashboards queued"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users/{userName}:
    delete:
      operationId: deleteUsersByUserName
      tags: [Users]
      summary: Delete a QuickSight user
      description: Deletes a user from QuickSight. Only READER and READER_PRO users can be deleted.
      parameters:
        - name: userName
          in: path
          required: true
          schema:
            type: string
          description: The name of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: User role not allowed for deletion
        '404':
          description: User not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Lineage endpoints
  /api/assets/{assetType}/{assetId}/cached:
    get:
      operationId: getAssetsByAssetTypeByAssetIdCached
      tags: [Assets]
      summary: Get cached asset data from S3
      description: Retrieves the full exported asset data from S3 storage
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder, user, group]
            description: Asset type (singular form)
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cached asset data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: Full asset data from S3
        '404':
          description: Asset not found

  # Tag management endpoints
          
  /api/export/summary:
    get:
      operationId: getExportSummary
      tags: [Export]
      summary: Get export summary statistics
      description: Returns overall export statistics without detailed progress
      responses:
        '200':
          description: Export summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/export:
    post:
      operationId: postExport
      tags: [Export]
      summary: Start a new export job
      description: Queues an export job and returns immediately with job ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobRequest'
      responses:
        '202':
          description: Export job queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Another export job is already running (only one export may run at a time)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  data:
                    type: object
                    properties:
                      activeJobId:
                        type: string
                        description: ID of the export job currently running
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Export file access (for JSON viewer)
  /api/ingestions:
    get:
      operationId: getIngestions
      tags: [Ingestions]
      summary: Get cached ingestions
      description: Returns cached ingestion data for all SPICE datasets
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Search term to filter ingestions
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [createdTime, status, datasetName, ingestionTimeInSeconds, rowsIngested]
            default: createdTime
            description: Field to sort by
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
            description: Sort order
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            description: Page number
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
            description: Number of items per page
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
            description: Date range filter
        - name: dateField
          in: query
          required: false
          schema:
            type: string
            default: createdTime
            description: Date field to filter on
        - name: sourceTypeFilter
          in: query
          required: false
          schema:
            type: string
          description: JSON-encoded array of data source types to keep, e.g. ["ATHENA","S3"].
      responses:
        '200':
          description: List of ingestions with metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ingestions/{datasetId}/{ingestionId}:
    get:
      operationId: getIngestionsByDatasetIdByIngestionId
      tags: [Ingestions]
      summary: Get ingestion details
      description: Returns detailed information about a specific ingestion
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            description: Dataset ID
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
            description: Ingestion ID
      responses:
        '200':
          description: Ingestion details
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Ingestion'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      operationId: deleteIngestionsByDatasetIdByIngestionId
      tags: [Ingestions]
      summary: Cancel an ingestion
      description: Cancels a running ingestion
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            description: Dataset ID
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
            description: Ingestion ID
      responses:
        '200':
          description: Ingestion cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Activity endpoints
  /api/activity/refresh:
    post:
      operationId: postActivityRefresh
      tags: [Activity]
      summary: Refresh activity data for specified asset types
      description: Fetches latest activity data from CloudTrail for dashboards, analyses, and users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetTypes]
              properties:
                assetTypes:
                  type: array
                  items:
                    type: string
                    enum: [dashboard, analysis, user, all]
                  description: Asset types to refresh activity for
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 90
                  description: Number of days of activity to fetch
      responses:
        '202':
          description: The refresh was queued as a job; follow it under /api/jobs/{jobId}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobQueuedEnvelope'
        '200':
          description: A refresh was already queued or running; its job is returned instead of a second one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobQueuedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/{assetType}/{assetId}:
    get:
      operationId: getActivityByAssetTypeByAssetId
      tags: [Activity]
      summary: Get activity data for a specific asset
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, user]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity data for the asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/ActivityData'
                      - $ref: '#/components/schemas/UserActivity'
                      - $ref: '#/components/schemas/DatasetActivityData'
        '404':
          description: Asset not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/activity/timeline:
    get:
      operationId: getActivityTimeline
      tags: [Activity]
      summary: Get a page of activity timeline events (global feed)
      description: >
        Returns a chronological feed of QuickSight mutation events (Create /
        Update / Delete / Publish / permission / membership / tagging / job
        events across all asset types and account settings). Cursor-based:
        pass the `nextCursor` returned in a previous response to fetch the
        next page. Reads (Get / Describe / List / Search) are NOT returned —
        the timeline only records events that touch assets or settings.
      parameters:
        - name: cursor
          in: query
          description: ISO timestamp. Returns events strictly older than this.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Page size. Default 50, max 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: resourceTypes
          in: query
          description: >
            Comma-separated list of resource types to include. Catalog types
            (dashboard, analysis, dataset, datasource, folder, group, user)
            show hydrated asset names; `other` covers templates, themes,
            brands, topics, account settings, etc.
          schema:
            type: string
        - name: users
          in: query
          description: Comma-separated list of user names to include.
          schema:
            type: string
        - name: eventNames
          in: query
          description: Comma-separated list of CloudTrail event names to include.
          schema:
            type: string
        - name: excludeEventNames
          in: query
          description: Comma-separated list of CloudTrail event names to exclude. Used by default to hide noisy ingestion events.
          schema:
            type: string
        - name: actions
          in: query
          description: Comma-separated list of action categories to include.
          schema:
            type: string
        - name: origins
          in: query
          description: Comma-separated origins to include (portal-ui, portal-api, portal, console, automation, unknown).
          schema:
            type: string
        - name: startDate
          in: query
          description: ISO timestamp. Returns events at or after this time.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: ISO timestamp. Returns events at or before this time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of timeline events.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/timeline/{assetType}/{assetId}:
    get:
      operationId: getActivityTimelineByAssetTypeByAssetId
      tags: [Activity]
      summary: Get a page of activity timeline events for one catalog asset
      description: >
        Same as /api/activity/timeline but pre-filtered to a specific catalog
        asset. All other query params (cursor, limit, users, eventNames,
        actions, date range) still apply and further narrow the results.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder, group, user]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: users
          in: query
          schema:
            type: string
        - name: eventNames
          in: query
          schema:
            type: string
        - name: excludeEventNames
          in: query
          description: Comma-separated list of CloudTrail event names to exclude.
          schema:
            type: string
        - name: actions
          in: query
          schema:
            type: string
        - name: origins
          in: query
          description: Comma-separated origins to include (portal-ui, portal-api, portal, console, automation, unknown).
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of timeline events for the specified asset.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TimelinePage'
        '400':
          description: Invalid assetType or assetId.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assistant/models:
    get:
      operationId: getAssistantModels
      summary: The models that can be picked for authoring and for the assistant, with rough costs
      description: |
        Five: Claude Haiku 4.5 (the assistant's default), Claude Sonnet 4.6
        (the authoring default), Claude Sonnet 5, Claude Opus 5, and OpenAI
        when the stack has an endpoint and a key for it. Each carries list
        prices per million tokens and a rough cost for a typical authoring
        ask and a typical chat message. Send a model's `key` as `model` on
        the planner calls and on `/api/assistant/chat`.
      tags: [Assistant]
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AiModelCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assistant/chat:
    post:
      operationId: postAssistantChat
      summary: One message to the assistant, which reads and previews through this API (a job)
      description: |
        The assistant answers using this portal's API as the person who
        asked: it runs reads and previews itself, shows previews as
        wireframes and calculated fields as lineage (by reference, see
        `artifacts`), and prepares writes as `actions` for the person to
        run. It never writes. It runs the planner's propose calls itself
        (with `authoringModel`) and waits for them. While it works, the
        job's `message` says what it is doing. Returns 202 with a `jobId`; the job's result
        is an `AssistantChatResult`. The client keeps the conversation and
        sends it whole, text only.
      tags: [Assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
      responses:
        '202':
          description: The assistant job was queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/api-docs/openapi:
    get:
      operationId: getApiDocsOpenapi
      summary: This API's contract, as OpenAPI JSON
      description: |
        The same document every endpoint is validated against, with
        `servers` set to the portal that served it. A caller with only a
        key and the portal's URL starts here: every path in it is callable
        with the key. Also on the Author page's API tab, searchable.
      tags: [API docs]
      responses:
        '200':
          description: The OpenAPI 3 document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/api-docs/guide:
    get:
      operationId: getApiDocsGuide
      summary: The API guide, as markdown
      description: |
        Which calls to make in which order to read what the portal knows,
        build a change, and publish it back. Written for a person or an
        agent with a key and nothing else.
      tags: [API docs]
      responses:
        '200':
          description: Markdown
          content:
            text/markdown:
              schema:
                type: string
  /api/search:
    get:
      operationId: getSearch
      tags: [Search]
      summary: Find anything the portal knows, in plain words
      description: |
        One ranked search over everything in the caches: dashboards,
        analyses, datasets, data sources, folders, SMUS listings, calculated
        fields (matched on name and on the expression, where the business
        rules live; one hit per distinct expression listing every asset that
        defines it), visuals (title, chart type, sheet and the fields in their
        wells) and the template library. Lexical, weighted by field (name over
        column over description), scaled by how many words matched, boosted by
        use. No model call; the index is built from the caches once per
        container and reused until an export changes them.

        Each hit carries `why` (which field matched which word), a one-line
        `summary` written for a person or an agent, and a portal `path`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
          description: Plain words, e.g. "gold orders dataset with revenue by region".
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated subset of dashboard, analysis, dataset, datasource, folder, project, smus-listing, smus-column, calculated-field, visual, template.
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Keep to one SMUS project (its listings and columns, and the datasets linked to them).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Ranked hits
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/context/search:
    get:
      tags: [Context]
      summary: Search the context graph for entities
      operationId: searchContext
      description: |
        The portal's knowledge as a graph, shaped like AWS Context's agentic
        search: search for entities, get one, follow its relationships. The
        entities are SMUS projects, listings and their columns (type,
        description, glossary terms), glossary terms, data sources, datasets,
        calculated fields, analyses, dashboards, visuals, templates and
        folders. Ranked lexically by the same index as /api/search; each hit
        carries the `entityId` to get or follow.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated entity types (ContextEntityType).
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Ranked entities
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContextSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/context/entities/{entityId}:
    get:
      tags: [Context]
      summary: One entity, its facts, and every kind of relationship it has
      operationId: getContextEntity
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          description: '`type:key`, e.g. dataset:abc123 or listing-column:lst-1/customer_id (URL-encoded).'
      responses:
        '200':
          description: The entity and its relationships, counted, with a few examples of each
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContextEntityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/context/entities/{entityId}/related:
    get:
      tags: [Context]
      summary: Follow an entity's relationships, up to three hops
      operationId: getContextRelated
      description: |
        Relations read subject to object: listing in-project project; listing
        has-column listing-column; listing tagged glossary-term; dataset
        reads-listing listing; dataset through-datasource datasource; dataset
        exposes listing-column; analysis or dashboard uses-dataset dataset;
        calculated-field defined-in asset; calculated-field reads-column
        listing-column; visual in-asset asset; asset in-folder folder.
        `direction=in` follows them backwards (the datasets that read a
        listing).
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
        - name: relations
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated ContextRelation values; all when omitted.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [out, in, both]
            default: both
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated entity types to keep.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Related entities, nearest first, each with the path that reached it
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ContextRelatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/smus/data-source:
    get:
      operationId: getSmusDataSource
      summary: The Athena data source a new dataset over a SMUS listing reads through
      description: |
        SMUS tables are Glue tables read by Athena. The data source chosen is
        the Athena one most SMUS-linked datasets already read through; with
        none of those, the one most datasets use; with none, the only Athena
        source. `athena` lists every Athena source with how many governed
        datasets read through it.
      tags: [SMUS]
      responses:
        '200':
          description: The choice
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusDataSourceChoice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/status:
    get:
      operationId: getSmusStatus
      tags: [SMUS]
      summary: SMUS (SageMaker Unified Studio) integration status
      description: >
        Reports whether a SMUS domain is configured for this portal and what
        the last SMUS export captured. When not configured, all SMUS UI (link
        indicators, actions, filters) is hidden. Everything SMUS-related the
        portal shows comes from that export, never from a live DataZone call.
      responses:
        '200':
          description: SMUS integration status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/export:
    post:
      operationId: postSmusExport
      tags: [SMUS]
      summary: Start a SMUS export
      description: |
        Queues a job that sweeps the configured DataZone domain once (projects,
        published listings with their forms and columns, the portal role's
        standing in the domain) and stores the result as the SMUS snapshot in
        the cache bucket. Settings, Author and the catalog read that snapshot.
        Single-flight: if an export is already queued or running, its job id is
        returned instead of a new one.
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusExportQueued'
        '200':
          description: An export is already in flight; its job is returned
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusExportQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/dataset-links:
    post:
      operationId: postSmusDatasetLinks
      tags: [SMUS]
      summary: Resolve SMUS catalog links for QuickSight datasets
      description: >
        Matches cached QuickSight dataset metadata (name and source table
        names from lineage) against the live SMUS domain catalog and returns
        per-dataset link resolutions. Catalog data is fetched live (short
        in-memory TTL) — it is never persisted to the portal cache.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datasetIds:
                  type: array
                  items:
                    type: string
                  description: Dataset ids to resolve (all cached datasets when omitted)
      responses:
        '200':
          description: Per-dataset SMUS link resolutions
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [links]
                    properties:
                      links:
                        type: array
                        items:
                          $ref: '#/components/schemas/SmusDatasetLink'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/scripts/demo-cleanup/preview:
    get:
      operationId: getScriptsDemoCleanupPreview
      tags: [Scripts]
      summary: Preview demo assets that would be deleted
      description: Returns a list of all QuickSight demo assets that would be deleted without actually deleting them
      responses:
        '200':
          description: List of demo assets to be deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [datasources, datasets, analyses, totalCount]
                    properties:
                      datasources:
                        type: array
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            bucket:
                              type: string
                      datasets:
                        type: array
                        items:
                          type: object
                          required: [id, name, datasourceIds]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            datasourceIds:
                              type: array
                              items:
                                type: string
                      analyses:
                        type: array
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                      totalCount:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/scripts/demo-cleanup/execute:
    post:
      operationId: postScriptsDemoCleanupExecute
      tags: [Scripts]
      summary: Delete all QuickSight demo assets
      description: Deletes all demo datasources, datasets, and analyses, then archives them
      responses:
        '200':
          description: Demo cleanup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: object
                        properties:
                          datasources:
                            type: integer
                          datasets:
                            type: integer
                          analyses:
                            type: integer
                          total:
                            type: integer
                      archived:
                        type: object
                        properties:
                          datasources:
                            type: integer
                          datasets:
                            type: integer
                          analyses:
                            type: integer
                          total:
                            type: integer
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            assetType:
                              type: string
                            assetId:
                              type: string
                            error:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/summary:
    get:
      operationId: getActivitySummary
      tags: [Activity]
      summary: Get activity summary across all asset types
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Activity summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      dashboards:
                        type: object
                        properties:
                          totalViews:
                            type: integer
                          uniqueViewers:
                            type: integer
                          activeAssets:
                            type: integer
                      analyses:
                        type: object
                        properties:
                          totalViews:
                            type: integer
                          uniqueViewers:
                            type: integer
                          activeAssets:
                            type: integer
                      users:
                        type: object
                        properties:
                          activeUsers:
                            type: integer
                          totalActivities:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Data Catalog endpoints
  /api/data-catalog/full:
    get:
      operationId: getDataCatalogFull
      tags: [Data Catalog]
      summary: Get full data catalog
      description: Returns complete field catalog with pagination, filtering, and summary statistics
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: viewMode
          in: query
          schema:
            type: string
            enum: [all, fields, calculated]
            default: all
        - name: tagKey
          in: query
          schema:
            type: string
          description: Single tag key filter (deprecated, use includeTags/excludeTags)
        - name: tagValue
          in: query
          schema:
            type: string
          description: Single tag value filter (deprecated, use includeTags/excludeTags)
        - name: includeTags
          in: query
          schema:
            type: string
          description: JSON array of tags to include, e.g. [{"key":"env","value":"prod"}]. Assets must have at least one of these tags.
        - name: excludeTags
          in: query
          schema:
            type: string
          description: JSON array of tags to exclude, e.g. [{"key":"env","value":"dev"}]. Assets must not have any of these tags.
        - name: assetIds
          in: query
          schema:
            type: string
          description: JSON array of asset IDs to filter by, e.g. ["dash-123","ds-456"]. Only fields from these assets are returned.
        - name: includeAnalyses
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Catalog source scope. By default the catalog reflects the business-facing
            layer (datasets + dashboards). Set true to also include analyses (the
            authoring layer); datasets are always included.
      responses:
        '200':
          description: Data catalog with fields and summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DataCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/tags:
    get:
      operationId: getDataCatalogTags
      tags: [Data Catalog]
      summary: Get available tags
      description: Returns all available tags across assets with usage counts
      responses:
        '200':
          description: Available tags with counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/assets:
    get:
      operationId: getDataCatalogAssets
      tags: [Data Catalog]
      summary: Get available assets for filtering
      description: Returns all assets (dashboards, analyses, datasets) that have fields in the catalog
      responses:
        '200':
          description: Available assets with field counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/stats:
    get:
      operationId: getDataCatalogStats
      tags: [Data Catalog]
      summary: Get catalog statistics
      description: Returns high-level statistics about the data catalog
      responses:
        '200':
          description: Catalog statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CatalogStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/visual-fields:
    get:
      operationId: getDataCatalogVisualFields
      tags: [Data Catalog]
      summary: Get visual field mappings
      description: Returns field usage in visuals across dashboards and analyses
      responses:
        '200':
          description: Visual field mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/VisualFieldCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Permission sources endpoint
  /api/assets/{assetType}/{assetId}/permission-sources:
    get:
      operationId: getAssetsByAssetTypeByAssetIdPermissionSources
      tags: [Assets]
      summary: Get permission sources for an asset
      description: Returns how each user has access to an asset - direct, via group, or via shared folder
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder]
          description: The type of asset
        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: The asset identifier
      responses:
        '200':
          description: Permission sources for the asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [permissions, userAccessSources, groupAccessSources]
                    properties:
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
                      userAccessSources:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserAccessInfo'
                      groupAccessSources:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupAccessInfo'
        '404':
          description: Asset not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/dataset/{assetId}/source:
    get:
      operationId: getAssetsDatasetByAssetIdSource
      tags: [Assets]
      summary: Where a dataset reads its data from
      description: |
        Returns the dataset's physical tables, read live from QuickSight (not
        the portal cache, which can be stale), together with the data sources
        a table may be pointed at.

        Uploaded (flat file) datasets have no queryable specification and
        return 400.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The dataset's current sources
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DatasetSource'
                      - type: object
                        required: [dataSources]
                        properties:
                          dataSources:
                            type: array
                            description: |
                              Every data source in the account. A table's data
                              source is always chosen from this list - ARNs are
                              never entered by hand - and the server re-checks
                              membership on update.
                            items:
                              $ref: '#/components/schemas/DataSourceOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putAssetsDatasetByAssetIdSource
      tags: [Assets]
      summary: Repoint a dataset's physical tables and/or rename it
      description: |
        Applies the given edits and writes the whole specification back to
        QuickSight, which has no partial-update API.

        Column definitions are always preserved: logical tables, calculated
        fields and downstream dashboards reference those names, so this
        endpoint changes only where the data comes from. If the new table or
        query does not produce those columns, QuickSight rejects the update
        and its message is returned verbatim.

        A table cannot change kind - relational stays relational, custom SQL
        stays custom SQL.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Supply a name, a list of table edits, or both.
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Rename the dataset at the same time
                tables:
                  type: array
                  items:
                    $ref: '#/components/schemas/DatasetTableEdit'
      responses:
        '200':
          description: The dataset's sources after the update
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DatasetSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/datasets:
    get:
      operationId: getAuthoringByAssetTypeByAssetIdDatasets
      tags: [Authoring]
      summary: The datasets a definition declares and what it reads from each
      description: |
        Reads the analysis or dashboard definition live from QuickSight and
        lists every `DataSetIdentifierDeclarations` entry with the columns the
        definition depends on (field wells, filters, parameter defaults, sheet
        controls, formatting and calculated-field expressions). Calculated
        fields are reported separately: they live in the definition, so a
        replacement dataset does not have to provide them.

        This is the read side of a rebind. A caller (the UI, a CLI, or a
        planner) uses it to decide which identifier to repoint and at what.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      responses:
        '200':
          description: The definition's datasets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionDatasets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind/plan:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdRebindPlan
      tags: [Authoring]
      summary: Dry-run a rebind - what would change and whether it can be applied
      description: |
        Read-only. For each requested rebind, resolves every column the
        definition reads from that dataset identifier against the target
        dataset's output columns:

        - `matched`: the same name exists in the target
        - `mapped`: renamed through `columnMap` to a column the target has
        - `suggested`: not in the target, but an unambiguous near match exists
          (case, spaces and separators ignored). Offered, never applied.
        - `missing`: not in the target and nothing close

        `canApply` is true only when nothing is suggested or missing. A caller
        turns a suggestion into a rename by adding it to `columnMap` and
        planning again, so every rename is explicit and readable in the
        request.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rebinds]
              properties:
                rebinds:
                  type: array
                  items:
                    $ref: '#/components/schemas/RebindRequest'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RebindPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdRebind
      tags: [Authoring]
      summary: Apply a rebind in place, or as a clone
      description: |
        Plans again, refuses unless every column resolves, then writes the
        rewritten definition to QuickSight.

        - `update` rewrites the asset in place. A dashboard gets a new version
          which is published immediately so viewers see it.
        - `clone` creates a new asset (id generated unless `newAssetId` is
          given) carrying the rewritten definition, the source's theme and the
          source's permissions, so the copy has the same audience.

        The dataset identifier and every field id are preserved; only the
        declaration's ARN, the mapped column names and the matching
        calculated-field expressions change. QuickSight's own validation
        error is returned verbatim if the new dataset still cannot satisfy the
        definition.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRebindRequest'
      responses:
        '200':
          description: The asset that was written
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApplyRebindResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/repair/plan:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdRepairPlan
      tags: [Authoring]
      summary: Everything that stops QuickSight from writing this definition, with a fix for each
      description: |
        Assets with definition errors cannot be published or updated as code.
        This reads the definition and the datasets it declares and lists the
        problems: columns the datasets no longer have (with a rename when one
        column clearly took its place, otherwise removal of every reference),
        parameters used but never declared (declare, or remove the controls
        and filters that read them), datasets that cannot be read (choose
        another; send it as `rebinds` and call again to check its columns),
        and the errors QuickSight itself reports, attached to those findings
        or listed as-is when nothing can be computed.

        Nothing is written. `proposed` is the accepted set in request form:
        pass `repairs` and `rebinds` to the preview endpoint to see the
        result, then to the rebind endpoint with `mode: update` to fix the
        asset in place, or `mode: clone` to fix a copy.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rebinds:
                  type: array
                  description: Datasets already chosen for identifiers whose own dataset is gone.
                  items:
                    $ref: '#/components/schemas/RebindRequest'
      responses:
        '200':
          description: The repair plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RepairPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/authoring/{assetType}/{assetId}/propose:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdPropose
      tags: [Authoring]
      summary: Turn a natural-language ask into a validated rebind proposal
      description: |
        "Copy this onto the orders_gold dataset", "switch this analysis to the
        new customer table in place". A model is asked two narrow questions -
        which candidate dataset each identifier should read from, and, only if
        the server's dry run leaves columns unresolved, which target column
        each unresolved source column means. Everything else is deterministic
        and the returned `plan` is the same dry run the plan endpoint gives.

        Nothing is applied. The caller reviews the proposal and calls the
        rebind endpoint with its `rebinds`, `mode` and `name`.

        The model can think for longer than the API gateway allows, so the
        ask runs as a job: this returns `jobId` at once. Poll
        `GET /api/jobs/{jobId}` until `status` is `completed` (or `failed`,
        with the reason in `message`), then `GET /api/jobs/{jobId}/result`
        is the `Proposal`.

        The model is chosen by deployment configuration (Bedrock by default;
        a local Claude or Codex CLI, or any OpenAI-compatible endpoint, in
        development) and is reported in the proposal's `model`.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRequest'
      responses:
        '202':
          description: The planner job was queued; its result is the Proposal
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind/preview:
    post:
      operationId: postAuthoringByAssetTypeByAssetIdRebindPreview
      tags: [Authoring]
      summary: Dry-run a rebind and edits, and return the rewritten definition
      description: |
        The plan endpoint plus the definition as it would be written: the
        same rewrite apply performs (rebinds, added calculated fields, edit
        ops), returned instead of sent to QuickSight, with every change in
        plain language and a sheet outline for editing. Meant for mockups.
        Renames that are only suggested are not applied, so the preview
        mirrors what apply would refuse or accept.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rebinds]
              properties:
                rebinds:
                  type: array
                  items:
                    $ref: '#/components/schemas/RebindRequest'
                addCalculatedFields:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddedCalculatedField'
                ops:
                  type: array
                  items:
                    $ref: '#/components/schemas/DefinitionOp'
                repairs:
                  type: array
                  description: Applied first, before the rebind plan, so the plan sees the repaired definition.
                  items:
                    $ref: '#/components/schemas/RepairOp'
                template:
                  $ref: '#/components/schemas/TemplateRequest'
                typeRules:
                  $ref: '#/components/schemas/TypeRules'
      responses:
        '200':
          description: The plan and the rewritten definition
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RebindPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Portal settings with their effective values and where each comes from
      description: |
        Settings live in DynamoDB and fall back to the Lambda's environment,
        then to a default, so a fresh deployment keeps working from env vars
        alone and a migration can move values one at a time. Every setting
        reports its `source`. Secrets are never stored here: a sensitive
        setting is read-only and shows only whether its env var is set.
      responses:
        '200':
          description: Grouped settings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SettingsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putSettings
      tags: [Settings]
      summary: Store settings
      description: |
        Writes the given values to DynamoDB. A null value clears the stored
        value, so the setting falls back to its env var or default again.
        Unknown keys and sensitive keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: The settings after the update
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SettingsSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/smus/projects:
    get:
      operationId: getSettingsSmusProjects
      tags: [Settings]
      summary: Projects in the configured SMUS domain
      description: |
        The projects to choose from: a live, bounded ListProjects unioned with
        the projects the last SMUS export saw (the export is scoped to the
        chosen projects, so the choice cannot come from the export alone).
        Returns an empty list with `configured: false` when no domain is set;
        `exportedAt` is null when no export has run yet.
      responses:
        '200':
          description: The domain's projects
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [configured, projects, exportedAt]
                    properties:
                      configured:
                        type: boolean
                      exportedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the snapshot these projects come from was taken; null when no export has run.
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/SmusProject'
                      diagnostics:
                        $ref: '#/components/schemas/SmusProjectDiagnostics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/quicksight/folders:
    get:
      tags: [Settings]
      operationId: listSettingsFolders
      summary: Folders authored assets can be filed in
      description: |
        The account's folders from the export cache, for the "Put authored
        assets in these folders" setting, with how many people or groups
        each is shared with.
      responses:
        '200':
          description: The folders
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [folders]
                    properties:
                      folders:
                        type: array
                        items:
                          type: object
                          required: [id, name, sharedWith]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            sharedWith:
                              type: integer
                              description: Principals the folder is shared with.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/api-keys:
    get:
      operationId: getSettingsApiKeys
      tags: [Settings]
      summary: API keys for machine callers
      description: |
        Long-lived credentials for a CLI, a script or an agent. A key is sent
        as `Authorization: Bearer qsp_...` and grants the same access as a
        signed-in user to every endpoint except key management itself, which
        needs a person. Only the label, a display prefix and usage dates are
        stored and listed; the secret is shown once, at creation.
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [keys]
                    properties:
                      keys:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: postSettingsApiKeys
      tags: [Settings]
      summary: Create an API key
      description: The secret is in this response only and cannot be recovered later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: What the key is for, e.g. "claude cli" or "nightly export".
      responses:
        '201':
          description: The key and its one-time secret
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/api-keys/{id}:
    delete:
      operationId: deleteSettingsApiKeysById
      tags: [Settings]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/assets:
    get:
      operationId: getSmusAssets
      tags: [SMUS]
      summary: Published SMUS assets and the QuickSight datasets that already read them
      description: |
        Every published listing in the selected projects (all projects when
        none are selected in settings), with its table identity and columns
        from the listing's metadata forms, and the QuickSight datasets the
        portal has matched to it. The point is reuse: before creating a
        dataset for a SMUS asset, see the ones that already exist.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on the listing name or description
      responses:
        '200':
          description: Published assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [configured, projectFilter, assets, exportedAt]
                    properties:
                      configured:
                        type: boolean
                      exportedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the snapshot was taken; null when no SMUS export has run.
                      projectFilter:
                        type: array
                        description: The project ids the sweep was limited to; empty means all.
                        items:
                          type: string
                      assets:
                        type: array
                        items:
                          $ref: '#/components/schemas/SmusAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/assets/{listingId}/dataset:
    post:
      operationId: postSmusAssetsByListingIdDataset
      tags: [SMUS]
      summary: Create a QuickSight dataset that reads a published SMUS asset
      description: |
        Creates a relational-table dataset over the listing's Glue table
        (catalog, database, table and columns come from the listing's
        metadata forms) through an existing data source chosen from the
        account, never typed. Permissions are copied from a reference dataset
        so the new one has an audience; without that, a created dataset is
        visible to nobody.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmusDatasetRequest'
      responses:
        '200':
          description: The created dataset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [dataSetId, name, arn, dataSource]
                    properties:
                      dataSetId:
                        type: string
                      name:
                        type: string
                      arn:
                        type: string
                      dataSource:
                        type: object
                        description: The data source the dataset reads through.
                        required: [id, name]
                        properties:
                          id:
                            type: string
                          name:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/smus:
    get:
      operationId: getDataCatalogSmus
      tags: [Data Catalog]
      summary: The catalog, SMUS first
      description: |
        Every published asset in the selected SMUS projects, carrying what
        SMUS owns (glossary terms, metadata forms, descriptions, the Glue
        table and its columns) and what only QuickSight knows: the datasets
        reading the asset, their calculated fields, and which dashboards and
        analyses use each field. Nothing outside the selected projects is
        listed; that scope is the same one Author uses.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on listing name, description, table or a column name
        - name: term
          in: query
          required: false
          schema:
            type: string
          description: Only assets carrying this glossary term
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Only assets owned by this project (within the selected projects)
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [projects, full]
          description: >
            `projects` returns only the project list with counts, straight from
            the SMUS snapshot, without building the QuickSight field index.
            The page asks for this first; the per-project listing follows.
      responses:
        '200':
          description: The catalog listing
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/smus/{listingId}:
    get:
      operationId: getDataCatalogSmusByListingId
      tags: [Data Catalog]
      summary: One published asset with everything the portal knows about it
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusCatalogAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/data-catalog/calculated-fields:
    get:
      operationId: getDataCatalogCalculatedFields
      tags: [Data Catalog]
      summary: Every calculated field in the account, grouped by what it computes
      description: |
        The catalog field-first. One row per distinct (name, expression):
        where it is defined (datasets, dashboards, analyses), the datasets it
        lives on with their SMUS listing, what it reads, how many dashboards,
        analyses and visuals use it, whether other expressions carry the same
        name (a conflict), whether a template matches it, and whether it has a
        portal note. Counts across the top. This is what the portal knows and
        SMUS does not.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Only fields on datasets whose SMUS listing belongs to this project.
        - name: datasetId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on the name or the expression.
        - name: conflictsOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [smus, outside, all]
          description: |
            Which datasets to read. `smus` (the default) is the selected SMUS
            projects; `outside` is the datasets that matched no listing, so they
            are reachable rather than silently dropped; `all` ignores the
            distinction. Naming a projectId implies `smus`.
      responses:
        '200':
          description: The calculated field catalog
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/calculated-fields/{key}:
    get:
      operationId: getDataCatalogCalculatedFieldsByKey
      tags: [Data Catalog]
      summary: One calculated field, with its lineage both ways and its variants
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The calculated field
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/data-catalog/columns:
    get:
      operationId: getDataCatalogColumns
      tags: [Data Catalog]
      summary: Plain columns across datasets, tied back to their SMUS listing column
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: datasetId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [smus, outside, all]
          description: |
            Which datasets to read. `smus` (the default) is the selected SMUS
            projects; `outside` is the datasets that matched no listing, so they
            are reachable rather than silently dropped; `all` ignores the
            distinction. Naming a projectId implies `smus`.
      responses:
        '200':
          description: The column catalog
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ColumnCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/templates/filter-bars:
    get:
      tags: [Data Catalog]
      operationId: listFilterBarTemplates
      summary: The filter bar templates
      description: |
        The organisation's standard filter bars: which filters a sheet's
        control bar carries, in what order and how wide. The default one is
        applied to every analysis built from nothing (POST /api/authoring/new)
        unless the request names another or 'none'.
      responses:
        '200':
          description: The templates, the default first
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [templates]
