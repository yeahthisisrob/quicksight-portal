openapi: 3.0.3
info:
  title: QuickSight Assets Portal API
  description: API for managing and viewing QuickSight assets
  version: 1.0.0
  
servers:
  - url: https://api.quicksight-portal.example.com
    description: Production API
  - url: http://localhost:3000
    description: Local development

# Global security - applies to all endpoints unless overridden
security:
  - BearerAuth: []

paths:
  # Asset listing endpoints
  /api/assets:
    get:
      summary: List all assets
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetListItem'

  /api/assets/archived:
    get:
      summary: List archived assets
      description: Returns all archived assets across all asset types with archive metadata, with server-side pagination and filtering
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of items per page
        - name: search
          in: query
          schema:
            type: string
          description: Search term to filter assets by name, ID, or archive reason
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, type, createdTime, lastUpdatedTime, lastExportTime, archivedDate, archiveReason, archivedBy, lastActivity]
            default: archivedDate
          description: Field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: dateRange
          in: query
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
          description: Filter by archive date range
      responses:
        '200':
          description: Paginated list of archived assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [items, totalCount]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ArchivedAssetItem'
                      nextToken:
                        type: string
                        nullable: true
                      totalCount:
                        type: integer

  /api/folders:
    get:
      summary: List folders
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderListItem'

  /api/folders/{folderId}:
    get:
      summary: Get folder details
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDetails'

  /api/folders/{folderId}/members:
    get:
      summary: Get folder members
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Folder members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderMember'
    post:
      summary: Add member to folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - memberType
              properties:
                memberId:
                  type: string
                memberType:
                  type: string
                  enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE, USER, GROUP]
                role:
                  type: string
                  enum: [ADMIN, AUTHOR, VIEWER]
                  description: Required for USER and GROUP member types
      responses:
        '200':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  
  /api/folders/{folderId}/members/{memberId}:
    delete:
      summary: Remove member from folder
      description: Removes an asset (dashboard, analysis, dataset, datasource) from a folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE]
          description: The type of asset to remove from the folder
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Bad request - missing required parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dashboards:
    get:
      summary: List dashboards
      responses:
        '200':
          description: List of dashboards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardListItem'

  /api/datasets:
    get:
      summary: List datasets
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetListItem'

  /api/assets/{assetType}/paginated:
    get:
      summary: Get paginated assets by type
      description: Returns paginated list of assets for a specific type
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboards, datasets, analyses, datasources, folders, users, groups]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc, ASC, DESC]
        - name: filters
          in: query
          schema:
            type: string
            description: JSON stringified filters object
        - name: dateField
          in: query
          schema:
            type: string
            enum: [lastUpdatedTime, createdTime, lastActivity]
            default: lastUpdatedTime
          description: Which date field to filter on
        - name: dateRange
          in: query
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
          description: Date range filter value
        - name: includeTags
          in: query
          schema:
            type: string
          description: JSON-encoded array of {key, value} tag filters to include
        - name: excludeTags
          in: query
          schema:
            type: string
          description: JSON-encoded array of {key, value} tag filters to exclude
      responses:
        '200':
          description: Paginated asset list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetResponse'

  /api/assets/{assetType}/export:
    get:
      summary: Export assets to CSV (queues a job)
      description: Queues a background job to generate a CSV export of all assets of the specified type. Returns a job ID for polling progress.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboards, datasets, analyses, datasources, folders, users, groups]
        - name: search
          in: query
          schema:
            type: string
          description: Optional search term to filter assets
        - name: sortBy
          in: query
          schema:
            type: string
          description: Optional field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Optional sort order
        - name: filters
          in: query
          schema:
            type: string
            description: JSON stringified filters object
      responses:
        '202':
          description: CSV export job queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  jobId:
                    type: string
                    example: "csv-export-1234567890-abcd1234"
                  status:
                    type: string
                    example: "queued"
                  message:
                    type: string
                    example: "CSV export job for dashboards queued"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/users:
    get:
      summary: List users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserListItem'

  /api/users/{userName}:
    delete:
      summary: Delete a QuickSight user
      description: Deletes a user from QuickSight. Only READER and READER_PRO users can be deleted.
      parameters:
        - name: userName
          in: path
          required: true
          schema:
            type: string
          description: The name of the user to delete
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: User role not allowed for deletion
        '404':
          description: User not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Lineage endpoints
  /api/lineage/{assetType}/{assetId}:
    get:
      summary: Get asset lineage
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset lineage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLineage'

  # Cached asset endpoint (for JSON viewer)
  /api/assets/{assetType}/{assetId}/cached:
    get:
      summary: Get cached asset data from S3
      description: Retrieves the full exported asset data from S3 storage
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder, user, group]
            description: Asset type (singular form)
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cached asset data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: Full asset data from S3
        '404':
          description: Asset not found

  # Tag management endpoints
  /api/assets/{assetType}/{assetId}/tags:
    put:
      summary: Update asset tags
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    required: [Key, Value]
                    properties:
                      Key:
                        type: string
                      Value:
                        type: string
      responses:
        '200':
          description: Tags updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # Field catalog endpoints
  /api/fields:
    get:
      summary: Search fields
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: Field search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldInfo'

  # Export endpoints
  /api/export/jobs:
    get:
      summary: List export jobs
      description: Returns a list of recent export jobs with their status
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Maximum number of jobs to return
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['queued', 'processing', 'completed', 'failed', 'stopped']
            description: Filter by job status
      responses:
        '200':
          description: List of export jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /api/export/jobs/{jobId}:
    get:
      summary: Get export job status
      description: Returns the current status and progress of an export job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            description: Export job ID
      responses:
        '200':
          description: Export job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobStatus'
        '404':
          description: Job not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /api/export/jobs/{jobId}/logs:
    get:
      summary: Get export job logs
      description: Returns detailed logs for a completed export job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            description: Export job ID
      responses:
        '200':
          description: Export job logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobLogs'
        '404':
          description: Job not found or logs not available
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/export/jobs/{jobId}/stop:
    post:
      summary: Stop an export job
      description: Request to stop a running export job at the next checkpoint
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            description: Export job ID to stop
      responses:
        '200':
          description: Stop request sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      jobId:
                        type: string
                      status:
                        $ref: '#/components/schemas/JobStatus'
                      message:
                        type: string
        '404':
          description: Job not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/export/summary:
    get:
      summary: Get export summary statistics
      description: Returns overall export statistics without detailed progress
      responses:
        '200':
          description: Export summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/export:
    post:
      summary: Start a new export job
      description: Queues an export job and returns immediately with job ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportJobRequest'
      responses:
        '202':
          description: Export job queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Another export job is already running (only one export may run at a time)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                  data:
                    type: object
                    properties:
                      activeJobId:
                        type: string
                        description: ID of the export job currently running
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Export file access (for JSON viewer)
  /api/export/{assetType}/{assetId}:
    get:
      summary: Get full export data for asset
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AssetType'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full asset export data
          content:
            application/json:
              schema:
                type: object
                description: Raw export data (varies by asset type)

  # Ingestion endpoints
  /api/ingestions:
    get:
      summary: Get cached ingestions
      description: Returns cached ingestion data for all SPICE datasets
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            description: Search term to filter ingestions
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [createdTime, status, datasetName, ingestionTimeInSeconds, rowsIngested]
            default: createdTime
            description: Field to sort by
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
            description: Sort order
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            description: Page number
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
            description: Number of items per page
        - name: dateRange
          in: query
          required: false
          schema:
            type: string
            enum: [all, 24h, 7d, 30d, 90d]
            default: all
            description: Date range filter
        - name: dateField
          in: query
          required: false
          schema:
            type: string
            default: createdTime
            description: Date field to filter on
      responses:
        '200':
          description: List of ingestions with metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/ingestions/{datasetId}/{ingestionId}:
    get:
      summary: Get ingestion details
      description: Returns detailed information about a specific ingestion
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            description: Dataset ID
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
            description: Ingestion ID
      responses:
        '200':
          description: Ingestion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingestion'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      summary: Cancel an ingestion
      description: Cancels a running ingestion
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
            description: Dataset ID
        - name: ingestionId
          in: path
          required: true
          schema:
            type: string
            description: Ingestion ID
      responses:
        '200':
          description: Ingestion cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Activity endpoints
  /api/activity/refresh:
    post:
      summary: Refresh activity data for specified asset types
      description: Fetches latest activity data from CloudTrail for dashboards, analyses, and users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetTypes]
              properties:
                assetTypes:
                  type: array
                  items:
                    type: string
                    enum: [dashboard, analysis, user, all]
                  description: Asset types to refresh activity for
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 90
                  description: Number of days of activity to fetch
      responses:
        '200':
          description: Activity refresh initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  refreshed:
                    type: object
                    properties:
                      dashboards:
                        type: integer
                      analyses:
                        type: integer
                      users:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/{assetType}/{assetId}:
    get:
      summary: Get activity data for a specific asset
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, user]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity data for the asset
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivityData'
                  - $ref: '#/components/schemas/UserActivity'
                  - $ref: '#/components/schemas/DatasetActivityData'
        '404':
          description: Asset not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/activity/timeline:
    get:
      summary: Get a page of activity timeline events (global feed)
      description: >
        Returns a chronological feed of QuickSight mutation events (Create /
        Update / Delete / Publish / permission / membership / tagging / job
        events across all asset types and account settings). Cursor-based:
        pass the `nextCursor` returned in a previous response to fetch the
        next page. Reads (Get / Describe / List / Search) are NOT returned —
        the timeline only records events that touch assets or settings.
      parameters:
        - name: cursor
          in: query
          description: ISO timestamp. Returns events strictly older than this.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Page size. Default 50, max 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: resourceTypes
          in: query
          description: >
            Comma-separated list of resource types to include. Catalog types
            (dashboard, analysis, dataset, datasource, folder, group, user)
            show hydrated asset names; `other` covers templates, themes,
            brands, topics, account settings, etc.
          schema:
            type: string
        - name: users
          in: query
          description: Comma-separated list of user names to include.
          schema:
            type: string
        - name: eventNames
          in: query
          description: Comma-separated list of CloudTrail event names to include.
          schema:
            type: string
        - name: excludeEventNames
          in: query
          description: Comma-separated list of CloudTrail event names to exclude. Used by default to hide noisy ingestion events.
          schema:
            type: string
        - name: actions
          in: query
          description: Comma-separated list of action categories to include.
          schema:
            type: string
        - name: origins
          in: query
          description: Comma-separated origins to include (portal-ui, portal-api, portal, console, automation, unknown).
          schema:
            type: string
        - name: startDate
          in: query
          description: ISO timestamp. Returns events at or after this time.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: ISO timestamp. Returns events at or before this time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of timeline events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/timeline/{assetType}/{assetId}:
    get:
      summary: Get a page of activity timeline events for one catalog asset
      description: >
        Same as /api/activity/timeline but pre-filtered to a specific catalog
        asset. All other query params (cursor, limit, users, eventNames,
        actions, date range) still apply and further narrow the results.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder, group, user]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: users
          in: query
          schema:
            type: string
        - name: eventNames
          in: query
          schema:
            type: string
        - name: actions
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of timeline events for the specified asset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TimelinePage'
        '400':
          description: Invalid assetType or assetId.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/search:
    get:
      summary: Find anything the portal knows, in plain words
      description: |
        One ranked search over everything in the caches: dashboards,
        analyses, datasets, data sources, folders, SMUS listings, calculated
        fields (matched on name and on the expression, where the business
        rules live; one hit per distinct expression listing every asset that
        defines it), visuals (title, chart type, sheet and the fields in their
        wells) and the template library. Lexical, weighted by field (name over
        column over description), scaled by how many words matched, boosted by
        use. No model call; the index is built from the caches once per
        container and reused until an export changes them.

        Each hit carries `why` (which field matched which word), a one-line
        `summary` written for a person or an agent, and a portal `path`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
          description: Plain words, e.g. "gold orders dataset with revenue by region".
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated subset of dashboard, analysis, dataset, datasource, folder, smus-listing, calculated-field, visual, template.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Ranked hits
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/status:
    get:
      summary: SMUS (SageMaker Unified Studio) integration status
      description: >
        Reports whether a SMUS domain is configured for this portal and what
        the last SMUS export captured. When not configured, all SMUS UI (link
        indicators, actions, filters) is hidden. Everything SMUS-related the
        portal shows comes from that export, never from a live DataZone call.
      responses:
        '200':
          description: SMUS integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmusStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/export:
    post:
      summary: Start a SMUS export
      description: |
        Queues a job that sweeps the configured DataZone domain once (projects,
        published listings with their forms and columns, the portal role's
        standing in the domain) and stores the result as the SMUS snapshot in
        the cache bucket. Settings, Author and the catalog read that snapshot.
        Single-flight: if an export is already queued or running, its job id is
        returned instead of a new one.
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusExportQueued'
        '200':
          description: An export is already in flight; its job is returned
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusExportQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/dataset-links:
    post:
      summary: Resolve SMUS catalog links for QuickSight datasets
      description: >
        Matches cached QuickSight dataset metadata (name and source table
        names from lineage) against the live SMUS domain catalog and returns
        per-dataset link resolutions. Catalog data is fetched live (short
        in-memory TTL) — it is never persisted to the portal cache.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                datasetIds:
                  type: array
                  items:
                    type: string
                  description: Dataset ids to resolve (all cached datasets when omitted)
      responses:
        '200':
          description: Per-dataset SMUS link resolutions
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/SmusDatasetLink'
        '401':
          $ref: '#/components/responses/Unauthorized'

