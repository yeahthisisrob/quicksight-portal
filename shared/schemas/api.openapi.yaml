  # Permission sources endpoint
  /api/assets/{assetType}/{assetId}/permission-sources:
    get:
      summary: Get permission sources for an asset
      description: Returns how each user has access to an asset - direct, via group, or via shared folder
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder]
          description: The type of asset
        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: The asset identifier
      responses:
        '200':
          description: Permission sources for the asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [permissions, userAccessSources, groupAccessSources]
                    properties:
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
                      userAccessSources:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserAccessInfo'
                      groupAccessSources:
                        type: array
                        items:
                          $ref: '#/components/schemas/GroupAccessInfo'
        '404':
          description: Asset not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/dataset/{assetId}/source:
    get:
      summary: Where a dataset reads its data from
      description: |
        Returns the dataset's physical tables, read live from QuickSight (not
        the portal cache, which can be stale), together with the data sources
        a table may be pointed at.

        Uploaded (flat file) datasets have no queryable specification and
        return 400.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The dataset's current sources
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/DatasetSource'
                      - type: object
                        required: [dataSources]
                        properties:
                          dataSources:
                            type: array
                            description: |
                              Every data source in the account. A table's data
                              source is always chosen from this list - ARNs are
                              never entered by hand - and the server re-checks
                              membership on update.
                            items:
                              $ref: '#/components/schemas/DataSourceOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Repoint a dataset's physical tables and/or rename it
      description: |
        Applies the given edits and writes the whole specification back to
        QuickSight, which has no partial-update API.

        Column definitions are always preserved: logical tables, calculated
        fields and downstream dashboards reference those names, so this
        endpoint changes only where the data comes from. If the new table or
        query does not produce those columns, QuickSight rejects the update
        and its message is returned verbatim.

        A table cannot change kind - relational stays relational, custom SQL
        stays custom SQL.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Supply a name, a list of table edits, or both.
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Rename the dataset at the same time
                tables:
                  type: array
                  items:
                    $ref: '#/components/schemas/DatasetTableEdit'
      responses:
        '200':
          description: The dataset's sources after the update
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DatasetSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/datasets:
    get:
      summary: The datasets a definition declares and what it reads from each
      description: |
        Reads the analysis or dashboard definition live from QuickSight and
        lists every `DataSetIdentifierDeclarations` entry with the columns the
        definition depends on (field wells, filters, parameter defaults, sheet
        controls, formatting and calculated-field expressions). Calculated
        fields are reported separately: they live in the definition, so a
        replacement dataset does not have to provide them.

        This is the read side of a rebind. A caller (the UI, a CLI, or a
        planner) uses it to decide which identifier to repoint and at what.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      responses:
        '200':
          description: The definition's datasets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DefinitionDatasets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind/plan:
    post:
      summary: Dry-run a rebind - what would change and whether it can be applied
      description: |
        Read-only. For each requested rebind, resolves every column the
        definition reads from that dataset identifier against the target
        dataset's output columns:

        - `matched`: the same name exists in the target
        - `mapped`: renamed through `columnMap` to a column the target has
        - `suggested`: not in the target, but an unambiguous near match exists
          (case, spaces and separators ignored). Offered, never applied.
        - `missing`: not in the target and nothing close

        `canApply` is true only when nothing is suggested or missing. A caller
        turns a suggestion into a rename by adding it to `columnMap` and
        planning again, so every rename is explicit and readable in the
        request.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rebinds]
              properties:
                rebinds:
                  type: array
                  items:
                    $ref: '#/components/schemas/RebindRequest'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RebindPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind:
    post:
      summary: Apply a rebind in place, or as a clone
      description: |
        Plans again, refuses unless every column resolves, then writes the
        rewritten definition to QuickSight.

        - `update` rewrites the asset in place. A dashboard gets a new version
          which is published immediately so viewers see it.
        - `clone` creates a new asset (id generated unless `newAssetId` is
          given) carrying the rewritten definition, the source's theme and the
          source's permissions, so the copy has the same audience.

        The dataset identifier and every field id are preserved; only the
        declaration's ARN, the mapped column names and the matching
        calculated-field expressions change. QuickSight's own validation
        error is returned verbatim if the new dataset still cannot satisfy the
        definition.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRebindRequest'
      responses:
        '200':
          description: The asset that was written
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApplyRebindResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/repair/plan:
    post:
      summary: Everything that stops QuickSight from writing this definition, with a fix for each
      description: |
        Assets with definition errors cannot be published or updated as code.
        This reads the definition and the datasets it declares and lists the
        problems: columns the datasets no longer have (with a rename when one
        column clearly took its place, otherwise removal of every reference),
        parameters used but never declared (declare, or remove the controls
        and filters that read them), datasets that cannot be read (choose
        another; send it as `rebinds` and call again to check its columns),
        and the errors QuickSight itself reports, attached to those findings
        or listed as-is when nothing can be computed.

        Nothing is written. `proposed` is the accepted set in request form:
        pass `repairs` and `rebinds` to the preview endpoint to see the
        result, then to the rebind endpoint with `mode: update` to fix the
        asset in place, or `mode: clone` to fix a copy.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rebinds:
                  type: array
                  description: Datasets already chosen for identifiers whose own dataset is gone.
                  items:
                    $ref: '#/components/schemas/RebindRequest'
      responses:
        '200':
          description: The repair plan
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RepairPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/authoring/{assetType}/{assetId}/propose:
    post:
      summary: Turn a natural-language ask into a validated rebind proposal
      description: |
        "Copy this onto the orders_gold dataset", "switch this analysis to the
        new customer table in place". A model is asked two narrow questions -
        which candidate dataset each identifier should read from, and, only if
        the server's dry run leaves columns unresolved, which target column
        each unresolved source column means. Everything else is deterministic
        and the returned `plan` is the same dry run the plan endpoint gives.

        Nothing is applied. The caller reviews the proposal and calls the
        rebind endpoint with its `rebinds`, `mode` and `name`.

        The model is chosen by deployment configuration (Bedrock by default;
        a local Claude or Codex CLI, or any OpenAI-compatible endpoint, in
        development) and is reported in `model`.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRequest'
      responses:
        '200':
          description: The proposal and its dry run
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/rebind/preview:
    post:
      summary: Dry-run a rebind and edits, and return the rewritten definition
      description: |
        The plan endpoint plus the definition as it would be written: the
        same rewrite apply performs (rebinds, added calculated fields, edit
        ops), returned instead of sent to QuickSight, with every change in
        plain language and a sheet outline for editing. Meant for mockups.
        Renames that are only suggested are not applied, so the preview
        mirrors what apply would refuse or accept.
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rebinds]
              properties:
                rebinds:
                  type: array
                  items:
                    $ref: '#/components/schemas/RebindRequest'
                addCalculatedFields:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddedCalculatedField'
                ops:
                  type: array
                  items:
                    $ref: '#/components/schemas/DefinitionOp'
                repairs:
                  type: array
                  description: Applied first, before the rebind plan, so the plan sees the repaired definition.
                  items:
                    $ref: '#/components/schemas/RepairOp'
                template:
                  $ref: '#/components/schemas/TemplateRequest'
                typeRules:
                  $ref: '#/components/schemas/TypeRules'
      responses:
        '200':
          description: The plan and the rewritten definition
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/RebindPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings:
    get:
      summary: Portal settings with their effective values and where each comes from
      description: |
        Settings live in DynamoDB and fall back to the Lambda's environment,
        then to a default, so a fresh deployment keeps working from env vars
        alone and a migration can move values one at a time. Every setting
        reports its `source`. Secrets are never stored here: a sensitive
        setting is read-only and shows only whether its env var is set.
      responses:
        '200':
          description: Grouped settings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SettingsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Store settings
      description: |
        Writes the given values to DynamoDB. A null value clears the stored
        value, so the setting falls back to its env var or default again.
        Unknown keys and sensitive keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: The settings after the update
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SettingsSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/smus/projects:
    get:
      summary: Projects in the configured SMUS domain
      description: |
        The projects to choose from: a live, bounded ListProjects unioned with
        the projects the last SMUS export saw (the export is scoped to the
        chosen projects, so the choice cannot come from the export alone).
        Returns an empty list with `configured: false` when no domain is set;
        `exportedAt` is null when no export has run yet.
      responses:
        '200':
          description: The domain's projects
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [configured, projects, exportedAt]
                    properties:
                      configured:
                        type: boolean
                      exportedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the snapshot these projects come from was taken; null when no export has run.
                      projects:
                        type: array
                        items:
                          $ref: '#/components/schemas/SmusProject'
                      diagnostics:
                        $ref: '#/components/schemas/SmusProjectDiagnostics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/api-keys:
    get:
      summary: API keys for machine callers
      description: |
        Long-lived credentials for a CLI, a script or an agent. A key is sent
        as `Authorization: Bearer qsp_...` and grants the same access as a
        signed-in user to every endpoint except key management itself, which
        needs a person. Only the label, a display prefix and usage dates are
        stored and listed; the secret is shown once, at creation.
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [keys]
                    properties:
                      keys:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create an API key
      description: The secret is in this response only and cannot be recovered later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: What the key is for, e.g. "claude cli" or "nightly export".
      responses:
        '201':
          description: The key and its one-time secret
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/settings/api-keys/{id}:
    delete:
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/assets:
    get:
      summary: Published SMUS assets and the QuickSight datasets that already read them
      description: |
        Every published listing in the selected projects (all projects when
        none are selected in settings), with its table identity and columns
        from the listing's metadata forms, and the QuickSight datasets the
        portal has matched to it. The point is reuse: before creating a
        dataset for a SMUS asset, see the ones that already exist.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on the listing name or description
      responses:
        '200':
          description: Published assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [configured, projectFilter, assets, exportedAt]
                    properties:
                      configured:
                        type: boolean
                      exportedAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the snapshot was taken; null when no SMUS export has run.
                      projectFilter:
                        type: array
                        description: The project ids the sweep was limited to; empty means all.
                        items:
                          type: string
                      assets:
                        type: array
                        items:
                          $ref: '#/components/schemas/SmusAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/smus/assets/{listingId}/dataset:
    post:
      summary: Create a QuickSight dataset that reads a published SMUS asset
      description: |
        Creates a relational-table dataset over the listing's Glue table
        (catalog, database, table and columns come from the listing's
        metadata forms) through an existing data source chosen from the
        account, never typed. Permissions are copied from a reference dataset
        so the new one has an audience; without that, a created dataset is
        visible to nobody.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmusDatasetRequest'
      responses:
        '200':
          description: The created dataset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [dataSetId, name, arn]
                    properties:
                      dataSetId:
                        type: string
                      name:
                        type: string
                      arn:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/smus:
    get:
      summary: The catalog, SMUS first
      description: |
        Every published asset in the selected SMUS projects, carrying what
        SMUS owns (glossary terms, metadata forms, descriptions, the Glue
        table and its columns) and what only QuickSight knows: the datasets
        reading the asset, their calculated fields, and which dashboards and
        analyses use each field. Nothing outside the selected projects is
        listed; that scope is the same one Author uses.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on listing name, description, table or a column name
        - name: term
          in: query
          required: false
          schema:
            type: string
          description: Only assets carrying this glossary term
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Only assets owned by this project (within the selected projects)
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [projects, full]
          description: >
            `projects` returns only the project list with counts, straight from
            the SMUS snapshot, without building the QuickSight field index.
            The page asks for this first; the per-project listing follows.
      responses:
        '200':
          description: The catalog listing
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/smus/{listingId}:
    get:
      summary: One published asset with everything the portal knows about it
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SmusCatalogAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/data-catalog/calculated-fields:
    get:
      summary: Every calculated field in the account, grouped by what it computes
      description: |
        The catalog field-first. One row per distinct (name, expression):
        where it is defined (datasets, dashboards, analyses), the datasets it
        lives on with their SMUS listing, what it reads, how many dashboards,
        analyses and visuals use it, whether other expressions carry the same
        name (a conflict), whether a template matches it, and whether it has a
        portal note. Counts across the top. This is what the portal knows and
        SMUS does not.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Only fields on datasets whose SMUS listing belongs to this project.
        - name: datasetId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive match on the name or the expression.
        - name: conflictsOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: The calculated field catalog
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/calculated-fields/{key}:
    get:
      summary: One calculated field, with its lineage both ways and its variants
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The calculated field
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/data-catalog/columns:
    get:
      summary: Plain columns across datasets, tied back to their SMUS listing column
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: datasetId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The column catalog
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ColumnCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/templates/calculated-fields:
    get:
      summary: The calculated-field template library
      description: |
        Calculated fields saved for reuse, stored by the portal because SMUS
        has no home for them. Author offers them when creating a copy; the
        catalog marks fields that match one.
      responses:
        '200':
          description: The library
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [templates]
                    properties:
                      templates:
                        type: array
                        items:
                          $ref: '#/components/schemas/CalculatedFieldTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Save a calculated field as a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatedFieldTemplateInput'
      responses:
        '200':
          description: The saved template
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/data-catalog/templates/calculated-fields/{templateId}:
    put:
      summary: Update a template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatedFieldTemplateInput'
      responses:
        '200':
          description: The updated template
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/CalculatedFieldTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/authoring/datasets/{dataSetId}/columns:
    get:
      operationId: getAuthoringDatasetColumns
      summary: The columns a dataset exposes
      description: |
        For building an asset that does not exist yet, and so has no definition
        to read its columns from. Described live, falling back to the dataset's
        export when QuickSight cannot describe it (flat files), exactly as a
        rebind target is resolved.
      tags: [Authoring]
      parameters:
        - name: dataSetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The dataset's output columns
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthoringDatasetColumns'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/authoring/new/preview:
    post:
      summary: A dashboard or analysis from nothing - preview
      description: |
        The datasets it should read and the visuals it should show, described
        by column names; when `visuals` is absent and `ask` is given, the
        planner proposes them from the datasets' columns. Field wells follow
        each column's type. Optionally laid out on a template standard and
        passed through type rules. Nothing is written; the response is the
        definition, its outline, the visuals that were built (or proposed),
        and what could not be built.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetRequest'
      responses:
        '200':
          description: The definition as create would write it
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NewAssetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/new:
    post:
      summary: A dashboard or analysis from nothing - create
      description: |
        Same body as the preview. Creates the asset with the audience of
        `permissionsFrom` (or the template's), puts it in `folderId` when
        given, records the write and tags the asset with provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetRequest'
      responses:
        '200':
          description: The created asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NewAssetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/insights:
    get:
      summary: How an asset is used and how healthy it is, for choosing what to start from
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      responses:
        '200':
          description: Views and, for dashboards with metrics, health
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AssetInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/activity/health:
    get:
      summary: QuickSight CloudWatch health for a page of dashboards or datasets
      description: |
        One batched CloudWatch read for the ids given (up to 100): for
        dashboards, views, p90 view load time and visual load errors over the
        window; for datasets, refresh runs, p90 ingestion latency and error
        rows. Ids without metrics come back with only their id. Cached per
        Lambda container for a few minutes.
      parameters:
        - name: assetType
          in: query
          required: true
          schema:
            type: string
            enum: [dashboard, dataset]
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated asset ids, at most 100.
      responses:
        '200':
          description: Health per asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AssetHealthBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/{assetType}/{assetId}/rename:
    post:
      summary: Rename an asset live in QuickSight
      description: |
        Renames the asset in QuickSight and updates the portal cache
        immediately. Dashboards get a new version published so viewers see
        the new name; analyses and datasets are updated in place; folders
        use the name-only update API. Data sources, users, and groups
        cannot be renamed. The exported asset file refreshes on the next
        Smart Sync.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, folder]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The new asset name
      responses:
        '200':
          description: Asset renamed
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: The applied (trimmed) name
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/{assetType}/{assetId}/revoke-permissions:
    post:
      summary: Bulk revoke direct permissions from an asset
      description: Queues a bulk operation to remove direct permissions for multiple principals from the specified asset. Does not affect inherited permissions from folders or groups. Returns a job ID for tracking progress.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revocations]
              properties:
                revocations:
                  type: array
                  items:
                    type: object
                    required: [principal, actions]
                    properties:
                      principal:
                        type: string
                        description: The ARN of the principal to revoke
                      actions:
                        type: array
                        items:
                          type: string
                        description: The actions to revoke
      responses:
        '202':
          description: Permission revoke job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Group management endpoints
  /api/groups/{groupName}/members:
    post:
      summary: Add users to a group
      description: Queues a bulk job that adds the given users to the group; poll the returned jobId for completion
      operationId: addUsersToGroup
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userNames]
              properties:
                userNames:
                  type: array
                  items:
                    type: string
                  description: QuickSight user names to add
      responses:
        '202':
          description: Membership job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove users from a group
      description: Queues a bulk job that removes the given users from the group; poll the returned jobId for completion
      operationId: removeUsersFromGroup
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userNames]
              properties:
                userNames:
                  type: array
                  items:
                    type: string
                  description: QuickSight user names to remove
      responses:
        '202':
          description: Membership job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/groups/{groupName}/assets:
    get:
      summary: Get assets accessible by a group
      description: Returns all assets that a group has access to through direct permissions or folder membership
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
          description: The name of the group
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
      responses:
        '200':
          description: List of accessible assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [groupName, totalAssets, assets]
                    properties:
                      groupName:
                        type: string
                      totalAssets:
                        type: integer
                      assetsByType:
                        type: object
                        properties:
                          dashboards:
                            type: integer
                          datasets:
                            type: integer
                          analyses:
                            type: integer
                          datasources:
                            type: integer
                          folders:
                            type: integer
                      assets:
                        type: array
                        items:
                          type: object
                          required: [assetId, assetType, assetName, accessType]
                          properties:
                            assetId:
                              type: string
                            assetType:
                              $ref: '#/components/schemas/AssetType'
                            assetName:
                              type: string
                            arn:
                              type: string
                            accessType:
                              type: string
                              enum: [direct, folder_inherited]
                              description: How the group has access to this asset
                            folderPath:
                              type: string
                              description: Folder path if access is inherited from folder
                            permissions:
                              type: array
                              items:
                                type: string
                              description: List of permissions the group has on this asset
        '404':
          description: Group not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{userName}/asset-access:
    get:
      summary: Get assets accessible by a user
      description: Returns all assets that a user has access to through direct permissions, group membership, or folder membership
      parameters:
        - name: userName
          in: path
          required: true
          schema:
            type: string
          description: The name of the user
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
      responses:
        '200':
          description: List of accessible assets with access sources
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserAssetAccessResponse'
        '404':
          description: User not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/activity/user-inactive-analyses:
    post:
      summary: Get inactive analyses owned by a specific user
      description: Returns analyses where the user has owner-level permissions and activity is below threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName]
              properties:
                userName:
                  type: string
                  description: The username to find inactive analyses for
      responses:
        '200':
          description: List of inactive analyses
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [analyses]
                    properties:
                      analyses:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserInactiveAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/user-unused-datasets:
    post:
      summary: Get unused datasets owned by a specific user
      description: Returns datasets where the user has owner-level permissions and no dashboards or analyses reference them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName]
              properties:
                userName:
                  type: string
                  description: The username to find unused datasets for
      responses:
        '200':
          description: List of unused datasets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [datasets]
                    properties:
                      datasets:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserUnusedDataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/activity/recipients:
    post:
      summary: Resolve asset permissions to recipient emails
      description: Given an asset, resolves its permission principals (users/groups) into email addresses for mailto composition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetType, assetId]
              properties:
                assetType:
                  type: string
                  enum: [dashboard, analysis]
                assetId:
                  type: string
      responses:
        '200':
          description: Resolved recipients
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [users, groups]
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResolvedRecipient'
                      groups:
                        type: array
                        items:
                          type: object
                          required: [groupName, members]
                          properties:
                            groupName:
                              type: string
                            members:
                              type: array
                              items:
                                $ref: '#/components/schemas/ResolvedRecipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
  
  parameters:
    AuthorableAssetType:
      name: assetType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthorableAssetType'
    AuthoringAssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string

  schemas:
    # Core types
    AssetType:
      type: string
      enum: [dashboard, analysis, dataset, datasource, folder, user, group]

    AssetStatus:
      type: string
      enum: [active, archived, deleted]

    EnrichmentStatus:
      type: string
      enum: [skeleton, enriched, partial, metadata-update]

    # Search match reasons - indicates why an asset matched a search query
    SearchMatchReason:
      type: string
      enum:
        - name           # Matched on asset name
        - id             # Matched on asset ID
        - description    # Matched on description
        - arn            # Matched on ARN
        - tag_key        # Matched on tag key
        - tag_value      # Matched on tag value
        - permission     # Matched on permission principal (user/group name)
        - dependency_dataset     # Asset depends on a dataset matching the query
        - dependency_datasource  # Asset depends on a datasource matching the query
        - dependency_analysis    # Asset depends on an analysis matching the query
      description: |
        Indicates why an asset was included in search results.
        Multiple reasons can apply to a single asset.

    # Paginated response
    PaginatedAssetResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            dashboards:
              type: array
              items:
                $ref: '#/components/schemas/DashboardListItem'
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/DatasetListItem'
            analyses:
              type: array
              items:
                $ref: '#/components/schemas/AnalysisListItem'
            datasources:
              type: array
              items:
                $ref: '#/components/schemas/DatasourceListItem'
            folders:
              type: array
              items:
                $ref: '#/components/schemas/FolderListItem'
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserListItem'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupListItem'
            pagination:
              $ref: '#/components/schemas/PaginationInfo'
            fromCache:
              type: boolean
    
    PaginationInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
        hasMore:
          type: boolean

    # Filter types (shared across frontend and backend)
    TagFilter:
      type: object
      description: Filter for tags with key-value pairs
      required: [key, value]
      properties:
        key:
          type: string
          description: Tag key
        value:
          type: string
          description: Tag value

    AssetFilter:
      type: object
      description: Filter for selecting specific assets
      required: [id, name, type]
      properties:
        id:
          type: string
          description: Asset ID
        name:
          type: string
          description: Asset display name
        type:
          type: string
          description: Asset type (dashboard, analysis, dataset, etc.)

    # Field search parameters for data catalog
    FieldSearchParams:
      type: object
      description: Parameters for searching and filtering catalog fields
      properties:
        query:
          type: string
          description: Text search on field name, display name, or description
        dataType:
          type: string
          description: Filter by data type (STRING, INTEGER, DECIMAL, etc.)
        assetType:
          type: string
          description: Filter by source asset type (dashboard, analysis, dataset)
        isCalculated:
          type: boolean
          description: Filter for calculated fields only
        page:
          type: integer
          minimum: 1
          default: 1
          description: Page number (1-indexed)
        pageSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
          description: Number of items per page

    # Base asset response
    AssetListItem:
      type: object
      required: [id, name, type, status, createdTime, lastUpdatedTime, lastExportTime, enrichmentStatus]
      properties:
        id:
          type: string
          description: Asset unique identifier
        name:
          type: string
          description: Asset display name
        type:
          $ref: '#/components/schemas/AssetType'
        status:
          $ref: '#/components/schemas/AssetStatus'
        createdTime:
          type: string
          format: date-time
          description: When asset was created in QuickSight
        lastUpdatedTime:
          type: string
          format: date-time
          description: When asset was last updated in QuickSight (QuickSight's lastModifiedTime)
        lastExportTime:
          type: string
          format: date-time
          description: When asset was last exported to our portal (our timestamp)
        enrichmentStatus:
          $ref: '#/components/schemas/EnrichmentStatus'
        enrichmentTimestamps:
          type: object
          description: Timestamps for when each enrichment step was completed
          properties:
            definition:
              type: string
              format: date-time
              description: When asset definition was enriched
            permissions:
              type: string
              format: date-time
              description: When permissions were enriched
            tags:
              type: string
              format: date-time
              description: When tags were enriched
            lineage:
              type: string
              format: date-time
              description: When lineage was enriched
            views:
              type: string
              format: date-time
              description: When view stats were enriched
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          default: []
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          default: []
          description: Asset permissions
        searchMatchReasons:
          type: array
          items:
            $ref: '#/components/schemas/SearchMatchReason'
          description: |
            Why this asset matched the search query. Only present when a search
            query was provided. Multiple reasons can apply (e.g., matched on name
            AND is a dependency of another matched asset).

    # Archived asset response (extends AssetListItem)
    ArchivedAssetItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [archivedDate, archiveReason]
          properties:
            archivedDate:
              type: string
              format: date-time
              description: When asset was archived
            archiveReason:
              type: string
              description: Reason for archiving the asset
            archivedBy:
              type: string
              description: User or system that archived the asset
            lastActivity:
              type: string
              format: date-time
              nullable: true
              description: Last time the asset was viewed/accessed before archiving

    # Folder-specific responses
    FolderListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [path, memberCount]
          properties:
            path:
              type: string
              description: Full folder path like /parent/child
              example: "/Marketing/Reports"
            memberCount:
              type: integer
              description: Number of assets in folder
              minimum: 0
            parentId:
              type: string
              description: Parent folder ID (if any)

    FolderDetails:
      allOf:
        - $ref: '#/components/schemas/FolderListItem'
        - type: object
          properties:
            createdBy:
              type: string
              description: User who created the folder
            description:
              type: string
              description: Folder description

    FolderMember:
      type: object
      required: [MemberId, MemberType, MemberName]
      properties:
        MemberId:
          type: string
          description: Asset ID of the member
        MemberType:
          type: string
          enum: [DASHBOARD, ANALYSIS, DATASET, DATASOURCE]
          description: Type of asset
        MemberName:
          type: string
          description: Display name of the asset

    # Dashboard-specific responses
    # Shared 202 response for queued bulk jobs (delete, membership, permissions)
    BulkJobAccepted:
      type: object
      required: [success, jobId, status, message]
      properties:
        success:
          type: boolean
        jobId:
          type: string
          description: Poll /jobs/{jobId} for completion
        status:
          type: string
        message:
          type: string
        estimatedOperations:
          type: integer

    # View-activity summary attached to dashboard/analysis list items
    ViewActivitySummary:
      type: object
      description: Activity summary (views)
      properties:
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true

    DefinitionError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          description: Error type (e.g., COLUMN_NOT_FOUND)
        message:
          type: string
          description: Error message
        violatedEntities:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                description: Path to the entity with the error

    DashboardListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [dashboardStatus, visualCount, sheetCount, datasetCount]
          properties:
            dashboardStatus:
              type: string
              description: Dashboard creation status
              example: "CREATION_SUCCESSFUL"
            visualCount:
              type: integer
              description: Number of visuals in dashboard
              minimum: 0
            sheetCount:
              type: integer
              description: Number of sheets in dashboard
              minimum: 0
            datasetCount:
              type: integer
              description: Number of datasets used
              minimum: 0
            publishedVersionNumber:
              type: integer
              description: Published version number (if any)
            activity:
              $ref: '#/components/schemas/ViewActivitySummary'
            definitionErrors:
              type: array
              description: Definition validation errors
              items:
                $ref: '#/components/schemas/DefinitionError'

    # Dataset-specific responses
    AnalysisListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [sheetCount, visualCount, datasetCount]
          properties:
            sheetCount:
              type: integer
              description: Number of sheets in the analysis
            visualCount:
              type: integer
              description: Total number of visuals across all sheets
            datasetCount:
              type: integer
              description: Number of datasets used
            activity:
              $ref: '#/components/schemas/ViewActivitySummary'
            definitionErrors:
              type: array
              description: Definition validation errors
              items:
                $ref: '#/components/schemas/DefinitionError'
            sourceEntity:
              type: object
              properties:
                sourceTemplate:
                  type: object
                  properties:
                    dataSetReferences:
                      type: array
                      items:
                        type: object
                    arn:
                      type: string
    
    DatasetListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [importMode, fieldCount]
          properties:
            importMode:
              type: string
              enum: [SPICE, DIRECT_QUERY]
              description: How data is imported
            fieldCount:
              type: integer
              description: Number of fields in dataset
              minimum: 0
            sizeInBytes:
              type: integer
              description: Dataset size in bytes
            sourceType:
              type: string
              description: >
                Data source type resolved from the dataset's data sources
                (the DataSource API's Type field — ATHENA, REDSHIFT, S3, etc.)
            schemas:
              type: array
              items:
                type: string
              description: >
                Distinct source schemas (databases) from the dataset's
                relational physical tables — the RelationalTable Schema field,
                which is the database for Athena sources and the schema for
                Redshift and other relational engines. Populated at export time.
            hasRefreshProperties:
              type: boolean
              description: Whether dataset has refresh properties configured
            refreshScheduleCount:
              type: integer
              description: Number of refresh schedules configured
              minimum: 0
            refreshSchedules:
              type: array
              description: List of refresh schedules for the dataset
              items:
                $ref: '#/components/schemas/RefreshSchedule'
            dataSetRefreshProperties:
              type: object
              description: Refresh configuration properties for the dataset
            activity:
              type: object
              description: >
                Aggregated activity for the dataset — views across the
                dashboards/analyses that use it, plus last refresh (ingestion).
              properties:
                totalViews:
                  type: integer
                  minimum: 0
                uniqueViewers:
                  type: integer
                  minimum: 0
                lastViewed:
                  type: string
                  format: date-time
                  nullable: true
                lastRefreshTime:
                  type: string
                  format: date-time
                  nullable: true
                lastRefreshStatus:
                  type: string
                  nullable: true

    RefreshSchedule:
      type: object
      required: [scheduleId, scheduleFrequency, refreshType, arn]
      properties:
        scheduleId:
          type: string
          description: Unique identifier for the refresh schedule
        scheduleFrequency:
          type: object
          required: [interval]
          properties:
            interval:
              type: string
              enum: [MINUTE15, MINUTE30, HOURLY, DAILY, WEEKLY, MONTHLY]
              description: Frequency of the refresh
            refreshOnDay:
              type: object
              properties:
                dayOfWeek:
                  type: string
                  enum: [SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
                  description: Day of the week for weekly schedules
                dayOfMonth:
                  type: string
                  description: Day of the month for monthly schedules
            timeOfTheDay:
              type: string
              description: Time of day for the refresh (HH:MM format)
            timezone:
              type: string
              description: Timezone for the schedule
        startAfterDateTime:
          type: string
          format: date-time
          description: When the schedule starts
        refreshType:
          type: string
          enum: [INCREMENTAL_REFRESH, FULL_REFRESH]
          description: Type of refresh to perform
        arn:
          type: string
          description: ARN of the refresh schedule

    # User-specific responses
    DatasourceListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [type, connectionMode]
          properties:
            type:
              type: string
              description: Type of datasource (e.g., ATHENA, REDSHIFT, S3)
            connectionMode:
              type: string
              description: Connection mode (DIRECT_QUERY or IMPORT)
            dataSourceParameters:
              type: object
              description: Connection parameters
            vpcConnectionProperties:
              type: object
              properties:
                vpcConnectionArn:
                  type: string
    
    GroupListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [memberCount]
          properties:
            memberCount:
              type: integer
              description: Number of members in the group
            description:
              type: string
              description: Group description
            principalId:
              type: string
              description: Principal ID of the group
    
    UserListItem:
      allOf:
        - $ref: '#/components/schemas/AssetListItem'
        - type: object
          required: [email, role, active, groupCount]
          properties:
            email:
              type: string
              format: email
              description: User email address
            role:
              type: string
              description: User role in QuickSight
              example: "AUTHOR"
            active:
              type: boolean
              description: Whether user is active
            groupCount:
              type: integer
              description: Number of groups user belongs to
              minimum: 0
            assetAccessCount:
              type: integer
              description: Number of assets the user has access to
              minimum: 0
            groups:
              type: array
              items:
                type: string
              description: List of group names user belongs to
              default: []
            lastActivityTime:
              type: string
              format: date-time
              description: Last time user was active
            activityCount:
              type: integer
              description: Total number of user activities
              minimum: 0
            activity:
              type: object
              description: User activity summary
              properties:
                totalActivities:
                  type: integer
                  minimum: 0
                lastActive:
                  type: string
                  format: date-time
                  nullable: true
                dashboardCount:
                  type: integer
                  minimum: 0
                analysisCount:
                  type: integer
                  minimum: 0

    # Lineage types
    AssetLineage:
      type: object
      required: [assetId, assetType, assetName, relationships]
      properties:
        assetId:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        assetName:
          type: string
        isArchived:
          type: boolean
          description: Whether this asset is archived
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/LineageRelationship'
        metadata:
          type: object
          properties:
            datasourceType:
              type: string
              description: Type of datasource (S3, ATHENA, etc.)

    LineageRelationship:
      type: object
      required: [sourceAssetId, sourceAssetType, sourceAssetName, targetAssetId, targetAssetType, targetAssetName, relationshipType]
      properties:
        sourceAssetId:
          type: string
        sourceAssetType:
          $ref: '#/components/schemas/AssetType'
        sourceAssetName:
          type: string
        sourceIsArchived:
          type: boolean
          description: Whether the source asset is archived
        targetAssetId:
          type: string
        targetAssetType:
          $ref: '#/components/schemas/AssetType'
        targetAssetName:
          type: string
        targetIsArchived:
          type: boolean
          description: Whether the target asset is archived
        relationshipType:
          type: string
          enum: [uses, used_by]
        activity:
          type: object
          description: Activity data for dashboard and analysis relationships
          properties:
            totalViews:
              type: integer
              description: Total number of views
            uniqueViewers:
              type: integer
              description: Number of unique viewers
            lastViewed:
              type: string
              format: date-time
              nullable: true
              description: Last time the asset was viewed
        tags:
          type: array
          description: Tags associated with the target asset
          items:
            $ref: '#/components/schemas/Tag'

    # Field catalog types
    FieldInfo:
      type: object
      required: [fieldId, fieldName, dataType, isCalculated, sourceAssetType, sourceAssetId, sourceAssetName, usageCount, analysisCount, dashboardCount, lastUpdated]
      properties:
        fieldId:
          type: string
        fieldName:
          type: string
        displayName:
          type: string
        dataType:
          type: string
          description: Field data type
        description:
          type: string
        isCalculated:
          type: boolean
          description: Whether this is a calculated field
        expression:
          type: string
          description: Calculation expression (if calculated field)
        sourceAssetType:
          type: string
          enum: [dataset, analysis, dashboard]
        sourceAssetId:
          type: string
        sourceAssetName:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        columnName:
          type: string
          description: Source column name
        dependencies:
          type: array
          items:
            type: string
          description: Field IDs this calculated field depends on
        usageCount:
          type: integer
          description: Total usage count
          minimum: 0
        analysisCount:
          type: integer
          description: Number of analyses using this field
          minimum: 0
        dashboardCount:
          type: integer
          description: Number of dashboards using this field
          minimum: 0
        lastUpdated:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          default: []

    # Common types
    Tag:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          description: Tag key
        value:
          type: string
          description: Tag value

    Permission:
      type: object
      required: [principal, principalType, actions]
      properties:
        principal:
          type: string
          description: Principal ARN or identifier
        principalType:
          type: string
          enum: [USER, GROUP, NAMESPACE, PUBLIC]
          description: Type of principal
        actions:
          type: array
          items:
            type: string
          description: List of allowed actions

    AccessSource:
      type: object
      required: [type, actions]
      properties:
        type:
          type: string
          enum: [direct, group, folder]
          description: How the user has access
        actions:
          type: array
          items:
            type: string
          description: Permission actions from this source
        groupName:
          type: string
          description: Group name if access is via group
        folderName:
          type: string
          description: Folder name if access is via folder
        folderPath:
          type: string
          description: Folder path if access is via folder

    UserAccessInfo:
      type: object
      required: [userName, userArn, sources]
      properties:
        userName:
          type: string
          description: The user's name
        userArn:
          type: string
          description: The user's ARN
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways this user has access to the asset

    GroupAccessInfo:
      type: object
      required: [groupName, groupArn, sources]
      properties:
        groupName:
          type: string
          description: The group's name
        groupArn:
          type: string
          description: The group's ARN
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways this group has access to the asset

    UserAssetAccessResponse:
      type: object
      required: [userName, totalAssets, assets]
      properties:
        userName:
          type: string
        totalAssets:
          type: integer
        assetsByType:
          type: object
          properties:
            dashboards:
              type: integer
            datasets:
              type: integer
            analyses:
              type: integer
            datasources:
              type: integer
            folders:
              type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/UserAssetAccessItem'

    UserAssetAccessItem:
      type: object
      required: [assetId, assetType, assetName, sources]
      properties:
        assetId:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        assetName:
          type: string
        arn:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AccessSource'
          description: All ways the user has access to this asset

    # Activity types
    ActivityData:
      type: object
      required: [assetId, assetType, totalViews, uniqueViewers, lastViewed, viewsByDate, viewers]
      properties:
        assetId:
          type: string
          description: Asset identifier
        assetName:
          type: string
          description: Asset name from cache
        assetType:
          type: string
          enum: [dashboard, analysis]
        totalViews:
          type: integer
          description: Total number of views in activity window
        uniqueViewers:
          type: integer
          description: Number of unique viewers
        lastViewed:
          type: string
          format: date-time
          description: Most recent view timestamp (persisted forever)
        viewsByDate:
          type: object
          additionalProperties:
            type: integer
          description: View counts by date (YYYY-MM-DD)
        viewers:
          type: array
          description: All viewers with their activity counts
          items:
            type: object
            required: [userName, viewCount, lastViewed]
            properties:
              userName:
                type: string
                description: User name or ARN
              viewCount:
                type: integer
                description: Number of views by this user
              lastViewed:
                type: string
                format: date-time
                description: Last time this user viewed the asset
              groups:
                type: array
                items:
                  type: string
                description: Groups the user belongs to

    DatasetActivityData:
      type: object
      description: >
        Activity for a dataset — refresh (ingestion) history plus aggregated
        view/update activity of the dashboards and analyses that use it.
      required: [datasetId, totalViews, uniqueViewers, viewsByDate, usedBy, ingestions, refreshSummary]
      properties:
        datasetId:
          type: string
          description: Dataset identifier
        datasetName:
          type: string
          description: Dataset name from cache
        totalViews:
          type: integer
          minimum: 0
          description: Total views across all dashboards/analyses that use this dataset
        uniqueViewers:
          type: integer
          minimum: 0
          description: Unique viewers across all dependent assets (true union, not a sum)
        lastViewed:
          type: string
          format: date-time
          nullable: true
          description: Most recent view of any dependent asset
        viewsByDate:
          type: object
          additionalProperties:
            type: integer
          description: Aggregated dependent-asset view counts by date (YYYY-MM-DD)
        usedBy:
          type: array
          description: Per-dependent activity for dashboards/analyses that use this dataset
          items:
            $ref: '#/components/schemas/DatasetDependentActivity'
        refreshSummary:
          type: object
          description: Summary of the dataset's ingestion (refresh) activity
          required: [totalIngestions, failedIngestions]
          properties:
            totalIngestions:
              type: integer
              minimum: 0
            failedIngestions:
              type: integer
              minimum: 0
            lastIngestionTime:
              type: string
              format: date-time
              nullable: true
            lastIngestionStatus:
              type: string
              nullable: true
        ingestions:
          type: array
          description: Recent ingestion runs for this dataset, newest first
          items:
            $ref: '#/components/schemas/Ingestion'

    DatasetDependentActivity:
      type: object
      required: [assetId, assetType, totalViews, uniqueViewers]
      properties:
        assetId:
          type: string
          description: Dependent asset identifier
        assetName:
          type: string
          description: Dependent asset name
        assetType:
          type: string
          enum: [dashboard, analysis]
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true
          description: Most recent view of this dependent asset
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: Most recent mutation (update/publish) of this dependent asset

    TimelineActor:
      type: object
      description: The actor in words. The portal's own Lambda role shows as "Portal".
      required: [kind, label, raw]
      properties:
        kind:
          type: string
          enum: [portal, user, role, root, service, unknown]
        label:
          type: string
        raw:
          type: string

    TimelineOrigin:
      type: string
      description: >
        Where a change came from. portal-ui and portal-api are portal writes attributed
        through the audit log (a person in the UI, or an API key such as an agent);
        portal is a portal write without a matching record; console is a person or
        role acting directly; automation is an AWS service.
      enum: [portal-ui, portal-api, portal, console, automation, unknown]

    TimelineProvenance:
      type: object
      required: [actor, channel, action, distanceMs]
      properties:
        actor:
          type: object
          required: [kind, id, label]
          properties:
            kind:
              type: string
              enum: [user, api-key]
            id:
              type: string
            label:
              type: string
        channel:
          type: string
          enum: [ui, api]
        action:
          type: string
          description: e.g. authoring.update, authoring.clone, asset.rename, asset.delete, asset.tags
        jobId:
          type: string
        distanceMs:
          type: integer
          description: How far the audit record was from the event; small means confident.

    TimelineEvent:
      type: object
      required: [id, timestamp, eventName, kind, user, actor, origin]
      properties:
        id:
          type: string
          description: Stable identifier hash for the event (timestamp + name + resource + user).
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (ISO).
        eventName:
          type: string
          description: CloudTrail event name (e.g. CreateDashboard, UpdateDataSetPermissions, TagResource).
        kind:
          type: string
          enum: [view, mutation]
          description: Whether this event is a read/view or a mutation. The timeline returns mutations only by default.
        action:
          type: string
          enum: [create, update, delete, publish, grant, revoke, member, tag, job, batch]
          description: Coarse action category derived from the event name.
        user:
          type: string
          description: User name or ARN that performed the action.
        actor:
          $ref: '#/components/schemas/TimelineActor'
        origin:
          $ref: '#/components/schemas/TimelineOrigin'
        provenance:
          $ref: '#/components/schemas/TimelineProvenance'
          description: For portal events, who was behind it, from the portal's own audit log.
        resourceType:
          type: string
          enum: [dashboard, analysis, dataset, datasource, folder, group, user, other]
          description: >
            Resource type the event targets. Catalog types (dashboard / analysis / dataset /
            datasource / folder / group / user) are hydrated with asset names; `other` covers
            templates, themes, brands, topics, action connectors, VPC connections, namespaces,
            and account-level settings.
        assetType:
          type: string
          enum: [dashboard, analysis, dataset, datasource, folder, group, user]
          description: Catalog asset type (only set when resourceType is a catalog asset).
        assetId:
          type: string
          description: Resource identifier (dashboardId, analysisId, ...). Absent for some account-level settings events.
        assetName:
          type: string
          description: Asset name from the portal catalog. Absent if the catalog does not know this asset.
        arn:
          type: string
          description: Full resource ARN, when present on the CloudTrail event.
        raw:
          type: object
          description: >
            The stored activity record, verbatim — pruned but with readable
            field names (timestamp, eventName, user, resourceId, name, kind,
            action, resourceType, details, eventId). For mutations, details
            holds the allowlisted CloudTrail payload slice. Powers the
            per-event JSON debugging view.

    TimelinePage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
          description: Timeline events for this page, sorted newest-first.
        nextCursor:
          type: string
          nullable: true
          format: date-time
          description: ISO timestamp of the last item in `items`. Pass back as `cursor` to fetch the next page. `null` when there are no more events.
        hasMore:
          type: boolean
          description: True if more events exist beyond this page.
        cacheLastUpdated:
          type: string
          format: date-time
          description: ISO timestamp of when the activity cache was last refreshed (from the most recent /activity/refresh job). Shown in the UI as "last refreshed X ago".

    UserActivity:
      type: object
      required: [userName, lastActive, totalActivities, activitiesByDate, dashboards, analyses]
      properties:
        userName:
          type: string
          description: User name or ARN
        lastActive:
          type: string
          format: date-time
          description: Last activity timestamp (persisted forever)
        totalActivities:
          type: integer
          description: Total number of activities in activity window
        activitiesByDate:
          type: object
          additionalProperties:
            type: integer
          description: Activity counts by date (YYYY-MM-DD)
        dashboards:
          type: array
          description: Dashboards viewed with activity counts
          items:
            type: object
            required: [dashboardId, viewCount, lastViewed]
            properties:
              dashboardId:
                type: string
                description: Dashboard ID
              dashboardName:
                type: string
                description: Dashboard name from cache
              viewCount:
                type: integer
                description: Number of times viewed
              lastViewed:
                type: string
                format: date-time
                description: Last time viewed
        analyses:
          type: array
          description: Analyses viewed with activity counts
          items:
            type: object
            required: [analysisId, viewCount, lastViewed]
            properties:
              analysisId:
                type: string
                description: Analysis ID
              analysisName:
                type: string
                description: Analysis name from cache
              viewCount:
                type: integer
                description: Number of times viewed
              lastViewed:
                type: string
                format: date-time
                description: Last time viewed (YYYY-MM-DD)

    # Export status types
    ExportStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [inventoryComplete, enrichmentInProgress, totalAssets, enrichedAssets, skeletonAssets, percentEnriched, assetsByType, lastUpdated, nextSteps, logs, nextPollInMs]
          properties:
            inventoryComplete:
              type: boolean
              description: Whether initial asset inventory is complete
            enrichmentInProgress:
              type: boolean
              description: Whether an export is currently running
            totalAssets:
              type: integer
              description: Total number of assets in inventory
            enrichedAssets:
              type: integer
              description: Number of fully enriched assets
            skeletonAssets:
              type: integer
              description: Number of skeleton-only assets
            percentEnriched:
              type: integer
              description: Percentage of assets fully enriched
              minimum: 0
              maximum: 100
            assetsByType:
              type: object
              additionalProperties:
                type: integer
              description: Count of assets by type
            lastUpdated:
              type: string
              format: date-time
              description: When the cache was last updated
            nextSteps:
              type: object
              required: [phase, action, description]
              properties:
                phase:
                  type: string
                  enum: [inventory, enrichment, complete]
                action:
                  type: string
                description:
                  type: string
            exportState:
              type: object
              nullable: true
              description: Current export state if an export is running
              properties:
                status:
                  type: string
                  enum: [idle, running, completed, error]
                currentStage:
                  type: string
                  description: Current stage of export process
                startedAt:
                  type: integer
                  description: Unix timestamp when export started
                completedAt:
                  type: integer
                  nullable: true
                  description: Unix timestamp when export completed
                totalAssets:
                  type: integer
                enrichedAssets:
                  type: integer
                failedAssets:
                  type: integer
                assetProgress:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      listed:
                        type: integer
                      enriched:
                        type: integer
                      failed:
                        type: integer
            logs:
              type: array
              description: Recent export log entries
              items:
                $ref: '#/components/schemas/ExportLogEntry'
            nextPollInMs:
              type: integer
              description: Suggested milliseconds until next poll
              minimum: 1000
              maximum: 60000

    ExportLogEntry:
      type: object
      required: [ts, msg]
      properties:
        ts:
          type: integer
          description: Unix timestamp in milliseconds
        msg:
          type: string
          description: Log message
        level:
          type: string
          enum: [info, warn, error]
          default: info
        assetType:
          type: string
          description: Asset type context
        assetId:
          type: string
          description: Asset ID context
        apiCalls:
          type: integer
          description: Number of API calls made in this operation

    ExportSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [totalAssets, exportedAssets, lastExportDate, exportInProgress, assetTypeCounts, fieldStatistics]
          properties:
            totalAssets:
              type: integer
            exportedAssets:
              type: integer
            lastExportDate:
              type: string
              format: date-time
              nullable: true
            exportInProgress:
              type: boolean
            needsInitialExport:
              type: boolean
              description: Indicates if initial export is needed (no cache exists)
            message:
              type: string
              description: Optional message providing export status context
            assetTypeCounts:
              type: object
              properties:
                dashboards:
                  type: integer
                datasets:
                  type: integer
                analyses:
                  type: integer
                datasources:
                  type: integer
                folders:
                  type: integer
                users:
                  type: integer
                groups:
                  type: integer
            archivedAssetCounts:
              type: object
              properties:
                dashboards:
                  type: integer
                datasets:
                  type: integer
                analyses:
                  type: integer
                datasources:
                  type: integer
                folders:
                  type: integer
                users:
                  type: integer
                groups:
                  type: integer
                total:
                  type: integer
            fieldStatistics:
              type: object
              nullable: true
              properties:
                totalFields:
                  type: integer
                totalCalculatedFields:
                  type: integer
                totalUniqueFields:
                  type: integer
            totalSize:
              type: integer
              description: Total storage size in bytes
            cacheVersion:
              type: string

    # Export job schemas
    ExportJobRequest:
      type: object
      properties:
        forceRefresh:
          type: boolean
          default: false
          description: Force re-export of all assets even if cached
        rebuildIndex:
          type: boolean
          default: false
          description: Rebuild all indexes from scratch
        assetTypes:
          type: array
          items:
            $ref: '#/components/schemas/AssetType'
          description: Specific asset types to export (all if not specified)
        exportOrganizational:
          type: boolean
          default: false
          description: Export all organizational assets (users, groups, folders) together
        refreshOptions:
          type: object
          properties:
            definitions:
              type: boolean
              default: true
            permissions:
              type: boolean
              default: true
            tags:
              type: boolean
              default: true

    ExportJobResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [jobId, status, message]
          properties:
            jobId:
              type: string
              description: Unique job identifier
            status:
              $ref: '#/components/schemas/JobStatus'
            message:
              type: string
              description: User-friendly status message

    JobStatus:
      type: string
      enum: [queued, processing, completed, failed, stopping, stopped]
      description: Current status of the export job

    JobPhase:
      type: object
      required: [key, status]
      description: |
        One step of a multi-phase job. Optional. Jobs that report phases
        emit a fixed-length array; status transitions monotonically
        (pending → in_progress → completed/failed/skipped).
      properties:
        key:
          type: string
          description: Stable phase identifier (e.g. fetch-views, fetch-mutations)
        status:
          type: string
          enum: [pending, in_progress, completed, failed, skipped]
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
          nullable: true
        counts:
          type: object
          nullable: true
          properties:
            processed:
              type: integer
            total:
              type: integer
            newEvents:
              type: integer
            truncated:
              type: integer
            errors:
              type: integer

    DatasetPhysicalTable:
      type: object
      required: [id, kind, dataSourceArn, name, columnCount, editable]
      properties:
        id:
          type: string
          description: |
            Key in the dataset's PhysicalTableMap. Referenced by the logical
            table map, so it never changes.
        kind:
          type: string
          enum: [RELATIONAL, CUSTOM_SQL, S3]
        dataSourceArn:
          type: string
        name:
          type: string
          description: "Relational: the table name. Custom SQL: the query's display name."
        catalog:
          type: string
          description: Relational only; absent for engines with no catalog concept.
        schema:
          type: string
          description: Relational only. The database for Athena-backed sources.
        sqlQuery:
          type: string
          description: Custom SQL only.
        columnCount:
          type: integer
          description: How many columns are pinned to this table.
        editable:
          type: boolean
          description: False for S3 sources, which have no schema or query to edit.

    DatasetSource:
      type: object
      required: [dataSetId, name, importMode, tables]
      properties:
        dataSetId:
          type: string
        name:
          type: string
        importMode:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/DatasetPhysicalTable'

    DatasetTableEdit:
      type: object
      required: [id]
      description: A change to one physical table. Omitted fields are left alone.
      properties:
        id:
          type: string
        dataSourceArn:
          type: string
          description: Must be one of the account's data sources.
        name:
          type: string
        catalog:
          type: string
          description: Relational only. Send an empty string to clear it.
        schema:
          type: string
          description: Relational only.
        sqlQuery:
          type: string
          description: Custom SQL only.

    DataSourceOption:
      type: object
      required: [id, name, arn]
      properties:
        id:
          type: string
        name:
          type: string
        arn:
          type: string
        type:
          type: string

    # -------------------------------------------------------------------------
    # Authoring - rebind a definition to different datasets
    # -------------------------------------------------------------------------
    ColumnUsage:
      type: object
      description: How many times a column is referenced, by kind of site.
      required: [visual, filter, calculatedField, parameter, control, other]
      properties:
        visual:
          type: integer
        filter:
          type: integer
        calculatedField:
          type: integer
        parameter:
          type: integer
        control:
          type: integer
        other:
          type: integer

    ReferencedColumn:
      type: object
      required: [name, usage]
      properties:
        name:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'

    DefinitionDataset:
      type: object
      description: One DataSetIdentifierDeclarations entry and what the definition takes from it.
      required: [identifier, dataSetArn, dataSetId, columns, calculatedFields]
      properties:
        identifier:
          type: string
        dataSetArn:
          type: string
        dataSetId:
          type: string
        columns:
          type: array
          description: Columns the definition reads from this dataset, calculated fields excluded.
          items:
            $ref: '#/components/schemas/ReferencedColumn'
        calculatedFields:
          type: array
          description: Calculated fields declared against this dataset. Provided by the definition, not the dataset.
          items:
            type: string

    DefinitionDatasets:
      type: object
      required: [assetType, assetId, name, datasets]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionDataset'

    AuthorableAssetType:
      type: string
      enum: [analysis, dashboard]

    RepairOp:
      type: object
      description: |
        One repair, applied by deterministic code before the rebind plan.
        dropColumn removes every reference to a dataset column (field wells,
        filters, sorts, hierarchies, calculated fields reading it; empty
        filter groups go too). dropParameter removes a parameter's
        declaration, controls and filters. declareParameter adds a
        declaration for a parameter that is referenced but never declared.
      required: [op]
      properties:
        op:
          type: string
          enum: [dropColumn, dropParameter, declareParameter]
        identifier:
          type: string
          description: dropColumn - the dataset identifier.
        columnName:
          type: string
          description: dropColumn - the column.
        name:
          type: string
          description: dropParameter / declareParameter - the parameter name.
        type:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATETIME]
          description: declareParameter - the value type.
        defaultValue:
          type: string
          description: declareParameter - an optional static default.

    RepairFix:
      type: object
      description: |
        A fix for one issue. Repair ops as above, plus `rename` (a column
        map entry on the identifier's rebind) and `rebind` (the caller must
        choose a dataset for the identifier).
      required: [op]
      properties:
        op:
          type: string
          enum: [dropColumn, dropParameter, declareParameter, rename, rebind]
        identifier:
          type: string
        columnName:
          type: string
        to:
          type: string
          description: rename - the column in the target that takes its place.
        name:
          type: string
        type:
          type: string
          enum: [STRING, INTEGER, DECIMAL, DATETIME]
        defaultValue:
          type: string

    RepairIssue:
      type: object
      required: [id, kind, severity, message, alternatives]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [dataset-missing, column-missing, parameter-missing, quicksight-error]
        severity:
          type: string
          enum: [error, warning]
        message:
          type: string
        identifier:
          type: string
        dataSetId:
          type: string
        columnName:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'
        parameterName:
          type: string
        quickSight:
          type: object
          description: QuickSight's own error, when it reported this.
          required: [type, message, paths]
          properties:
            type:
              type: string
            message:
              type: string
            paths:
              type: array
              items:
                type: string
        fix:
          $ref: '#/components/schemas/RepairFix'
          description: The proposed fix; absent when the caller must choose or nothing can be done.
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/RepairFix'

    RepairPlan:
      type: object
      required: [issues, summary, proposed]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RepairIssue'
        summary:
          type: object
          required: [fixable, needsChoice, unfixable]
          properties:
            fixable:
              type: integer
            needsChoice:
              type: integer
              description: Issues that need a dataset chosen before they can be fixed.
            unfixable:
              type: integer
        proposed:
          type: object
          description: The proposed fixes in request form, ready for preview and apply.
          required: [repairs, rebinds]
          properties:
            repairs:
              type: array
              items:
                $ref: '#/components/schemas/RepairOp'
            rebinds:
              type: array
              items:
                $ref: '#/components/schemas/RebindRequest'

    VisualSpec:
      type: object
      description: One visual by column names; the builder decides the field wells from the columns' types.
      required: [type, title, identifier, values]
      properties:
        type:
          type: string
          enum: [KPI, BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
        title:
          type: string
        identifier:
          type: string
          description: The dataset identifier every column belongs to.
        category:
          type: string
          description: The dimension (x axis, group-by, pivot rows). Not for KPI.
        granularity:
          type: string
          enum: [DAY, WEEK, MONTH, QUARTER, YEAR]
          description: When the category is a date.
        values:
          type: array
          items:
            type: object
            required: [column]
            properties:
              column:
                type: string
              aggregation:
                type: string
                enum: [SUM, AVERAGE, COUNT, DISTINCT_COUNT, MIN, MAX]
        color:
          type: string
          description: A second dimension (colours, pivot columns).

    NewAssetRequest:
      type: object
      required: [assetType, name, datasets]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        name:
          type: string
        datasets:
          type: array
          minItems: 1
          items:
            type: object
            required: [identifier, dataSetId]
            properties:
              identifier:
                type: string
              dataSetId:
                type: string
        visuals:
          type: array
          items:
            $ref: '#/components/schemas/VisualSpec'
        ask:
          type: string
          description: When visuals are absent, the planner proposes them from this.
        sheetName:
          type: string
        addCalculatedFields:
          type: array
          items:
            $ref: '#/components/schemas/AddedCalculatedField'
        template:
          $ref: '#/components/schemas/TemplateRequest'
        typeRules:
          $ref: '#/components/schemas/TypeRules'
        permissionsFrom:
          type: object
          description: Inherit this asset's audience; defaults to the template's when one is given.
          required: [assetType, assetId]
          properties:
            assetType:
              type: string
              enum: [dashboard, analysis]
            assetId:
              type: string
        folderId:
          type: string
        newAssetId:
          type: string

    NewAssetPreview:
      type: object
      required: [definition, outline, changes, warnings, visuals]
      properties:
        definition:
          type: object
          additionalProperties: true
        outline:
          type: array
          items:
            $ref: '#/components/schemas/SheetOutline'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        warnings:
          type: array
          items:
            type: string
        visuals:
          type: array
          description: The visuals that were built, given or proposed.
          items:
            $ref: '#/components/schemas/VisualSpec'
        proposal:
          type: object
          required: [reason, model]
          properties:
            reason:
              type: string
            model:
              type: object
              required: [provider, model]
              properties:
                provider:
                  type: string
                model:
                  type: string
        themeArn:
          type: string

    NewAssetResult:
      type: object
      required: [assetType, assetId, name, arn, changes, warnings]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        name:
          type: string
        arn:
          type: string
        versionNumber:
          type: integer
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        warnings:
          type: array
          items:
            type: string
        folderId:
          type: string

    TypeRules:
      type: object
      description: |
        Conversions applied to every visual at once. chartFamily: retypes
        every visual of one editable type to another (table to pivot, bar to
        column, pie to donut and the reverse) wherever the field wells
        translate; a visual whose wells do not fit is left alone and named in
        `warnings`. kpi: gauges become KPIs and every KPI takes the
        template's KPI options when a template is given. casts: where the
        dataset a definition now reads has a column of a different type than
        the definition was built for, a calculated field with the cast is
        added and the visuals read it instead.
      properties:
        chartFamily:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
                enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
              to:
                type: string
                enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
        kpi:
          type: boolean
        casts:
          type: boolean

    AuthoringDatasetColumns:
      type: object
      required: [dataSetId, name, columns]
      properties:
        dataSetId:
          type: string
        name:
          type: string
        columns:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              type:
                type: string

    TemplateRequest:
      type: object
      description: |
        Migrate onto a template dashboard's layout standard. The template's
        text boxes and title band come across at their positions, its
        filter and parameter controls where a source dataset has the column,
        its sheet names and its theme; the source's visuals reflow, in
        order, into rows of the template's standard tile size below the
        furniture, KPIs first at the template's KPI size when it has a KPI
        band. Applied after rebinds and before added fields and ops.

        Every part is optional and on by default, so a caller that wants the
        whole standard sends only assetType and assetId.
      required: [assetType, assetId]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        textBoxes:
          type: boolean
          description: Carry the template's text boxes and title band. Default true.
        controls:
          type: boolean
          description: Carry the template's controls where a source column matches. Default true.
        sheetNames:
          type: boolean
          description: Take the template's sheet names. Default true.
        kpisFirst:
          type: boolean
          description: KPIs first at the template's KPI size when it has a KPI band. Default true.
        theme:
          type: boolean
          description: Write the template's theme. Default true.

    RebindRequest:
      type: object
      description: Point one dataset identifier at a different dataset.
      required: [identifier, targetDataSetId]
      properties:
        identifier:
          type: string
          description: A DataSetIdentifierDeclarations entry of the definition.
        targetDataSetId:
          type: string
        columnMap:
          type: object
          description: Source column name to target column name, for names that differ.
          additionalProperties:
            type: string

    ColumnResolutionStatus:
      type: string
      enum: [matched, mapped, suggested, missing]

    ColumnResolution:
      type: object
      required: [name, status, usage]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/ColumnResolutionStatus'
        resolvedTo:
          type: string
          description: The name the definition will use after the rebind (matched or mapped).
        suggestion:
          type: string
          description: A target column that differs only in case, spacing or separators.
        targetType:
          type: string
        usage:
          $ref: '#/components/schemas/ColumnUsage'

    DatasetRebindPlan:
      type: object
      required: [identifier, current, target, columns, unusedTargetColumns, summary]
      properties:
        identifier:
          type: string
        current:
          type: object
          required: [dataSetId, dataSetArn]
          properties:
            dataSetId:
              type: string
            dataSetArn:
              type: string
        target:
          type: object
          required: [dataSetId, dataSetArn, name, columnCount]
          properties:
            dataSetId:
              type: string
            dataSetArn:
              type: string
            name:
              type: string
            columnCount:
              type: integer
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnResolution'
        unusedTargetColumns:
          type: array
          description: Target columns nothing in the definition uses. Informational.
          items:
            type: string
        summary:
          type: object
          required: [matched, mapped, suggested, missing]
          properties:
            matched:
              type: integer
            mapped:
              type: integer
            suggested:
              type: integer
            missing:
              type: integer

    RebindPlan:
      type: object
      required: [assetType, assetId, name, datasets, canApply]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRebindPlan'
        canApply:
          type: boolean
          description: True only when every referenced column is matched or mapped.

    ApplyRebindRequest:
      type: object
      required: [mode, rebinds]
      properties:
        mode:
          type: string
          enum: [update, clone]
        rebinds:
          type: array
          description: May be empty for a rename-only update or a plain clone.
          items:
            $ref: '#/components/schemas/RebindRequest'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required for clone. Optional rename for update.
        newAssetId:
          type: string
          description: Clone only. Generated when omitted.
        addCalculatedFields:
          type: array
          description: |
            Calculated fields to add to the written definition, typically from
            the template library. Each is declared against a dataset
            identifier; a name that already exists there is rejected.
          items:
            $ref: '#/components/schemas/AddedCalculatedField'
        ops:
          type: array
          description: Edits applied after rebinds and added fields, in order.
          items:
            $ref: '#/components/schemas/DefinitionOp'
        repairs:
          type: array
          description: Repairs applied first, before the rebind plan (see the repair plan endpoint).
          items:
            $ref: '#/components/schemas/RepairOp'
        template:
          $ref: '#/components/schemas/TemplateRequest'
        typeRules:
          $ref: '#/components/schemas/TypeRules'
        folderId:
          type: string
          description: Clone only. Put the new asset in this QuickSight folder.

    AddedCalculatedField:
      type: object
      required: [identifier, name, expression]
      properties:
        identifier:
          type: string
        name:
          type: string
        expression:
          type: string
        templateId:
          type: string

    ApplyRebindResult:
      type: object
      required: [assetType, assetId, name, arn, mode, plan]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
          description: The written asset - the source for update, the new asset for clone.
        name:
          type: string
        arn:
          type: string
        mode:
          type: string
          enum: [update, clone]
        versionNumber:
          type: integer
          description: Dashboards only. The version created (and, for update, published).
        plan:
          $ref: '#/components/schemas/RebindPlan'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionChange'
        folderId:
          type: string
          description: The folder the clone was placed in, when requested.
        warnings:
          type: array
          items:
            type: string

    ProposeRequest:
      type: object
      required: [ask]
      properties:
        ask:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the person wants, in their words.
        candidateDataSetIds:
          type: array
          description: Restrict the datasets the planner may choose from. Defaults to every active dataset.
          items:
            type: string

    ProposedRebind:
      allOf:
        - $ref: '#/components/schemas/RebindRequest'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: Why the planner chose this dataset.

    UnmappedColumn:
      type: object
      required: [identifier, column, reason]
      properties:
        identifier:
          type: string
        column:
          type: string
        reason:
          type: string

    Proposal:
      type: object
      required: [ask, intent, mode, reason, rebinds, unmapped, ops, plan, model]
      properties:
        ask:
          type: string
        intent:
          type: string
          enum: [rebind, unclear]
          description: unclear when the ask is not a rebind or clone the planner can express.
        mode:
          type: string
          enum: [update, clone]
        name:
          type: string
          description: Proposed name. Absent means keep the current one.
        reason:
          type: string
        rebinds:
          type: array
          items:
            $ref: '#/components/schemas/ProposedRebind'
        unmapped:
          type: array
          description: Columns the planner looked at and could not map.
          items:
            $ref: '#/components/schemas/UnmappedColumn'
        ops:
          type: array
          description: Layout and visual edits the planner proposes, already validated against the definition.
          items:
            $ref: '#/components/schemas/DefinitionOp'
        plan:
          type: object
          nullable: true
          description: The server's own dry run of the proposal. Null when the intent is unclear.
          allOf:
            - $ref: '#/components/schemas/RebindPlan'
        model:
          type: object
          required: [provider, model]
          properties:
            provider:
              type: string
            model:
              type: string

    RebindPreview:
      type: object
      required: [plan, definition, changes, outline]
      properties:
        plan:
          $ref: '#/components/schemas/RebindPlan'
        definition:
          type: object
          additionalProperties: true
          description: The QuickSight Definition as apply would write it.
        changes:
          type: array
          description: Every change in plain language, in the order it is applied.
          items:
            $ref: '#/components/schemas/DefinitionChange'
        outline:
          type: array
          description: The sheets of the resulting definition, with ids, for editing.
          items:
            $ref: '#/components/schemas/SheetOutline'
        warnings:
          type: array
          description: What a template could not carry, and why.
          items:
            type: string
        themeArn:
          type: string
          description: The theme that would be written when a template is applied.

    SettingSource:
      type: string
      enum: [stored, env, default]

    SettingDefinition:
      type: object
      required: [key, label, description, type, source, sensitive]
      properties:
        key:
          type: string
          description: Dotted key, e.g. smus.domainId
        label:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [string, select, multiselect, boolean]
        value:
          description: The effective value. A string, a list of strings, or a boolean; absent when unset.
          oneOf:
            - type: string
            - type: boolean
            - type: array
              items:
                type: string
        source:
          $ref: '#/components/schemas/SettingSource'
        envVar:
          type: string
          description: The environment variable the setting falls back to.
        sensitive:
          type: boolean
          description: Read-only here; only reports whether the env var is set.
        options:
          type: array
          description: For select and multiselect, the fixed choices when they are static.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        optionsFrom:
          type: string
          description: For multiselect choices fetched live, the endpoint that serves them.

    SettingsGroup:
      type: object
      required: [id, title, description, settings]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SettingDefinition'

    SettingsSnapshot:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SettingsGroup'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    ApiKey:
      type: object
      required: [id, label, prefix, createdAt, createdBy]
      properties:
        id:
          type: string
        label:
          type: string
        prefix:
          type: string
          description: The first characters of the secret, to recognise it in a config file.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastUsedAt:
          type: string
          format: date-time

    ApiKeyCreated:
      type: object
      required: [key, secret]
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: "Shown once. Send it as `Authorization: Bearer <secret>`."

    SettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Setting key to new value. null clears the stored value.
          additionalProperties:
            anyOf:
              - type: string
                nullable: true
              - type: boolean
              - type: array
                items:
                  type: string

    SmusProjectDiagnostics:
      type: object
      description: How the project list was found, so an empty picker can explain itself.
      required: [domainId, region, fromListProjects, listings, publishers]
      properties:
        domainId:
          type: string
        region:
          type: string
        fromListProjects:
          type: integer
          description: Projects DataZone ListProjects returned for the portal's role (member-scoped).
        listings:
          type: integer
          description: Published listings the catalog sweep saw.
        publishers:
          type: integer
          description: Distinct projects that own those listings.
        listProjectsError:
          type: string
        listingsError:
          type: string
        callerArn:
          type: string
          description: The principal DataZone saw (the Lambda's assumed-role session), from STS.
        roleArn:
          type: string
          description: The IAM role behind that session - what smus-grant and the SMUS console register.
        profileStatus:
          type: string
          description: The role's user profile status in the domain, or 'not found'.
        listingsFallback:
          type: string
          description: Set when the per-project listing filter was refused and the domain was swept instead.

    SmusProject:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    SmusAssetColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: The source type as the catalog reports it, e.g. string, bigint, timestamp.

    SmusLinkedDataset:
      type: object
      required: [id, name, matchType]
      properties:
        id:
          type: string
        name:
          type: string
        matchType:
          type: string
          enum: [source-table, custom-sql, name]

    SmusAsset:
      type: object
      required: [listingId, assetId, name, assetType, datasets]
      properties:
        listingId:
          type: string
        assetId:
          type: string
        name:
          type: string
        assetType:
          type: string
        description:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
          description: Deep link to the listing in the SMUS portal.
        table:
          type: object
          description: The Glue table behind the listing, when its forms say.
          required: [database, name]
          properties:
            catalog:
              type: string
            database:
              type: string
            name:
              type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SmusAssetColumn'
        datasets:
          type: array
          description: QuickSight datasets the portal matched to this listing.
          items:
            $ref: '#/components/schemas/SmusLinkedDataset'

    CreateSmusDatasetRequest:
      type: object
      required: [dataSourceId, importMode]
      properties:
        dataSourceId:
          type: string
          description: An existing QuickSight data source (Athena) chosen from the account.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to the listing name.
        importMode:
          type: string
          enum: [DIRECT_QUERY, SPICE]
        permissionsFromDataSetId:
          type: string
          description: Copy this dataset's permissions onto the new one, so it has the same audience.

    GlossaryTerm:
      type: object
      required: [name]
      properties:
        name:
          type: string
        shortDescription:
          type: string

    MetadataForm:
      type: object
      description: One SMUS metadata form, flattened to label/value pairs.
      required: [name, fields]
      properties:
        name:
          type: string
        fields:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string

    SmusCatalogColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
          description: From the SMUS column metadata, when present.

    FieldUsage:
      type: object
      required: [dashboards, analyses]
      properties:
        dashboards:
          type: integer
        analyses:
          type: integer

    FieldUsedIn:
      type: object
      required: [assetType, assetId, assetName]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        assetName:
          type: string

    PortalFieldMetadata:
      type: object
      description: What the portal stores for a field because SMUS has no home for it.
      properties:
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          type: string
        sensitivity:
          type: string
          enum: [public, internal, confidential, restricted]

    FieldVisualUsage:
      type: object
      description: One visual that reads the field.
      required: [assetType, assetId, assetName, visualId, visualName]
      properties:
        assetType:
          type: string
          enum: [dashboard, analysis]
        assetId:
          type: string
        assetName:
          type: string
        sheetName:
          type: string
        visualId:
          type: string
        visualName:
          type: string

    ExpressionVariant:
      type: object
      description: One distinct expression a calculated field has somewhere.
      required: [expression, sources]
      properties:
        expression:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/FieldUsedIn'

    FieldConflict:
      type: object
      description: |
        The same calculated field name defined with different expressions
        across assets. The dataset's own expression is the reference; the
        variants are what dashboards and analyses redefined it as.
      required: [count, variants]
      properties:
        count:
          type: integer
          description: Number of distinct expressions, including the dataset's own.
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ExpressionVariant'

    SmusColumnLink:
      type: object
      description: Where a plain column comes from in SMUS.
      required: [listingId, columnName]
      properties:
        listingId:
          type: string
        columnName:
          type: string
        description:
          type: string
        url:
          type: string

    DatasetCatalogField:
      type: object
      required: [name, dataType, isCalculated, usage, usedIn, references, usedBy]
      properties:
        name:
          type: string
        dataType:
          type: string
        isCalculated:
          type: boolean
        expression:
          type: string
          description: Calculated fields only.
        references:
          type: array
          description: Fields this expression reads (calculated fields only). Lineage downwards.
          items:
            type: string
        usedBy:
          type: array
          description: Calculated fields in the same dataset whose expressions read this field. Lineage upwards.
          items:
            type: string
        usage:
          $ref: '#/components/schemas/FieldUsage'
        usedIn:
          type: array
          description: Dashboards and analyses that use the field.
          items:
            $ref: '#/components/schemas/FieldUsedIn'
        visuals:
          type: array
          description: The visuals that read the field, when the visual-field index has them.
          items:
            $ref: '#/components/schemas/FieldVisualUsage'
        conflict:
          $ref: '#/components/schemas/FieldConflict'
        smus:
          $ref: '#/components/schemas/SmusColumnLink'
        portal:
          $ref: '#/components/schemas/PortalFieldMetadata'
        template:
          type: object
          description: Present when this field is saved in the template library.
          required: [id]
          properties:
            id:
              type: string

    CalculatedFieldTemplate:
      type: object
      description: |
        A calculated field saved for reuse. Author can add it to a copy it
        creates; the catalog shows which fields already match it.
      required: [id, name, expression, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        expression:
          type: string
        dataType:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: object
          description: Where it was saved from, when saved from the catalog.
          properties:
            datasetId:
              type: string
            datasetName:
              type: string
            listingId:
              type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalculatedFieldTemplateInput:
      type: object
      required: [name, expression]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        expression:
          type: string
          minLength: 1
        dataType:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: object
          properties:
            datasetId:
              type: string
            datasetName:
              type: string
            listingId:
              type: string

    CatalogDataset:
      type: object
      required: [id, name, matchType, calculatedFieldCount, fields]
      properties:
        id:
          type: string
        name:
          type: string
        matchType:
          type: string
          enum: [source-table, custom-sql, name]
        importMode:
          type: string
        calculatedFieldCount:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetCatalogField'

    SmusCatalogAssetBase:
      type: object
      required: [listingId, assetId, name, glossaryTerms, columnCount, calculatedFieldCount, usage]
      properties:
        listingId:
          type: string
        assetId:
          type: string
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
        table:
          type: object
          required: [database, name]
          properties:
            catalog:
              type: string
            database:
              type: string
            name:
              type: string
        glossaryTerms:
          type: array
          items:
            $ref: '#/components/schemas/GlossaryTerm'
        columnCount:
          type: integer
        calculatedFieldCount:
          type: integer
        usage:
          $ref: '#/components/schemas/FieldUsage'
        updatedAt:
          type: string
          format: date-time

    SmusCatalogAssetSummary:
      allOf:
        - $ref: '#/components/schemas/SmusCatalogAssetBase'
        - type: object
          required: [datasets]
          properties:
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/SmusLinkedDataset'

    CalculatedFieldRef:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [dashboard, analysis, dataset]
        id:
          type: string
        name:
          type: string

    CatalogListingRef:
      type: object
      required: [listingId, name]
      properties:
        listingId:
          type: string
        name:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string

    CatalogDatasetRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        listing:
          $ref: '#/components/schemas/CatalogListingRef'

    SmusColumnRef:
      type: object
      required: [listingId, name, match, glossaryTerms]
      properties:
        listingId:
          type: string
        name:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        url:
          type: string
        columnName:
          type: string
          description: Absent when the dataset is tied to the listing but the listing's schema does not name the column.
        match:
          type: string
          enum: [exact, normalized, listing-only]
          description: How the column tied back - exact name, normalized name (case, separators, camel humps), or the listing alone.
        description:
          type: string
        glossaryTerms:
          type: array
          items:
            type: string

    CalculatedFieldSummary:
      type: object
      required: [key, name, expression, definedIn, datasets, references, usedBy, hasNote]
      properties:
        key:
          type: string
          description: Stable id for one distinct (name, expression).
        name:
          type: string
        expression:
          type: string
        dataType:
          type: string
        definedIn:
          type: array
          items:
            $ref: '#/components/schemas/CalculatedFieldRef'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDatasetRef'
        references:
          type: array
          items:
            type: string
        usedBy:
          type: object
          required: [dashboards, analyses, visuals]
          properties:
            dashboards:
              type: integer
            analyses:
              type: integer
            visuals:
              type: integer
        conflict:
          type: object
          description: Other expressions carrying the same name.
          required: [variants]
          properties:
            variants:
              type: integer
        template:
          type: object
          required: [id]
          properties:
            id:
              type: string
        hasNote:
          type: boolean

    CalculatedFieldCatalog:
      type: object
      required: [configured, exportedAt, projectFilter, counts, items]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
        projectFilter:
          type: array
          items:
            type: string
        counts:
          type: object
          required: [fields, names, conflicts, templated, unused, datasets]
          properties:
            fields:
              type: integer
            names:
              type: integer
            conflicts:
              type: integer
            templated:
              type: integer
            unused:
              type: integer
            datasets:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalculatedFieldSummary'

    LineageRead:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [column, calculated]
        key:
          type: string
        dataType:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        smus:
          $ref: '#/components/schemas/SmusColumnRef'

    CalculatedFieldDetail:
      allOf:
        - $ref: '#/components/schemas/CalculatedFieldSummary'
        - type: object
          required: [variants, reads, readBy, usedIn, visuals]
          properties:
            variants:
              type: array
              description: Every distinct expression under this name, this one included.
              items:
                type: object
                required: [key, expression, definedIn]
                properties:
                  key:
                    type: string
                  expression:
                    type: string
                  definedIn:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalculatedFieldRef'
            reads:
              type: array
              items:
                $ref: '#/components/schemas/LineageRead'
            readBy:
              type: array
              items:
                type: object
                required: [key, name, expression, definedIn]
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  expression:
                    type: string
                  definedIn:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalculatedFieldRef'
            usedIn:
              type: array
              items:
                $ref: '#/components/schemas/FieldUsedIn'
            visuals:
              type: array
              items:
                $ref: '#/components/schemas/FieldVisualUsage'
            portal:
              $ref: '#/components/schemas/PortalFieldMetadata'

    ColumnCatalogItem:
      type: object
      required: [name, datasets, usedBy, usedByCalculated]
      properties:
        name:
          type: string
        dataType:
          type: string
          description: Absent when the dataset export did not say (QuickSight leaves OutputColumns.Type out for some columns).
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/CatalogDatasetRef'
        smus:
          $ref: '#/components/schemas/SmusColumnRef'
        usedBy:
          type: object
          required: [dashboards, analyses, visuals]
          properties:
            dashboards:
              type: integer
            analyses:
              type: integer
            visuals:
              type: integer
        usedByCalculated:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key:
                type: string
              name:
                type: string

    ColumnCatalog:
      type: object
      required: [configured, exportedAt, counts, items]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
        counts:
          type: object
          required: [columns, datasets, withSmus, withSmusColumn]
          properties:
            columns:
              type: integer
            datasets:
              type: integer
            withSmus:
              type: integer
              description: Columns whose dataset is tied to a SMUS listing.
            withSmusColumn:
              type: integer
              description: Of those, the ones the listing's own schema names.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ColumnCatalogItem'

    SmusCatalogAsset:
      allOf:
        - $ref: '#/components/schemas/SmusCatalogAssetBase'
        - type: object
          required: [forms, columns, datasets]
          properties:
            forms:
              type: array
              items:
                $ref: '#/components/schemas/MetadataForm'
            columns:
              type: array
              items:
                $ref: '#/components/schemas/SmusCatalogColumn'
            datasets:
              type: array
              items:
                $ref: '#/components/schemas/CatalogDataset'

    SmusCatalog:
      type: object
      required: [configured, projectFilter, projects, glossaryTerms, assets, exportedAt]
      properties:
        configured:
          type: boolean
        exportedAt:
          type: string
          format: date-time
          nullable: true
          description: When the SMUS snapshot was taken; null when no export has run.
        projectFilter:
          type: array
          items:
            type: string
        projects:
          type: array
          description: Projects present in the result, with counts, for filtering.
          items:
            type: object
            required: [id, name, count]
            properties:
              id:
                type: string
              name:
                type: string
              count:
                type: integer
        glossaryTerms:
          type: array
          description: Terms present in the result, with counts, for filtering.
          items:
            allOf:
              - $ref: '#/components/schemas/GlossaryTerm'
              - type: object
                required: [count]
                properties:
                  count:
                    type: integer
        assets:
          type: array
          items:
            $ref: '#/components/schemas/SmusCatalogAssetSummary'

    DefinitionOp:
      type: object
      description: |
        One edit to a definition, applied by deterministic code after
        validation. Element and visual ids are the definition's own; a sheet
        outline (see RebindPreview.outline) lists them. Changing a visual's
        type keeps its field wells, title and subtitle and resets the rest of
        the chart configuration to defaults; only conversions whose field
        wells translate are allowed.
      required: [op, sheetId]
      properties:
        op:
          type: string
          enum: [move, resize, retype, retitle, remove, duplicate, renameSheet]
        sheetId:
          type: string
        elementId:
          type: string
          description: move, resize, remove, duplicate, retype, retitle. The layout element id (the visual id for visuals).
        col:
          type: integer
          minimum: 0
          maximum: 35
          description: move, duplicate. Grid column, 0-35.
        row:
          type: integer
          minimum: 0
          description: move, duplicate. Grid row.
        colSpan:
          type: integer
          minimum: 1
          maximum: 36
          description: resize.
        rowSpan:
          type: integer
          minimum: 1
          description: resize.
        visualType:
          type: string
          enum: [BarChart, ColumnChart, LineChart, PieChart, DonutChart, Table, PivotTable]
          description: retype. Column is a vertical bar chart; Donut is a pie with a hole.
        title:
          type: string
          description: retitle, duplicate.
        subtitle:
          type: string
          description: retitle.
        name:
          type: string
          description: renameSheet.

    DefinitionChange:
      type: object
      description: One change in plain language, for review before publishing.
      required: [kind, description]
      properties:
        kind:
          type: string
          enum: [template, repair, rebind, rename, calculatedField, layout, visual, sheet]
        description:
          type: string
        sheetId:
          type: string
        elementId:
          type: string

    SheetOutlineElement:
      type: object
      required: [elementId, kind]
      properties:
        elementId:
          type: string
        kind:
          type: string
          enum: [visual, filterControl, parameterControl, textBox, image, other]
        visualType:
          type: string
        title:
          type: string
        col:
          type: integer
        row:
          type: integer
        colSpan:
          type: integer
        rowSpan:
          type: integer
        fieldWells:
          type: array
          items:
            type: object
            required: [role, fields]
            properties:
              role:
                type: string
              fields:
                type: array
                items:
                  type: string

    SheetOutline:
      type: object
      description: A compact, id-bearing view of a sheet for editing and for the planner.
      required: [sheetId, name, layout, elements]
      properties:
        sheetId:
          type: string
        name:
          type: string
        layout:
          type: string
          enum: [grid, freeform, section, flow]
        elements:
          type: array
          items:
            $ref: '#/components/schemas/SheetOutlineElement'

    VisualHealth:
      type: object
      required: [sheetId, visualId]
      properties:
        sheetId:
          type: string
        visualId:
          type: string
        loadTimeP90Ms:
          type: number
        errors:
          type: integer
          description: Load errors over the window.

    AssetInsights:
      type: object
      description: |
        What the portal knows about how an asset is used, to rank sources and
        flag problems before they are cloned. Views come from the portal's
        activity data (CloudTrail); health comes from QuickSight's CloudWatch
        metrics when the dashboard has them.
      required: [assetType, assetId, views]
      properties:
        assetType:
          $ref: '#/components/schemas/AuthorableAssetType'
        assetId:
          type: string
        views:
          type: object
          required: [total, last30d, uniqueViewers]
          properties:
            total:
              type: integer
            last30d:
              type: integer
            uniqueViewers:
              type: integer
            lastViewedAt:
              type: string
              format: date-time
        health:
          type: object
          description: Dashboards only. Absent when metrics are unavailable.
          required: [windowDays, viewLoads, visuals]
          properties:
            windowDays:
              type: integer
            viewLoads:
              type: integer
            viewLoadTimeP90Ms:
              type: number
            visuals:
              type: array
              items:
                $ref: '#/components/schemas/VisualHealth'

    AssetHealth:
      type: object
      required: [id]
      properties:
        id:
          type: string
        viewLoads:
          type: integer
          description: Dashboards. Views over the window.
        viewLoadTimeP90Ms:
          type: number
          description: Dashboards.
        visualErrors:
          type: integer
          description: Dashboards. Visual load errors over the window.
        ingestionRuns:
          type: integer
          description: Datasets. Refreshes over the window.
        ingestionLatencyP90Ms:
          type: number
          description: Datasets.
        ingestionErrorRows:
          type: integer
          description: Datasets. Rows skipped for errors over the window.

    AssetHealthBatch:
      type: object
      required: [assetType, windowDays, available, items]
      properties:
        assetType:
          type: string
          enum: [dashboard, dataset]
        windowDays:
          type: integer
        available:
          type: boolean
          description: False when CloudWatch could not be read (no metrics or no permission); items are then empty.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetHealth'

    BulkItemFailure:
      type: object
      required: [item, error]
      properties:
        item:
          type: string
          description: Human-readable item label, e.g. "alice → analysts"
        error:
          type: string
          description: Failure reason as reported by the underlying operation

    ExportJobStatus:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [jobId, status, progress, startTime]
          properties:
            jobId:
              type: string
            status:
              $ref: '#/components/schemas/JobStatus'
            progress:
              type: integer
              minimum: 0
              maximum: 100
              description: Completion percentage
            message:
              type: string
              description: Current operation or status message
            startTime:
              type: string
              format: date-time
            lastUpdatedTime:
              type: string
              format: date-time
              description: |
                Heartbeat - stamped on every job write. The UI uses it to show
                worker liveness ("active Ns ago") and flag stalled jobs.
            endTime:
              type: string
              format: date-time
              nullable: true
            duration:
              type: integer
              description: Duration in milliseconds
              nullable: true
            stats:
              type: object
              properties:
                totalAssets:
                  type: integer
                processedAssets:
                  type: integer
                failedAssets:
                  type: integer
                apiCalls:
                  type: integer
            error:
              type: string
              description: |
                Why the job failed, or - for a completed bulk job with partial
                failures - the distinct per-item failure reasons with counts.
            failures:
              type: array
              description: |
                Item-level failures for bulk jobs (capped; the full list is on
                the job result). Present only when at least one item failed.
              items:
                $ref: '#/components/schemas/BulkItemFailure'
            phases:
              type: array
              description: |
                Optional step-based progress. Present for jobs that emit phases
                (e.g. activity-refresh). Older job types omit this field.
              items:
                $ref: '#/components/schemas/JobPhase'
            checkpoint:
              type: object
              description: |
                Resumable-export progress (export jobs only). Written after
                each asset type completes so continuation invocations resume
                where the previous one paused; the UI renders it as per-type
                progress.
              properties:
                completedAssetTypes:
                  type: array
                  items:
                    type: string
                hydratedAssetTypes:
                  type: array
                  items:
                    type: string
                catalogPending:
                  type: boolean
                totalProcessed:
                  type: integer
                updatedAt:
                  type: string
                  format: date-time

    ExportJobList:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [jobs]
          properties:
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/JobStatus'
                
    ExportJobLogs:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [jobId, logs]
          properties:
            jobId:
              type: string
            logs:
              type: array
              items:
                type: object
                required: [timestamp, level, message]
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  level:
                    type: string
                    enum: [info, warn, error]
                  message:
                    type: string
                  details:
                    type: object
                    description: Additional context or metadata

    # Ingestion schemas
    Ingestion:
      type: object
      required: [id, datasetId, status, createdTime]
      properties:
        id:
          type: string
          description: Ingestion ID
        datasetId:
          type: string
          description: Dataset ID
        datasetName:
          type: string
          description: Dataset name
        datasetArn:
          type: string
          description: Dataset ARN
        datasourceType:
          type: string
          description: Type of datasource (S3, REDSHIFT, etc.)
        importMode:
          type: string
          enum: [SPICE, DIRECT_QUERY]
          description: Import mode of the dataset (SPICE or DIRECT_QUERY)
        sizeInBytes:
          type: integer
          description: Size of the dataset in bytes (SPICE capacity)
        ingestionArn:
          type: string
          description: Ingestion ARN
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, CANCELLED, INITIALIZED, QUEUED]
          description: Ingestion status
        createdTime:
          type: string
          format: date-time
          description: When the ingestion was created
        ingestionTimeInSeconds:
          type: integer
          description: Time taken for ingestion in seconds
        ingestionSizeInBytes:
          type: integer
          description: Size of data ingested in bytes
        rowsIngested:
          type: integer
          description: Number of rows successfully ingested
        rowsDropped:
          type: integer
          description: Number of rows dropped during ingestion
        errorType:
          type: string
          description: Type of error if failed
        errorMessage:
          type: string
          description: Error message if failed
        requestType:
          type: string
          enum: [INITIAL_INGESTION, INCREMENTAL_REFRESH, FULL_REFRESH, EDIT]
          description: Type of ingestion request
        queueInfo:
          type: object
          properties:
            waitingOnIngestion:
              type: string
              description: ID of ingestion this is waiting on
            queuedIngestion:
              type: string
              description: ID of queued ingestion

    # SMUS (SageMaker Unified Studio) schemas
    SearchableType:
      type: string
      enum: [dashboard, analysis, dataset, datasource, folder, smus-listing, calculated-field, visual, template]

    SearchAssetRef:
      type: object
      required: [type, id, name]
      properties:
        type:
          type: string
          enum: [dashboard, analysis, dataset]
        id:
          type: string
        name:
          type: string

    SearchHit:
      type: object
      required: [type, id, name, score, why, summary, path]
      properties:
        type:
          $ref: '#/components/schemas/SearchableType'
        id:
          type: string
        name:
          type: string
        score:
          type: number
        why:
          type: array
          description: 'Which field matched which query word, e.g. "column: revenue".'
          items:
            type: string
        summary:
          type: string
          description: One line for a person or an agent.
        path:
          type: string
          description: Where to open it in the portal.
        description:
          type: string
        views:
          type: integer
        updatedAt:
          type: string
          format: date-time
        expression:
          type: string
          description: Calculated fields and templates - the expression.
        parent:
          $ref: '#/components/schemas/SearchAssetRef'
          description: The asset a calculated field or visual belongs to.
        definedIn:
          type: array
          description: Calculated fields - every asset that defines this exact expression.
          items:
            $ref: '#/components/schemas/SearchAssetRef'

    SearchResponse:
      type: object
      required: [q, hits, indexed, indexedAt]
      properties:
        q:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        indexed:
          type: object
          description: Documents considered, by type.
          additionalProperties:
            type: integer
        indexedAt:
          type: string
          format: date-time

    SmusStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether a SMUS domain is configured for this portal
        domainId:
          type: string
          description: DataZone domain identifier backing the SMUS domain
        region:
          type: string
        portalUrl:
          type: string
          description: Base URL of the SMUS portal used for deep links
        snapshot:
          $ref: '#/components/schemas/SmusSnapshotSummary'
          description: The last SMUS export; absent when none has run.

    SmusSnapshotSummary:
      type: object
      description: What the last SMUS export captured, for the Operations page and empty states.
      required: [exportedAt, projectFilter, projects, listings, publishers]
      properties:
        exportedAt:
          type: string
          format: date-time
        projectFilter:
          type: array
          description: The project ids the listings were limited to; empty means the whole domain.
          items:
            type: string
        domainId:
          type: string
        region:
          type: string
        projects:
          type: integer
          description: Projects in the snapshot (ListProjects unioned with listing publishers).
        listings:
          type: integer
          description: Published listings captured.
        publishers:
          type: integer
          description: Distinct projects owning those listings.
        jobId:
          type: string
          description: The export job that wrote the snapshot.
        diagnostics:
          $ref: '#/components/schemas/SmusProjectDiagnostics'

    SmusExportQueued:
      type: object
      required: [jobId, status, message]
      properties:
        jobId:
          type: string
        status:
          type: string
        message:
          type: string

    SmusDatasetLink:
      type: object
      required: [datasetId, linked]
      properties:
        datasetId:
          type: string
          description: QuickSight dataset identifier
        linked:
          type: boolean
          description: Whether a matching SMUS catalog listing was found
        matchType:
          type: string
          enum: [source-table, custom-sql, name]
          description: >
            How the dataset was matched, in descending confidence — by a
            relational source table (schema.table), by a db.table reference
            parsed from custom SQL, or by the dataset's display name
        listingId:
          type: string
          description: SMUS catalog listing identifier
        assetId:
          type: string
          description: Underlying DataZone asset identifier
        listingName:
          type: string
          description: Name of the matched catalog listing
        url:
          type: string
          description: Deep link to the listing in the SMUS portal

    IngestionMetadata:
      type: object
      required: [totalIngestions, runningIngestions, failedIngestions, lastUpdated]
      properties:
        totalIngestions:
          type: integer
          description: Total number of ingestions
        runningIngestions:
          type: integer
          description: Number of currently running ingestions
        failedIngestions:
          type: integer
          description: Number of failed ingestions
        lastUpdated:
          type: string
          format: date-time
          description: When the data was last updated

    IngestionListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [ingestions, metadata, pagination]
          properties:
            ingestions:
              type: array
              items:
                $ref: '#/components/schemas/Ingestion'
            metadata:
              $ref: '#/components/schemas/IngestionMetadata'
            pagination:
              type: object
              required: [page, pageSize, totalItems, totalPages, hasMore]
              properties:
                page:
                  type: integer
                pageSize:
                  type: integer
                totalItems:
                  type: integer
                totalPages:
                  type: integer
                hasMore:
                  type: boolean

    # Data Catalog schemas
    TagWithCount:
      type: object
      required: [key, value, count]
      properties:
        key:
          type: string
          description: Tag key
        value:
          type: string
          description: Tag value
        count:
          type: integer
          description: Number of assets with this tag

    CatalogAsset:
      type: object
      required: [id, name, type, fieldCount]
      properties:
        id:
          type: string
          description: Asset ID
        name:
          type: string
          description: Asset name
        type:
          type: string
          description: Asset type (dashboard, analysis, dataset)
        fieldCount:
          type: integer
          description: Number of fields from this asset in the catalog

    CatalogField:
      type: object
      required: [fieldId, fieldName, dataType, isCalculated, sourceAssetType, sourceAssetId, sourceAssetName]
      properties:
        fieldId:
          type: string
        fieldName:
          type: string
        dataType:
          type: string
        description:
          type: string
        isCalculated:
          type: boolean
        sourceAssetType:
          type: string
        sourceAssetId:
          type: string
        sourceAssetName:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        columnName:
          type: string
          nullable: true
        expression:
          type: string
          nullable: true
        expressions:
          type: array
          items:
            type: object
            properties:
              expression:
                type: string
              sources:
                type: array
                items:
                  type: object
                  properties:
                    assetType:
                      type: string
                    assetId:
                      type: string
                    assetName:
                      type: string
                    dataType:
                      type: string
                    lastUpdated:
                      type: string
        dependencies:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldSource'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFieldSource'
        hasVariants:
          type: boolean
        usageCount:
          type: integer
        analysisCount:
          type: integer
        dashboardCount:
          type: integer
        datasetCount:
          type: integer
        expressionLength:
          type: integer
          description: Trimmed character length of the representative expression.
        hasComments:
          type: boolean
          description: Whether any in-scope variant of this calculated field contains author comments.
        fieldReferences:
          type: array
          description: Field names referenced by this calculated field's expression(s).
          items:
            type: string
        hasExpressionConflict:
          type: boolean
          description: True when the same field name resolves to more than one distinct expression across assets.
        conflictCount:
          type: integer
          description: Number of distinct expressions found for this field name.
        usedBy:
          type: array
          description: Names of calculated fields that reference this field (reverse lineage).
          items:
            type: string

    CatalogFieldSource:
      type: object
      properties:
        assetType:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        datasetId:
          type: string
        datasetName:
          type: string
        dataType:
          type: string
        lastUpdated:
          type: string

    DataCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogField'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer
            hasMore:
              type: boolean
        summary:
          type: object
          properties:
            totalFields:
              type: integer
            distinctFields:
              type: integer
            totalCalculatedFields:
              type: integer
            calculatedDatasetFields:
              type: integer
            calculatedAnalysisFields:
              type: integer
            visualFields:
              type: integer
            fieldsByDataType:
              type: object
              additionalProperties:
                type: integer
            fieldsWithVariants:
              type: integer
            fieldsWithComments:
              type: integer
            fieldsWithConflicts:
              type: integer
            avgExpressionLength:
              type: integer
            lastUpdated:
              type: string
              format: date-time
            processingTimeMs:
              type: integer

    CatalogStats:
      type: object
      properties:
        totalAssets:
          type: integer
        assetsByType:
          type: object
          additionalProperties:
            type: integer
        totalFields:
          type: integer
        totalTags:
          type: integer
        lastUpdated:
          type: string
          format: date-time

    VisualFieldCatalogResponse:
      type: object
      properties:
        visualFields:
          type: array
          items:
            type: object
            properties:
              fieldId:
                type: string
              visualId:
                type: string
              visualName:
                type: string
              sheetId:
                type: string
              sheetName:
                type: string
              dashboardId:
                type: string
              dashboardName:
                type: string
              fieldName:
                type: string
              dataType:
                type: string
              isCalculated:
                type: boolean
              lastUpdated:
                type: string
        summary:
          type: object
          properties:
            totalVisualFields:
              type: integer
            totalVisuals:
              type: integer
            totalSheets:
              type: integer
            totalDashboards:
              type: integer
            lastUpdated:
              type: string
              format: date-time
            processingTimeMs:
              type: integer

    UserInactiveAnalysis:
      type: object
      required: [analysisId, analysisName, totalViews, uniqueViewers]
      properties:
        analysisId:
          type: string
        analysisName:
          type: string
        createdTime:
          type: string
          format: date-time
          nullable: true
        lastUpdatedTime:
          type: string
          format: date-time
          nullable: true
        totalViews:
          type: integer
          minimum: 0
        uniqueViewers:
          type: integer
          minimum: 0
        lastViewed:
          type: string
          format: date-time
          nullable: true

    UserUnusedDataset:
      type: object
      required: [datasetId, datasetName, importMode, sizeInBytes]
      properties:
        datasetId:
          type: string
        datasetName:
          type: string
        createdTime:
          type: string
          format: date-time
          nullable: true
        lastUpdatedTime:
          type: string
          format: date-time
          nullable: true
        importMode:
          type: string
          enum: [SPICE, DIRECT_QUERY]
        sizeInBytes:
          type: integer
          minimum: 0
        sizeFormatted:
          type: string
          nullable: true
          description: Human-readable size (e.g. "12.5 MB", "1.2 GB") for SPICE datasets

    ResolvedRecipient:
      type: object
      required: [userName, email]
      properties:
        userName:
          type: string
        email:
          type: string

    # Error responses
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'