  /api/authoring/datasets/{dataSetId}/columns:
    get:
      operationId: getAuthoringDatasetColumns
      summary: The columns a dataset exposes
      description: |
        For building an asset that does not exist yet, and so has no definition
        to read its columns from. Described live, falling back to the dataset's
        export when QuickSight cannot describe it (flat files), exactly as a
        rebind target is resolved.
      tags: [Authoring]
      parameters:
        - name: dataSetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The dataset's output columns
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuthoringDatasetColumns'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/authoring/new/propose:
    post:
      operationId: postAuthoringNewPropose
      tags: [Authoring]
      summary: A dashboard or analysis from nothing - the planner proposes the visuals
      description: |
        The same body as the preview, with `ask` and no `visuals`: the planner
        proposes visuals from the datasets' columns. It runs as a job (a long
        think would outlive the gateway): poll `GET /api/jobs/{jobId}` until
        `completed`, then `GET /api/jobs/{jobId}/result` is a
        `NewAssetPreview` whose `visuals` can be edited and sent to the
        preview and create endpoints as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetRequest'
      responses:
        '202':
          description: The planner job was queued; its result is a NewAssetPreview
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/JobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/new/preview:
    post:
      operationId: postAuthoringNewPreview
      tags: [Authoring]
      summary: A dashboard or analysis from nothing - preview
      description: |
        The datasets it should read and the visuals it should show, described
        by column names. Field wells follow each column's type. Optionally
        laid out on a template standard and passed through type rules.
        Nothing is written; the response is the definition, its outline, the
        visuals that were built, and what could not be built. An `ask` with
        no `visuals` is refused here: it is the planner's job, see
        `/api/authoring/new/propose`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetRequest'
      responses:
        '200':
          description: The definition as create would write it
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NewAssetPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/new:
    post:
      operationId: postAuthoringNew
      tags: [Authoring]
      summary: A dashboard or analysis from nothing - create
      description: |
        Same body as the preview. Creates the asset with the audience of
        `permissionsFrom` (or the template's), puts it in `folderId` when
        given, records the write and tags the asset with provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAssetRequest'
      responses:
        '200':
          description: The created asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NewAssetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/authoring/{assetType}/{assetId}/insights:
    get:
      operationId: getAuthoringByAssetTypeByAssetIdInsights
      tags: [Authoring]
      summary: How an asset is used and how healthy it is, for choosing what to start from
      parameters:
        - $ref: '#/components/parameters/AuthorableAssetType'
        - $ref: '#/components/parameters/AuthoringAssetId'
      responses:
        '200':
          description: Views and, for dashboards with metrics, health
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AssetInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/activity/health:
    get:
      operationId: getActivityHealth
      tags: [Activity]
      summary: QuickSight CloudWatch health for a page of dashboards or datasets
      description: |
        One batched CloudWatch read for the ids given (up to 100): for
        dashboards, views, p90 view load time and visual load errors over the
        window; for datasets, refresh runs, p90 ingestion latency and error
        rows. Ids without metrics come back with only their id. Cached per
        Lambda container for a few minutes.
      parameters:
        - name: assetType
          in: query
          required: true
          schema:
            type: string
            enum: [dashboard, dataset]
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated asset ids, at most 100.
      responses:
        '200':
          description: Health per asset
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AssetHealthBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/assets/{assetType}/{assetId}/rename:
    post:
      operationId: postAssetsByAssetTypeByAssetIdRename
      tags: [Assets]
      summary: Rename an asset live in QuickSight
      description: |
        Renames the asset in QuickSight and updates the portal cache
        immediately. Dashboards get a new version published so viewers see
        the new name; analyses and datasets are updated in place; folders
        use the name-only update API. Data sources, users, and groups
        cannot be renamed. The exported asset file refreshes on the next
        Smart Sync.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, folder]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The new asset name
      responses:
        '200':
          description: Asset renamed
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: The applied (trimmed) name
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/assets/{assetType}/{assetId}/revoke-permissions:
    post:
      operationId: postAssetsByAssetTypeByAssetIdRevokePermissions
      tags: [Assets]
      summary: Bulk revoke direct permissions from an asset
      description: Queues a bulk operation to remove direct permissions for multiple principals from the specified asset. Does not affect inherited permissions from folders or groups. Returns a job ID for tracking progress.
      parameters:
        - name: assetType
          in: path
          required: true
          schema:
            type: string
            enum: [dashboard, analysis, dataset, datasource, folder]
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revocations]
              properties:
                revocations:
                  type: array
                  items:
                    type: object
                    required: [principal, actions]
                    properties:
                      principal:
                        type: string
                        description: The ARN of the principal to revoke
                      actions:
                        type: array
                        items:
                          type: string
                        description: The actions to revoke
      responses:
        '202':
          description: Permission revoke job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

