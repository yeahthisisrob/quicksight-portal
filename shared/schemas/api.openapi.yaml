        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/groups/{groupName}/assets:
    get:
      operationId: getGroupsByGroupNameAssets
      tags: [Groups]
      summary: Get assets accessible by a group
      description: Returns all assets that a group has access to through direct permissions or folder membership
      parameters:
        - name: groupName
          in: path
          required: true
          schema:
            type: string
          description: The name of the group
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
      responses:
        '200':
          description: List of accessible assets
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [groupName, totalAssets, assets]
                    properties:
                      groupName:
                        type: string
                      totalAssets:
                        type: integer
                      assetsByType:
                        type: object
                        properties:
                          dashboards:
                            type: integer
                          datasets:
                            type: integer
                          analyses:
                            type: integer
                          datasources:
                            type: integer
                          folders:
                            type: integer
                      assets:
                        type: array
                        items:
                          type: object
                          required: [assetId, assetType, assetName, accessType]
                          properties:
                            assetId:
                              type: string
                            assetType:
                              $ref: '#/components/schemas/AssetType'
                            assetName:
                              type: string
                            arn:
                              type: string
                            accessType:
                              type: string
                              enum: [direct, folder_inherited]
                              description: How the group has access to this asset
                            folderPath:
                              type: string
                              description: Folder path if access is inherited from folder
                            permissions:
                              type: array
                              items:
                                type: string
                              description: List of permissions the group has on this asset
        '404':
          description: Group not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{userName}/asset-access:
    get:
      operationId: getUsersByUserNameAssetAccess
      tags: [Users]
      summary: Get assets accessible by a user
      description: Returns all assets that a user has access to through direct permissions, group membership, or folder membership
      parameters:
        - name: userName
          in: path
          required: true
          schema:
            type: string
          description: The name of the user
        - name: assetType
          in: query
          schema:
            $ref: '#/components/schemas/AssetType'
          description: Filter by asset type (optional)
      responses:
        '200':
          description: List of accessible assets with access sources
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserAssetAccessResponse'
        '404':
