version: 2
updates:
  # One entry for the whole pnpm workspace. Dependabot resolves every package
  # through the single pnpm-lock.yaml, so a bump lands in one PR that is
  # consistent across backend, frontend, cdk and shared - which is exactly the
  # drift the workspace migration was meant to remove. Four separate entries
  # against four lockfiles could (and did) leave packages on different versions
  # of the same tool.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      # AWS SDK ships very frequently and its packages must move together.
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      # Everything that only lints, formats, tests or builds. Safe to take in
      # bulk because CI proves it.
      tooling:
        patterns:
          - "@biomejs/*"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "storybook"
          - "@storybook/*"
          - "openapi-typescript"
          - "@redocly/*"
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
