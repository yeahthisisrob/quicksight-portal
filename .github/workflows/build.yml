name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v3
        with:
          version: 2026.9.2
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm -r run build` walks the workspace in dependency order, so the
      # shared package regenerates the API types before the backend and
      # frontend compile against them.
      - name: Build
        run: pnpm -r run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/lambda/dist/
          retention-days: 7

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
