# One workspace, one lockfile. Each package keeps its own package.json and
# scripts; the root drives them with `pnpm --filter`.
packages:
  - backend/lambda
  - frontend
  - infrastructure/cdk
  - shared
  - tooling/*

# pnpm blocks postinstall scripts by default. Allow only the ones that fetch or
# compile a native binary the toolchain actually runs; everything else stays
# blocked so a transitive package cannot execute code at install time.
allowBuilds:
  esbuild: true # Lambda + Vite bundler
  '@swc/core': true # Storybook transform
  '@parcel/watcher': true # Storybook/Vite file watching
  unrs-resolver: true # eslint import resolver
  aws-sdk: false # deprecated v2, pulled in transitively; its build is not needed
  vue-demi: set this to true or false
