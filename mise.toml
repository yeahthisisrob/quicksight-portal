# Host toolchain. `mise install` gets every contributor and CI the same
# binaries; mise.lock pins them by checksum per platform.
#
# node is the host twin of the Lambda runtime (nodejs22.x in sam/template.yaml
# and Runtime.NODEJS_22_X in the CDK stack) so what you run locally is what
# runs deployed.
#
# pnpm replaces npm: one lockfile and one content-addressed store for all four
# workspace packages, so a stray `install` in one of them can no longer drift
# a dependency out from under the others.

[tools]
node = "22.23.2"
pnpm = "12.4.2"
just = "1.58.0"
lefthook = "2.1.14"
gitleaks = "8.30.1"

[settings]
# Record resolved versions + checksums in mise.lock; `mise install` verifies them.
lockfile = true
